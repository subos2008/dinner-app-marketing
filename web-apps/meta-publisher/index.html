<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ComeJoinUs - Publisher</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');

  :root {
    --bg: #F8F8FA;
    --surface: #FFFFFF;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #AEAEB2;
    --separator: #E5E5EA;
    --accent: #C8956C;
    --accent-light: #F3E8DD;
    --accent-dark: #8B5E3C;
    --red: #FF3B30;
    --green: #34C759;
    --blue: #007AFF;
    --orange: #FF9500;
    --tab-bar-bg: rgba(249, 249, 249, 0.94);
    --top-bar-bg: rgba(249, 249, 249, 0.94);
    --radius: 10px;
    --radius-lg: 14px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.4;
    font-weight: 400;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .hidden { display: none !important; }

  .loading-overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--text-secondary);
    z-index: 200;
  }

  .login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    padding: 24px;
    z-index: 150;
  }

  .login-card { width: 100%; max-width: 360px; text-align: center; }
  .login-card h1 { font-family: var(--font-display); font-size: 28px; font-weight: 400; margin-bottom: 8px; }
  .login-card p { color: var(--text-secondary); margin-bottom: 28px; font-size: 15px; }

  .login-card input {
    width: 100%; padding: 14px 16px;
    border: 1px solid var(--separator); border-radius: var(--radius);
    font-family: var(--font-body); font-size: 16px;
    margin-bottom: 12px; background: var(--surface);
    color: var(--text-primary); -webkit-appearance: none;
  }

  .login-card input:focus { outline: none; border-color: var(--accent); }

  .login-card button {
    width: 100%; padding: 14px;
    background: var(--accent); color: white; border: none;
    border-radius: var(--radius);
    font-family: var(--font-body); font-size: 16px; font-weight: 600;
    cursor: pointer; -webkit-appearance: none;
  }

  .login-card button:active { background: var(--accent-dark); }
  .login-card button:disabled { opacity: 0.5; cursor: default; }
  .login-message { margin-top: 16px; font-size: 14px; color: var(--green); }
  .login-message.error { color: var(--red); }

  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
  }

  .topbar {
    position: relative; z-index: 100;
    background: var(--top-bar-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    padding-top: var(--safe-top);
    border-bottom: 0.5px solid var(--separator);
    flex-shrink: 0;
  }

  .topbar-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 44px; padding: 0 16px;
  }

  .topbar-title { font-family: var(--font-display); font-size: 17px; font-weight: 400; letter-spacing: -0.2px; }
  .topbar-btn { background: none; border: none; color: var(--accent); font-size: 15px; cursor: pointer; padding: 4px 8px; font-family: var(--font-body); }

  .tab-bar { display: flex; gap: 0; padding: 6px 16px 4px; background: var(--top-bar-bg); }
  .tab-btn {
    flex: 1; text-align: center; padding: 8px 0;
    background: none; border: none; font-family: var(--font-body); font-size: 13px;
    color: var(--text-tertiary); cursor: pointer; position: relative; font-weight: 500;
  }
  .tab-btn.active { color: var(--accent); }
  .tab-btn.active::after {
    content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
    height: 2px; background: var(--accent); border-radius: 1px;
  }

  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--safe-bottom) + 16px); }

  /* Connection banner */
  .connection-banner {
    margin: 12px 16px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--separator);
    border-radius: var(--radius-lg);
    display: flex; align-items: center; gap: 12px;
  }
  .connection-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .connection-dot.connected { background: var(--green); }
  .connection-dot.disconnected { background: var(--text-tertiary); }
  .connection-dot.error { background: var(--red); }
  .connection-info { flex: 1; min-width: 0; }
  .connection-name { font-size: 15px; font-weight: 600; }
  .connection-detail { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
  .connection-actions { flex-shrink: 0; }

  .pull-btn {
    padding: 8px 14px; background: var(--blue); color: white; border: none;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--font-body);
  }
  .pull-btn:active { opacity: 0.8; }
  .pull-btn:disabled { opacity: 0.5; cursor: default; }

  /* Campaign section */
  .campaign-section { margin: 16px 0; }
  .campaign-header {
    padding: 8px 16px; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .campaign-status {
    font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0;
    padding: 2px 8px; border-radius: 6px;
  }
  .campaign-status-btn {
    font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0;
    padding: 4px 12px; border-radius: 8px; border: none; cursor: pointer;
  }
  .campaign-status-btn:disabled { opacity: 0.5; cursor: default; }
  .campaign-status-btn.is-active { background: #D1F2D1; color: #1B7A1B; }
  .campaign-status-btn.is-paused { background: #FFF3CD; color: #856404; }
  .campaign-banner {
    margin: 0 16px 8px; padding: 10px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    background: #FFF3CD; color: #856404;
  }
  .status-active { background: #D1F2D1; color: #1B7A1B; }
  .status-paused { background: #FFF3CD; color: #856404; }
  .status-other { background: #E8E8ED; color: var(--text-secondary); }

  /* Ad set cards */
  .ad-set-card {
    background: var(--surface); margin: 0 16px 8px;
    border-radius: var(--radius-lg); padding: 14px 16px;
    cursor: pointer; border: 1px solid var(--separator); transition: background 0.15s;
  }
  .ad-set-card:active { background: #F0F0F5; }
  .ad-set-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .ad-set-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
  }
  .badge-synced { background: #D1F2D1; color: #1B7A1B; }
  .badge-pending { background: #FFF3CD; color: #856404; }
  .badge-error { background: #F8D7DA; color: #721C24; }
  .badge-no-meta { background: #E8E8ED; color: var(--text-secondary); }

  /* Orphaned ad sets (no campaign) */
  .orphan-section { margin: 16px 0; }
  .orphan-header { padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Detail view */
  .detail-header {
    padding: 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 0.5px solid var(--separator); background: var(--surface);
  }
  .detail-back { background: none; border: none; font-size: 24px; color: var(--accent); cursor: pointer; padding: 0 4px; line-height: 1; }
  .detail-title { font-size: 17px; font-weight: 600; flex: 1; }

  .sync-btn {
    padding: 10px 20px; background: var(--accent); color: white;
    border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600;
    cursor: pointer; width: calc(100% - 32px); margin: 16px;
    font-family: var(--font-body);
  }
  .sync-btn:active { background: var(--accent-dark); }
  .sync-btn:disabled { opacity: 0.5; cursor: default; }

  .ad-row {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 16px; border-bottom: 0.5px solid var(--separator); background: var(--surface);
  }
  .ad-row-thumb { width: 112px; height: 112px; border-radius: 8px; object-fit: cover; background: var(--separator); flex-shrink: 0; cursor: pointer; }

  .fullscreen-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .fullscreen-overlay img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; }
  .ad-row-info { flex: 1; min-width: 0; }
  .ad-row-caption { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ad-row-status { font-size: 12px; color: var(--text-secondary); margin-top: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-draft { background: var(--text-tertiary); }
  .dot-queued { background: #f59e0b; }
  .dot-approved { background: var(--blue); }
  .dot-live { background: var(--green); }
  .dot-paused { background: var(--orange); }
  .dot-synced { background: var(--green); }
  .dot-pending { background: var(--orange); }

  .ad-row-actions { flex-shrink: 0; }
  .status-select {
    padding: 6px 8px; border: 1px solid var(--separator); border-radius: 6px;
    font-size: 13px; background: var(--surface); color: var(--text-primary);
    font-family: var(--font-body);
  }

  .sync-result { margin: 12px 16px; padding: 12px; border-radius: var(--radius); font-size: 13px; }
  .sync-result-success { background: #D1F2D1; color: #1B7A1B; }
  .sync-result-error { background: #F8D7DA; color: #721C24; }

  .log-entry { padding: 12px 16px; border-bottom: 0.5px solid var(--separator); font-size: 13px; }
  .log-time { color: var(--text-tertiary); font-size: 11px; }
  .log-action { font-weight: 500; }
  .log-error { color: var(--red); margin-top: 4px; }

  .assign-btn {
    padding: 4px 10px; background: var(--accent-light); color: var(--accent-dark);
    border: 1px solid var(--accent); border-radius: 6px;
    font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font-body);
  }
  .assign-btn:active { background: var(--accent); color: white; }

  .assign-sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; }
  .assign-sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-radius: 14px 14px 0 0;
    padding: 20px 16px calc(var(--safe-bottom) + 20px); z-index: 301;
    max-height: 60vh; overflow-y: auto;
  }
  .assign-sheet h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .assign-option {
    padding: 12px; border: 1px solid var(--separator); border-radius: var(--radius);
    margin-bottom: 8px; cursor: pointer; font-size: 15px;
  }
  .assign-option:active { background: var(--accent-light); }

  .empty-state { text-align: center; padding: 60px 24px; color: var(--text-secondary); font-size: 15px; }
  .empty-state-title { font-family: var(--font-display); font-size: 20px; color: var(--text-primary); margin-bottom: 8px; }
  .section-header {
    padding: 20px 16px 8px; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* Pull result toast */
  .pull-result {
    margin: 0 16px 12px; padding: 10px 14px;
    background: #D1F2D1; color: #1B7A1B;
    border-radius: var(--radius); font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pull-result .dismiss { background: none; border: none; color: #1B7A1B; cursor: pointer; font-size: 16px; padding: 0 4px; }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>

<div id="loading" class="loading-overlay">Publisher</div>

<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <h1>Publisher</h1>
    <p>Push ads to Meta</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" autocomplete="email" required />
      <div id="turnstile-widget"></div>
      <button type="submit" id="login-btn">Send Magic Link</button>
    </form>
    <div id="login-message" class="login-message hidden"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <span class="topbar-title">Publisher</span>
      <button class="topbar-btn" id="signout-btn">Sign Out</button>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-unassigned" data-tab="unassigned">Creatives</button>
      <button class="tab-btn" id="tab-campaigns" data-tab="campaigns">Campaigns</button>
      <button class="tab-btn" id="tab-log" data-tab="log">Sync Log</button>
    </div>
  </div>

  <div class="content" id="content">
    <div id="view-campaigns" class="hidden"></div>
    <div id="view-detail" class="hidden"></div>
    <div id="view-unassigned"></div>
    <div id="view-log" class="hidden"></div>
  </div>
</div>

<div id="fullscreen-overlay" class="fullscreen-overlay hidden"></div>
<div id="assign-overlay" class="assign-sheet-overlay hidden"></div>
<div id="assign-sheet" class="assign-sheet hidden">
  <h3>Deploy to Ad Set</h3>
  <div id="assign-options"></div>
</div>

<div id="ad-detail-overlay" class="assign-sheet-overlay hidden"></div>
<div id="ad-detail-sheet" class="assign-sheet hidden">
  <div id="ad-detail-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  'use strict';

  var SUPABASE_URL = 'https://kcovnnebeowyrgbnnrof.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtjb3ZubmViZW93eXJnYm5ucm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MDkwNDQsImV4cCI6MjA4NzE4NTA0NH0.RNVn4MWplhTOVXSN7JH_9CMdGvoTwm_rx3UmHGthuLc';
  var storageBaseUrl = SUPABASE_URL + '/storage/v1/object/public/creative';

  var supabaseClient = null;
  var currentSession = null;
  var appInitialised = false;

  var STATE = { account: null, campaigns: [], adSets: [], ads: [], creatives: [], bodyCopy: [], syncLog: [] };
  var activeTab = 'unassigned';
  var detailAdSetId = null;
  var deployingCreativeId = null;
  var pullResultMsg = null;

  function db() { return supabaseClient.schema('marketing'); }

  async function fnError(error, data) {
    if (error) {
      console.error('fnError raw:', { error: error, data: data });
      if (error.context) {
        var ctx = error.context;
        if (ctx instanceof Response) {
          try { var body = await ctx.json(); return body.error || body.msg || body.message || JSON.stringify(body); } catch (e) {}
        }
        if (typeof ctx === 'object') return ctx.error || ctx.msg || ctx.message || JSON.stringify(ctx);
        if (typeof ctx === 'string') return ctx;
      }
      return error.message || 'Edge Function error';
    }
    if (data && data.error) return data.error;
    return null;
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function metaStatusClass(status) {
    if (!status) return 'status-other';
    if (status === 'ACTIVE') return 'status-active';
    if (status === 'PAUSED' || status === 'CAMPAIGN_PAUSED' || status === 'ADSET_PAUSED') return 'status-paused';
    return 'status-other';
  }

  var $loading = document.getElementById('loading');
  var $loginScreen = document.getElementById('login-screen');
  var $loginForm = document.getElementById('login-form');
  var $loginEmail = document.getElementById('login-email');
  var $loginBtn = document.getElementById('login-btn');
  var $loginMessage = document.getElementById('login-message');
  var $app = document.getElementById('app');
  var $signoutBtn = document.getElementById('signout-btn');

  var $viewCampaigns = document.getElementById('view-campaigns');
  var $viewDetail = document.getElementById('view-detail');
  var $viewUnassigned = document.getElementById('view-unassigned');
  var $viewLog = document.getElementById('view-log');

  var $assignOverlay = document.getElementById('assign-overlay');
  var $assignSheet = document.getElementById('assign-sheet');
  var $assignOptions = document.getElementById('assign-options');

  var $adDetailOverlay = document.getElementById('ad-detail-overlay');
  var $adDetailSheet = document.getElementById('ad-detail-sheet');
  var $adDetailContent = document.getElementById('ad-detail-content');

  // --- Turnstile captcha ---
  var turnstileWidgetId = null;
  var turnstileResolve = null;
  function initTurnstile() {
    if (turnstileWidgetId != null || typeof turnstile === 'undefined') return;
    turnstileWidgetId = turnstile.render('#turnstile-widget', {
      sitekey: '0x4AAAAAACg-ntBwO6e-cTBi',
      size: 'invisible',
      execution: 'execute',
      callback: function(token) { if (turnstileResolve) { turnstileResolve(token); turnstileResolve = null; } },
      'error-callback': function() { if (turnstileResolve) { turnstileResolve(null); turnstileResolve = null; } },
    });
  }
  if (typeof turnstile !== 'undefined') initTurnstile();
  else document.querySelector('script[src*="turnstile"]').addEventListener('load', initTurnstile);

  function getCaptchaToken() {
    if (turnstileWidgetId == null) return Promise.resolve(null);
    turnstile.reset(turnstileWidgetId);
    return new Promise(function(resolve) { turnstileResolve = resolve; turnstile.execute(turnstileWidgetId); });
  }

  // --- Auth ---
  var savedEmail = localStorage.getItem('cju-login-email');
  if (savedEmail) $loginEmail.value = savedEmail;

  $loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    var email = $loginEmail.value.trim();
    if (!email) return;
    localStorage.setItem('cju-login-email', email);
    $loginBtn.disabled = true;
    $loginMessage.classList.add('hidden');

    var captchaToken = await getCaptchaToken();
    var result = await supabaseClient.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin, captchaToken: captchaToken } });
    if (result.error) {
      $loginMessage.textContent = result.error.message;
      $loginMessage.className = 'login-message error';
      $loginMessage.classList.remove('hidden');
    } else {
      $loginMessage.textContent = 'Check your email for a login link.';
      $loginMessage.className = 'login-message';
      $loginMessage.classList.remove('hidden');
    }
    $loginBtn.disabled = false;
  });

  $signoutBtn.addEventListener('click', async function() {
    await supabaseClient.auth.signOut();
    currentSession = null;
    $app.classList.add('hidden');
    $loginScreen.classList.remove('hidden');
  });

  // --- Tabs ---
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { switchTab(btn.dataset.tab); });
  });

  function switchTab(tab) {
    activeTab = tab;
    detailAdSetId = null;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); });
    $viewCampaigns.classList.toggle('hidden', tab !== 'campaigns');
    $viewDetail.classList.add('hidden');
    $viewUnassigned.classList.toggle('hidden', tab !== 'unassigned');
    $viewLog.classList.toggle('hidden', tab !== 'log');
    render();
  }

  // --- Data loading ---
  async function loadData() {
    var results = await Promise.all([
      db().from('campaign').select('*').order('created_at', { ascending: false }),
      db().from('ad_set').select('*').order('created_at', { ascending: false }),
      db().from('meta_ad').select('*, image_creative:image_creative_id(*, base_image:base_image_id(*), image_creative_caption(caption_id, caption:caption_id(*))), body_copy:body_copy_id(*)').order('created_at', { ascending: false }),
      db().from('sync_log').select('*').order('synced_at', { ascending: false }).limit(50),
      db().from('image_creative').select('*, base_image:base_image_id(*), image_creative_caption(caption_id, caption:caption_id(*))').in('status', ['ready', 'deployed']).order('created_at', { ascending: false }),
      db().from('body_copy').select('*').order('created_at', { ascending: false }),
    ]);

    STATE.campaigns = results[0].data || [];
    STATE.adSets = results[1].data || [];
    STATE.ads = results[2].data || [];
    STATE.syncLog = results[3].data || [];
    STATE.creatives = results[4].data || [];
    STATE.bodyCopy = results[5].data || [];

    render();
  }

  function render() {
    if (activeTab === 'campaigns') {
      if (detailAdSetId) renderDetail();
      else renderCampaigns();
    }
    if (activeTab === 'unassigned') renderUnassigned();
    if (activeTab === 'log') renderSyncLog();
  }

  // --- Pull from Meta ---
  async function pullFromMeta() {
    var btn = document.getElementById('pull-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Pulling...'; }
    try {
      var resp = await supabaseClient.functions.invoke('meta-sync', { body: { action: 'pull' } });
      if (resp.error || (resp.data && resp.data.error)) {
        alert('Pull failed: ' + await fnError(resp.error, resp.data));
        return;
      }
      var c = resp.data.campaigns;
      var a = resp.data.adSets;
      pullResultMsg = 'Pulled ' + c.pulled + ' campaign' + (c.pulled !== 1 ? 's' : '') + ', ' + a.pulled + ' ad set' + (a.pulled !== 1 ? 's' : '');
      await loadData();
    } catch (err) {
      console.error('Pull error:', err);
      alert('Pull failed: ' + err.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Pull from Meta'; }
    }
  }

  async function diagnoseConnection() {
    var btn = document.getElementById('diagnose-btn');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    try {
      var resp = await supabaseClient.functions.invoke('meta-sync', { body: { action: 'diagnose' } });
      if (resp.error || (resp.data && resp.data.error)) {
        STATE.account = { error: await fnError(resp.error, resp.data) };
      } else {
        STATE.account = resp.data.account;
      }
      render();
    } catch (err) {
      STATE.account = { error: err.message };
      render();
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Test'; }
    }
  }

  async function toggleCampaignStatus(campaignId, isCurrentlyActive) {
    var newStatus = isCurrentlyActive ? 'paused' : 'live';
    var msg = isCurrentlyActive
      ? 'Pause this campaign? Ads will stop serving.'
      : 'Activate this campaign? All synced ads will start serving and spending budget.';
    if (!confirm(msg)) return;

    // Update desired_status locally first
    var res = await db().from('campaign').update({ desired_status: newStatus }).eq('id', campaignId);
    if (res.error) { alert('Failed: ' + res.error.message); return; }

    // Sync to Meta
    var resp = await supabaseClient.functions.invoke('meta-sync', {
      body: { action: 'sync_campaign', campaign_id: campaignId }
    });
    if (resp.error || (resp.data && resp.data.error)) {
      alert('Sync failed: ' + await fnError(resp.error, resp.data));
      await loadData();
      return;
    }

    await loadData();
  }

  // --- Render: Campaigns view ---
  function renderCampaigns() {
    var html = '';

    // Connection banner
    if (STATE.account && STATE.account.error) {
      html += '<div class="connection-banner">'
        + '<div class="connection-dot error"></div>'
        + '<div class="connection-info"><div class="connection-name">Connection Error</div>'
        + '<div class="connection-detail">' + escapeHtml(STATE.account.error) + '</div></div>'
        + '<div class="connection-actions"><button class="pull-btn" id="diagnose-btn" style="background:var(--text-tertiary)">Test</button></div>'
        + '</div>';
    } else if (STATE.account && STATE.account.name) {
      html += '<div class="connection-banner">'
        + '<div class="connection-dot connected"></div>'
        + '<div class="connection-info"><div class="connection-name">' + escapeHtml(STATE.account.name) + '</div>'
        + '<div class="connection-detail">' + STATE.account.currency + ' &middot; ' + escapeHtml(STATE.account.timezone_name || '') + ' &middot; ID: ' + STATE.account.id + '</div></div>'
        + '<div class="connection-actions"><button class="pull-btn" id="pull-btn">Pull from Meta</button></div>'
        + '</div>';
    } else {
      html += '<div class="connection-banner">'
        + '<div class="connection-dot disconnected"></div>'
        + '<div class="connection-info"><div class="connection-name">Meta Ad Account</div>'
        + '<div class="connection-detail">Test connection to see account info</div></div>'
        + '<div class="connection-actions"><button class="pull-btn" id="diagnose-btn">Connect</button></div>'
        + '</div>';
    }

    // Pull result toast
    if (pullResultMsg) {
      html += '<div class="pull-result"><span>' + escapeHtml(pullResultMsg) + '</span><button class="dismiss" id="dismiss-pull">&times;</button></div>';
    }

    // Group ad sets by campaign
    var campaignAdSets = {};
    var orphanAdSets = [];

    STATE.adSets.forEach(function(as) {
      if (as.campaign_id) {
        if (!campaignAdSets[as.campaign_id]) campaignAdSets[as.campaign_id] = [];
        campaignAdSets[as.campaign_id].push(as);
      } else {
        orphanAdSets.push(as);
      }
    });

    // Campaigns with their ad sets
    if (STATE.campaigns.length > 0) {
      STATE.campaigns.forEach(function(c) {
        var cAdSets = campaignAdSets[c.id] || [];
        var isActive = c.meta_status === 'ACTIVE';
        var isPaused = !isActive;
        var btnClass = isActive ? 'is-active' : 'is-paused';
        var btnLabel = isActive ? 'Active' : 'Paused';

        html += '<div class="campaign-section">'
          + '<div class="campaign-header">'
          + '<span>' + escapeHtml(c.name) + ' (' + cAdSets.length + ' ad set' + (cAdSets.length !== 1 ? 's' : '') + ')</span>'
          + (c.meta_campaign_id
            ? '<button class="campaign-status-btn ' + btnClass + '" data-campaign-id="' + c.id + '" data-active="' + isActive + '">' + btnLabel + '</button>'
            : '<span class="campaign-status status-other">No Meta ID</span>')
          + '</div>';

        if (isPaused && c.meta_campaign_id) {
          html += '<div class="campaign-banner">Campaign paused &mdash; ads will not serve until you activate this campaign.</div>';
        }

        if (cAdSets.length === 0) {
          html += '<div style="padding: 12px 16px; font-size: 13px; color: var(--text-tertiary);">No ad sets in this campaign</div>';
        } else {
          cAdSets.forEach(function(as) { html += renderAdSetCard(as); });
        }

        html += '</div>';
      });
    }

    // Orphaned ad sets
    if (orphanAdSets.length > 0) {
      html += '<div class="orphan-section">'
        + '<div class="orphan-header">No Campaign (' + orphanAdSets.length + ' ad set' + (orphanAdSets.length !== 1 ? 's' : '') + ')</div>';
      orphanAdSets.forEach(function(as) { html += renderAdSetCard(as); });
      html += '</div>';
    }

    // Empty state
    if (STATE.campaigns.length === 0 && STATE.adSets.length === 0) {
      html += '<div class="empty-state"><div class="empty-state-title">No Campaigns</div>'
        + 'Connect to your Meta account and pull campaigns to get started.</div>';
    }

    $viewCampaigns.innerHTML = html;

    // Wire up buttons
    var pullBtn = document.getElementById('pull-btn');
    if (pullBtn) pullBtn.addEventListener('click', pullFromMeta);

    var diagnoseBtn = document.getElementById('diagnose-btn');
    if (diagnoseBtn) diagnoseBtn.addEventListener('click', diagnoseConnection);

    var dismissBtn = document.getElementById('dismiss-pull');
    if (dismissBtn) dismissBtn.addEventListener('click', function() { pullResultMsg = null; render(); });

    $viewCampaigns.querySelectorAll('.campaign-status-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { toggleCampaignStatus(btn.dataset.campaignId, btn.dataset.active === 'true'); });
    });

    $viewCampaigns.querySelectorAll('.ad-set-card').forEach(function(card) {
      card.addEventListener('click', function() {
        detailAdSetId = card.dataset.id;
        $viewCampaigns.classList.add('hidden');
        $viewDetail.classList.remove('hidden');
        renderDetail();
      });
    });
  }

  function renderAdSetCard(as) {
    var ads = STATE.ads.filter(function(a) { return a.ad_set_id === as.id; });
    var total = ads.length;
    var synced = ads.filter(function(a) { return a.meta_ad_id && a.desired_status === 'live' && a.meta_status === 'ACTIVE'; }).length;
    var pending = ads.filter(function(a) { return needsSync(a); }).length;

    var badge = '';
    if (!as.meta_ad_set_id) {
      badge = '<span class="badge badge-no-meta">No Meta ID</span>';
    } else if (pending > 0) {
      badge = '<span class="badge badge-pending">' + pending + ' pending</span>';
    } else if (synced > 0) {
      badge = '<span class="badge badge-synced">In sync</span>';
    }

    var statusLabel = as.meta_status || '';
    var statusCls = metaStatusClass(as.meta_status);

    return '<div class="ad-set-card" data-id="' + as.id + '">'
      + '<div class="ad-set-name">' + escapeHtml(as.name) + '</div>'
      + '<div class="ad-set-meta">'
      + '<span>' + total + ' ad' + (total !== 1 ? 's' : '') + '</span>'
      + (statusLabel ? '<span class="campaign-status ' + statusCls + '">' + statusLabel + '</span>' : '')
      + (as.daily_budget_cents ? '<span>' + (as.daily_budget_cents / 100).toFixed(2) + '/day</span>' : '')
      + badge
      + '</div>'
      + '</div>';
  }

  // --- Render: Ad Set Detail ---
  function renderDetail() {
    var adSet = STATE.adSets.find(function(as) { return as.id === detailAdSetId; });
    if (!adSet) return;

    var ads = STATE.ads.filter(function(a) { return a.ad_set_id === adSet.id; });
    var pendingCount = ads.filter(function(a) { return needsSync(a); }).length;

    var html = '<div class="detail-header">'
      + '<button class="detail-back" id="detail-back">&larr;</button>'
      + '<div class="detail-title">' + escapeHtml(adSet.name) + '</div>'
      + '</div>';

    if (ads.length === 0) {
      html += '<div class="empty-state">No ads in this ad set.<br>Deploy creatives from the Deploy tab.</div>';
    } else {
      html += ads.map(function(ad) { return renderAdRow(ad); }).join('');
    }

    if (adSet.meta_ad_set_id && pendingCount > 0) {
      html += '<button class="sync-btn" id="sync-btn">Sync ' + pendingCount + ' Ad' + (pendingCount !== 1 ? 's' : '') + '</button>';
    } else if (!adSet.meta_ad_set_id) {
      html += '<div class="empty-state" style="padding:24px">This ad set has no Meta ID yet. Pull from Meta to link it.</div>';
    } else if (pendingCount === 0 && ads.length > 0) {
      html += '<div class="empty-state" style="padding:24px;color:var(--green)">All ads in sync.</div>';
    }

    html += '<div id="sync-results"></div>';

    $viewDetail.innerHTML = html;

    document.getElementById('detail-back').addEventListener('click', function() {
      detailAdSetId = null;
      $viewDetail.classList.add('hidden');
      $viewCampaigns.classList.remove('hidden');
      renderCampaigns();
    });

    $viewDetail.querySelectorAll('.status-select').forEach(function(sel) {
      sel.addEventListener('change', async function() {
        var adId = sel.dataset.adId;
        var newStatus = sel.value;
        var res = await db().from('meta_ad').update({ desired_status: newStatus }).eq('id', adId);
        if (res.error) { alert('Failed: ' + res.error.message); return; }
        await loadData();
      });
    });

    $viewDetail.querySelectorAll('.ad-row[data-meta-ad-id]').forEach(function(row) {
      row.addEventListener('click', function(e) {
        if (e.target.closest('select') || e.target.closest('button')) return;
        openAdDetail(row.dataset.metaAdId);
      });
    });

    wireThumbClicks($viewDetail);

    var $syncBtn = document.getElementById('sync-btn');
    if ($syncBtn) {
      $syncBtn.addEventListener('click', function() { handleSync(adSet.id); });
    }
  }

  function renderAdRow(ad) {
    var ic = ad.image_creative || {};
    var imgUrl = ic.composited_image_path
      ? storageBaseUrl + '/' + ic.composited_image_path
      : (ic.base_image ? storageBaseUrl + '/' + ic.base_image.storage_path : '');

    var captions = ic.image_creative_caption || [];
    var captionText = captions[0] && captions[0].caption ? captions[0].caption.text : 'No caption';
    var syncState = getSyncState(ad);

    var statusOptions = ['draft', 'queued', 'live', 'paused'].map(function(s) {
      return '<option value="' + s + '"' + (ad.desired_status === s ? ' selected' : '') + '>' + s + '</option>';
    }).join('');

    return '<div class="ad-row" data-meta-ad-id="' + ad.id + '" style="cursor:pointer;">'
      + (imgUrl ? '<img class="ad-row-thumb" src="' + imgUrl + '" alt="" />' : '<div class="ad-row-thumb"></div>')
      + '<div class="ad-row-info">'
      + '<div class="ad-row-caption">' + escapeHtml(captionText) + '</div>'
      + '<div class="ad-row-status">'
      + '<span class="status-dot dot-' + ad.desired_status + '"></span>'
      + '<span>' + ad.desired_status + '</span>'
      + (ad.meta_status ? ' &rarr; <span class="status-dot dot-' + (ad.meta_status === 'ACTIVE' ? 'synced' : 'pending') + '"></span> Meta: ' + ad.meta_status : '')
      + (syncState === 'pending' ? ' <span style="color:var(--orange);font-weight:600">(needs sync)</span>' : '')
      + '</div>'
      + '</div>'
      + '<div class="ad-row-actions">'
      + '<select class="status-select" data-ad-id="' + ad.id + '">' + statusOptions + '</select>'
      + '</div>'
      + '</div>';
  }

  // --- Render: Deploy tab ---
  function renderUnassigned() {
    var deployedCreativeIds = STATE.ads.map(function(a) { return a.image_creative_id; });
    var readyCreatives = STATE.creatives.filter(function(c) {
      return c.status === 'ready' && deployedCreativeIds.indexOf(c.id) === -1;
    });

    if (readyCreatives.length === 0 && STATE.ads.length === 0) {
      $viewUnassigned.innerHTML = '<div class="empty-state"><div class="empty-state-title">No Creatives</div>Create creatives in the Creative app first.</div>';
      return;
    }

    var html = '';

    // Ready creatives (not yet deployed as meta_ads)
    if (readyCreatives.length > 0) {
      html += '<div class="section-header">' + readyCreatives.length + ' ready to deploy</div>';
      html += readyCreatives.map(function(c) { return renderCreativeCard(c); }).join('');
    }

    // Existing meta_ads
    if (STATE.ads.length > 0) {
      html += '<div class="section-header">' + STATE.ads.length + ' deployed</div>';
      html += STATE.ads.map(function(ad) {
        var adSet = STATE.adSets.find(function(as) { return as.id === ad.ad_set_id; });
        return renderAdCard(ad, false, adSet);
      }).join('');
    }

    $viewUnassigned.innerHTML = html;

    $viewUnassigned.querySelectorAll('.deploy-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { openAssignSheet(btn.dataset.creativeId); });
    });

    $viewUnassigned.querySelectorAll('.status-select').forEach(function(sel) {
      sel.addEventListener('change', async function() {
        var adId = sel.dataset.adId;
        var newStatus = sel.value;
        var res = await db().from('meta_ad').update({ desired_status: newStatus }).eq('id', adId);
        if (res.error) { alert('Failed: ' + res.error.message); return; }
        await loadData();
      });
    });

    $viewUnassigned.querySelectorAll('.ad-row[data-meta-ad-id]').forEach(function(row) {
      row.addEventListener('click', function(e) {
        if (e.target.closest('select') || e.target.closest('button')) return;
        openAdDetail(row.dataset.metaAdId);
      });
    });

    wireThumbClicks($viewUnassigned);
  }

  function renderCreativeCard(c) {
    var imgUrl = c.composited_image_path
      ? storageBaseUrl + '/' + c.composited_image_path
      : (c.base_image ? storageBaseUrl + '/' + c.base_image.storage_path : '');
    var captions = c.image_creative_caption || [];
    var captionText = captions[0] && captions[0].caption ? captions[0].caption.text : '';
    var label = captionText || 'Creative ' + c.id.slice(0, 8);

    return '<div class="ad-row">'
      + (imgUrl ? '<img class="ad-row-thumb" src="' + imgUrl + '" alt="" />' : '<div class="ad-row-thumb"></div>')
      + '<div class="ad-row-info">'
      + '<div class="ad-row-caption">' + escapeHtml(label) + '</div>'
      + '<div class="ad-row-status">'
      + '<span class="status-dot dot-' + c.status + '"></span> ' + c.status
      + '</div>'
      + '</div>'
      + '<div class="ad-row-actions">'
      + '<button class="assign-btn deploy-btn" data-creative-id="' + c.id + '">Deploy</button>'
      + '</div>'
      + '</div>';
  }

  function renderAdCard(ad, showAssign, adSet) {
    var ic = ad.image_creative || {};
    var imgUrl = ic.composited_image_path
      ? storageBaseUrl + '/' + ic.composited_image_path
      : (ic.base_image ? storageBaseUrl + '/' + ic.base_image.storage_path : '');
    var captions = ic.image_creative_caption || [];
    var captionText = captions[0] && captions[0].caption ? captions[0].caption.text : '';
    var bodyText = ad.body_copy ? ad.body_copy.headline || ad.body_copy.text || '' : '';
    var label = captionText || bodyText || 'Ad ' + ad.id.slice(0, 8);

    var statusOptions = ['draft', 'queued', 'live', 'paused'].map(function(s) {
      return '<option value="' + s + '"' + (ad.desired_status === s ? ' selected' : '') + '>' + s + '</option>';
    }).join('');

    var actions = '<select class="status-select" data-ad-id="' + ad.id + '">' + statusOptions + '</select>';
    if (showAssign) {
      actions += ' <button class="assign-btn" data-ad-id="' + ad.id + '">Assign</button>';
    }

    var adSetLabel = adSet ? '<span style="color:var(--text-tertiary);font-size:11px;">' + escapeHtml(adSet.name) + '</span>' : '';

    return '<div class="ad-row" data-meta-ad-id="' + ad.id + '" style="cursor:pointer;">'
      + (imgUrl ? '<img class="ad-row-thumb" src="' + imgUrl + '" alt="" />' : '<div class="ad-row-thumb"></div>')
      + '<div class="ad-row-info">'
      + '<div class="ad-row-caption">' + escapeHtml(label) + '</div>'
      + '<div class="ad-row-status">'
      + '<span class="status-dot dot-' + ad.desired_status + '"></span> ' + ad.desired_status
      + (ad.meta_status ? ' &rarr; Meta: ' + ad.meta_status : '')
      + '</div>'
      + adSetLabel
      + '</div>'
      + '<div class="ad-row-actions">' + actions + '</div>'
      + '</div>';
  }

  // --- Deploy sheet ---
  function openAssignSheet(creativeId) {
    deployingCreativeId = creativeId;
    var adSetsWithMeta = STATE.adSets.filter(function(as) { return as.meta_ad_set_id; });

    if (adSetsWithMeta.length === 0) {
      alert('No ad sets with a Meta ID. Pull from Meta first.');
      return;
    }

    // Build body copy dropdown
    var bcHtml = '<div style="padding:0 16px 8px;"><label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px;">Body Copy</label>'
      + '<select id="deploy-body-copy" style="width:100%;padding:8px;border:1px solid var(--separator);border-radius:var(--radius);font-size:14px;font-family:var(--font-body);">'
      + '<option value="">No body copy</option>'
      + STATE.bodyCopy.map(function(bc) {
          var label = bc.headline || bc.text || 'Body ' + bc.id.slice(0, 8);
          if (label.length > 60) label = label.slice(0, 57) + '...';
          return '<option value="' + bc.id + '">' + escapeHtml(label) + '</option>';
        }).join('')
      + '</select></div>';

    $assignOptions.innerHTML = bcHtml + adSetsWithMeta.map(function(as) {
      return '<div class="assign-option" data-as-id="' + as.id + '">' + escapeHtml(as.name) + '</div>';
    }).join('');

    $assignSheet.classList.remove('hidden');
    $assignOverlay.classList.remove('hidden');

    $assignOptions.querySelectorAll('.assign-option').forEach(function(opt) {
      opt.addEventListener('click', async function() {
        var asId = opt.dataset.asId;
        var bcSelect = document.getElementById('deploy-body-copy');
        var bodyObj = { image_creative_id: deployingCreativeId, ad_set_id: asId, desired_status: 'draft' };
        if (bcSelect && bcSelect.value) bodyObj.body_copy_id = bcSelect.value;
        var res = await db().from('meta_ad').insert(bodyObj).select().single();
        if (res.error) { alert('Failed: ' + res.error.message); return; }
        closeAssignSheet();
        await loadData();
      });
    });
  }

  function closeAssignSheet() {
    $assignSheet.classList.add('hidden');
    $assignOverlay.classList.add('hidden');
    deployingCreativeId = null;
  }

  $assignOverlay.addEventListener('click', closeAssignSheet);

  // --- Ad detail sheet ---
  function openAdDetail(adId) {
    var ad = STATE.ads.find(function(a) { return a.id === adId; });
    if (!ad) return;

    var ic = ad.image_creative || {};
    var imgUrl = ic.composited_image_path
      ? storageBaseUrl + '/' + ic.composited_image_path
      : (ic.base_image ? storageBaseUrl + '/' + ic.base_image.storage_path : '');
    var captions = ic.image_creative_caption || [];
    var captionText = captions.map(function(c) { return c.caption ? c.caption.text : ''; }).filter(Boolean).join(', ');
    var adSet = STATE.adSets.find(function(as) { return as.id === ad.ad_set_id; });

    var bcOptions = '<option value="">No body copy</option>' + STATE.bodyCopy.map(function(bc) {
      var label = bc.headline || bc.text || 'Body ' + bc.id.slice(0, 8);
      if (label.length > 60) label = label.slice(0, 57) + '...';
      var selected = ad.body_copy_id === bc.id ? ' selected' : '';
      return '<option value="' + bc.id + '"' + selected + '>' + escapeHtml(label) + '</option>';
    }).join('');

    $adDetailContent.innerHTML = ''
      + (imgUrl ? '<img src="' + imgUrl + '" alt="" style="width:100%;border-radius:var(--radius);margin-bottom:12px;" />' : '')
      + (captionText ? '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;">' + escapeHtml(captionText) + '</div>' : '')
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">'
        + '<div style="display:flex;justify-content:space-between;font-size:13px;">'
          + '<span style="color:var(--text-secondary);">Ad Set</span>'
          + '<span>' + escapeHtml(adSet ? adSet.name : 'Unassigned') + '</span>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;font-size:13px;">'
          + '<span style="color:var(--text-secondary);">Desired Status</span>'
          + '<span>' + escapeHtml(ad.desired_status) + '</span>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;font-size:13px;">'
          + '<span style="color:var(--text-secondary);">Meta Status</span>'
          + '<span>' + (ad.meta_status ? escapeHtml(ad.meta_status) : '\u2014') + '</span>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;font-size:13px;">'
          + '<span style="color:var(--text-secondary);">Meta Ad ID</span>'
          + '<span style="font-family:monospace;font-size:11px;">' + (ad.meta_ad_id ? escapeHtml(ad.meta_ad_id) : 'Not yet synced') + '</span>'
        + '</div>'
      + '</div>'
      + '<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px;">Body Copy</label>'
      + '<select id="detail-body-copy" style="width:100%;padding:8px;border:1px solid var(--separator);border-radius:var(--radius);font-size:14px;font-family:var(--font-body);margin-bottom:12px;">'
      + bcOptions
      + '</select>'
      + '<button id="detail-save-btn" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;">Save</button>';

    $adDetailSheet.classList.remove('hidden');
    $adDetailOverlay.classList.remove('hidden');

    document.getElementById('detail-save-btn').addEventListener('click', async function() {
      var bcSelect = document.getElementById('detail-body-copy');
      var updateObj = { body_copy_id: bcSelect.value || null };
      var res = await db().from('meta_ad').update(updateObj).eq('id', adId);
      if (res.error) { alert('Failed: ' + res.error.message); return; }
      closeAdDetail();
      await loadData();
    });
  }

  function closeAdDetail() {
    $adDetailSheet.classList.add('hidden');
    $adDetailOverlay.classList.add('hidden');
  }

  $adDetailOverlay.addEventListener('click', closeAdDetail);

  // --- Fullscreen image viewer ---
  var $fullscreenOverlay = document.getElementById('fullscreen-overlay');
  function showFullscreen(src) {
    $fullscreenOverlay.innerHTML = '<img src="' + src + '" alt="" />';
    $fullscreenOverlay.classList.remove('hidden');
  }
  $fullscreenOverlay.addEventListener('click', function() { $fullscreenOverlay.classList.add('hidden'); });

  function wireThumbClicks(container) {
    container.querySelectorAll('.ad-row-thumb[src]').forEach(function(img) {
      img.addEventListener('click', function(e) { e.stopPropagation(); showFullscreen(img.src); });
    });
  }

  // --- Render: Sync Log ---
  function renderSyncLog() {
    if (STATE.syncLog.length === 0) {
      $viewLog.innerHTML = '<div class="empty-state"><div class="empty-state-title">No Sync History</div>Sync some ads to see activity here.</div>';
      return;
    }

    $viewLog.innerHTML = STATE.syncLog.map(function(entry) {
      var time = new Date(entry.synced_at).toLocaleString();
      var statusClass = entry.status === 'success' ? 'dot-synced' : 'dot-pending';

      return '<div class="log-entry">'
        + '<div class="log-time">' + time + '</div>'
        + '<div class="log-action">'
        + '<span class="status-dot ' + statusClass + '"></span> '
        + entry.action + ' ' + entry.entity_type
        + (entry.meta_id ? ' &rarr; ' + entry.meta_id : '')
        + '</div>'
        + (entry.error ? '<div class="log-error">' + escapeHtml(entry.error) + '</div>' : '')
        + '</div>';
    }).join('');
  }

  // --- Sync ---
  async function handleSync(adSetId) {
    var $syncBtn = document.getElementById('sync-btn');
    var $syncResults = document.getElementById('sync-results');
    if ($syncBtn) { $syncBtn.disabled = true; $syncBtn.textContent = 'Syncing...'; }

    try {
      var resp = await supabaseClient.functions.invoke('meta-sync', { body: { ad_set_id: adSetId } });
      var errMsg = await fnError(resp.error, resp.data);
      if (errMsg) {
        console.error('Sync error:', errMsg);
        if ($syncResults) { $syncResults.innerHTML = '<div class="sync-result sync-result-error">' + escapeHtml(errMsg) + '</div>'; }
        return;
      }

      var results = resp.data.synced || [];
      if ($syncResults && results.length > 0) {
        $syncResults.innerHTML = results.map(function(r) {
          if (r.success) {
            return '<div class="sync-result sync-result-success">' + r.action + ': ' + r.ad_id.slice(0, 8) + ' &rarr; ' + (r.meta_ad_id || '') + '</div>';
          } else {
            return '<div class="sync-result sync-result-error">' + r.action + ': ' + r.ad_id.slice(0, 8) + ' &mdash; ' + escapeHtml(r.error) + '</div>';
          }
        }).join('');
      } else if ($syncResults && resp.data.message) {
        $syncResults.innerHTML = '<div class="sync-result sync-result-success">' + escapeHtml(resp.data.message) + '</div>';
      }

      await loadData();
    } catch (err) {
      console.error('Sync error:', err);
      if ($syncResults) { $syncResults.innerHTML = '<div class="sync-result sync-result-error">' + escapeHtml(err.message || 'Sync failed') + '</div>'; }
    } finally {
      if ($syncBtn) { $syncBtn.disabled = false; $syncBtn.textContent = 'Sync'; }
    }
  }

  // --- Helpers ---
  function needsSync(ad) {
    if (ad.desired_status === 'queued' && !ad.meta_ad_id) return true;
    if (ad.desired_status === 'live' && ad.meta_status !== 'ACTIVE') return true;
    if (ad.desired_status === 'paused' && ad.meta_status !== 'PAUSED') return true;
    return false;
  }

  function getSyncState(ad) {
    if (needsSync(ad)) return 'pending';
    if (ad.meta_ad_id) return 'synced';
    return 'none';
  }

  // --- Init ---
  async function initApp() {
    if (appInitialised) return;
    appInitialised = true;
    await loadData();
    $loading.classList.add('hidden');
    $app.classList.remove('hidden');
  }

  // --- Boot ---
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  supabaseClient.auth.onAuthStateChange(function(event, session) {
    currentSession = session;
    if (session) {
      $loginScreen.classList.add('hidden');
      initApp();
    } else {
      $loading.classList.add('hidden');
      $loginScreen.classList.remove('hidden');
      $app.classList.add('hidden');
      appInitialised = false;
    }
  });

})();
</script>
</body>
</html>
