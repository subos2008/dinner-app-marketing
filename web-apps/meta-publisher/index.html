  function closeCreateAdSetSheet() {
    $createAdSetSheet.classList.add('hidden');
    $createAdSetOverlay.classList.add('hidden');
  }

  $createAdSetOverlay.addEventListener('click', closeCreateAdSetSheet);

  document.getElementById('cas-scope').addEventListener('change', function() {
    document.getElementById('cas-cities-field').classList.toggle('hidden', this.value === 'all');
  });

  document.getElementById('cas-optimization-goal').addEventListener('change', function() {
    document.getElementById('cas-event-field').classList.toggle('hidden', this.value !== 'OFFSITE_CONVERSIONS');
  });

  document.getElementById('cas-campaign').addEventListener('change', function() {
    renderCityCheckboxes(this.value);
  });

  document.getElementById('cas-submit').addEventListener('click', async function() {
    var btn = document.getElementById('cas-submit');
    var $error = document.getElementById('cas-error');
    $error.classList.add('hidden');

    var name = document.getElementById('cas-name').value.trim();
    var campaignId = document.getElementById('cas-campaign').value;
    var budgetGbp = parseFloat(document.getElementById('cas-budget').value);
    var cityScope = document.getElementById('cas-scope').value;
    var ageMin = parseInt(document.getElementById('cas-age-min').value) || 18;
    var ageMax = parseInt(document.getElementById('cas-age-max').value) || 65;
    var optimizationGoal = document.getElementById('cas-optimization-goal').value;
    var customEventType = document.getElementById('cas-event-type').value;
    var callToAction = document.getElementById('cas-cta').value;

    if (!name) { $error.textContent = 'Name is required'; $error.classList.remove('hidden'); return; }
    if (!campaignId) { $error.textContent = 'Campaign is required'; $error.classList.remove('hidden'); return; }

    // Build city list based on scope (only configured cities)
    var selectedCities = [];
    if (cityScope === 'all') {
      selectedCities = getCitiesForCampaign(campaignId).filter(function(c) { return c.meta_geo_key; });
    } else {
      document.querySelectorAll('#cas-cities-list input:checked').forEach(function(cb) {
        selectedCities.push({ meta_geo_key: cb.value, name: cb.dataset.name, meta_geo_type: cb.dataset.geoType || 'city' });
      });
    }

    if (selectedCities.length === 0) {
      $error.textContent = cityScope === 'all' ? 'No configured cities found for this campaign language — configure cities in the Cities tab' : 'Select at least one city';
      $error.classList.remove('hidden');
      return;
    }

    var targeting = { age_min: ageMin, age_max: ageMax };
    var geoLocations = {};
    selectedCities.forEach(function(c) {
      var field = c.meta_geo_type === 'medium_geo_area' ? 'medium_geo_areas'
                : c.meta_geo_type === 'region' ? 'regions' : 'cities';
      if (!geoLocations[field]) geoLocations[field] = [];
      geoLocations[field].push({ key: c.meta_geo_key });
    });
    targeting.geo_locations = geoLocations;

    btn.disabled = true;
    btn.textContent = 'Creating...';

    try {
      var reqBody = {
        action: 'create_ad_set',
        campaign_id: campaignId,
        name: name,
        targeting: targeting,
        city_scope: cityScope,
        optimization_goal: optimizationGoal,
        billing_event: 'IMPRESSIONS',
        call_to_action: callToAction,
        custom_event_type: optimizationGoal === 'OFFSITE_CONVERSIONS' ? customEventType : undefined,
      };
      if (budgetGbp && budgetGbp > 0) reqBody.daily_budget_cents = Math.round(budgetGbp * 100);
      var resp = await supabaseClient.functions.invoke('meta-sync', { body: reqBody });
      var errMsg = await fnError(resp.error, resp.data);
      if (errMsg) {
        $error.textContent = errMsg;
        $error.classList.remove('hidden');
        return;
      }
      closeCreateAdSetSheet();
      await loadData();
    } catch (err) {
      console.error('Create ad set error:', err);
      $error.textContent = err.message || 'Failed to create ad set';
      $error.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create on Meta';
    }
  });

  // --- Edit ad set sheet ---
  function renderEditCityCheckboxes(adSet) {
    var campaignId = adSet.campaign_id;
    var cities = campaignId ? getCitiesForCampaign(campaignId) : STATE.cities;
    var targeted = getAdSetTargetedCityKeys(adSet);
    var $list = document.getElementById('eas-cities-list');
    $list.innerHTML = cities.map(function(city) {
      var disabled = !city.meta_geo_key;
      var checked = targeted.indexOf(city.meta_geo_key) !== -1;
      var label = city.name + (disabled ? ' (not configured)' : '');
      return '<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:' + (disabled ? 'default' : 'pointer') + ';' + (disabled ? 'opacity:0.5;' : '') + '">'
        + '<input type="checkbox" value="' + (city.meta_geo_key || '') + '" data-name="' + escapeHtml(city.name) + '" data-geo-type="' + (city.meta_geo_type || 'city') + '"' + (disabled ? ' disabled' : '') + (checked ? ' checked' : '') + ' />'
        + escapeHtml(label)
        + '</label>';
    }).join('');
  }

  function openEditAdSetSheet(adSet) {
    editingAdSetId = adSet.id;
    document.getElementById('eas-name').value = adSet.name || '';
    document.getElementById('eas-budget').value = adSet.daily_budget_cents ? (adSet.daily_budget_cents / 100).toFixed(2) : '';
    document.getElementById('eas-cta').value = adSet.call_to_action || 'LEARN_MORE';
    document.getElementById('eas-scope').value = adSet.city_scope || 'all';
    document.getElementById('eas-cities-field').classList.toggle('hidden', (adSet.city_scope || 'all') === 'all');
    document.getElementById('eas-optimization-goal').textContent = adSet.optimization_goal || '(not set)';
    document.getElementById('eas-billing-event').textContent = adSet.billing_event || '(not set)';
    var eventRow = document.getElementById('eas-event-row');
    if (adSet.custom_event_type) {
      document.getElementById('eas-event-type').textContent = adSet.custom_event_type;
      eventRow.classList.remove('hidden');
    } else {
      eventRow.classList.add('hidden');
    }
    document.getElementById('eas-error').classList.add('hidden');
    renderEditCityCheckboxes(adSet);
    $editAdSetSheet.classList.remove('hidden');
    $editAdSetOverlay.classList.remove('hidden');
  }

  function closeEditAdSetSheet() {
    $editAdSetSheet.classList.add('hidden');
    $editAdSetOverlay.classList.add('hidden');
    editingAdSetId = null;
  }

  $editAdSetOverlay.addEventListener('click', closeEditAdSetSheet);

  document.getElementById('eas-scope').addEventListener('change', function() {
    document.getElementById('eas-cities-field').classList.toggle('hidden', this.value === 'all');
  });

  document.getElementById('eas-submit').addEventListener('click', async function() {
    var btn = document.getElementById('eas-submit');
    var $error = document.getElementById('eas-error');
    $error.classList.add('hidden');

    var name = document.getElementById('eas-name').value.trim();
    var budgetGbp = parseFloat(document.getElementById('eas-budget').value);
    var callToAction = document.getElementById('eas-cta').value;
    var cityScope = document.getElementById('eas-scope').value;

    if (!name) { $error.textContent = 'Name is required'; $error.classList.remove('hidden'); return; }

    // Build city targeting
    var adSet = STATE.adSets.find(function(as) { return as.id === editingAdSetId; });
    var selectedCities = [];
    if (cityScope === 'all') {
      selectedCities = getCitiesForCampaign(adSet.campaign_id).filter(function(c) { return c.meta_geo_key; });
    } else {
      document.querySelectorAll('#eas-cities-list input:checked').forEach(function(cb) {
        selectedCities.push({ meta_geo_key: cb.value, name: cb.dataset.name, meta_geo_type: cb.dataset.geoType || 'city' });
      });
    }

    if (selectedCities.length === 0) {
      $error.textContent = cityScope === 'all' ? 'No configured cities found — configure cities in the Cities tab' : 'Select at least one city';
      $error.classList.remove('hidden');
      return;
    }

    // Build targeting object, preserving age from existing targeting
    var existingTargeting = adSet.targeting || {};
    var targeting = { age_min: existingTargeting.age_min || 18, age_max: existingTargeting.age_max || 65 };
    var geoLocations = {};
    selectedCities.forEach(function(c) {
      var field = c.meta_geo_type === 'medium_geo_area' ? 'medium_geo_areas'
                : c.meta_geo_type === 'region' ? 'regions' : 'cities';
      if (!geoLocations[field]) geoLocations[field] = [];
      geoLocations[field].push({ key: c.meta_geo_key });
    });
    targeting.geo_locations = geoLocations;

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      var reqBody = {
        action: 'update_ad_set',
        ad_set_id: editingAdSetId,
        name: name,
        daily_budget_cents: (budgetGbp && budgetGbp > 0) ? Math.round(budgetGbp * 100) : null,
        call_to_action: callToAction,
        city_scope: cityScope,
        targeting: targeting,
      };
      var resp = await supabaseClient.functions.invoke('meta-sync', { body: reqBody });
      var errMsg = await fnError(resp.error, resp.data);
      if (errMsg) {
        $error.textContent = errMsg;
        $error.classList.remove('hidden');
        return;
      }

      closeEditAdSetSheet();
      await loadData();
      renderDetail();
    } catch (err) {
      console.error('Edit ad set error:', err);
      $error.textContent = err.message || 'Failed to save';
      $error.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  });

  function closeAssignSheet() {
    $assignSheet.classList.add('hidden');
    $assignOverlay.classList.add('hidden');
    deployingCreativeId = null;
  }

  $assignOverlay.addEventListener('click', closeAssignSheet);

  // --- Ad detail sheet ---
  function openAdDetail(adId) {
    var ad = STATE.ads.find(function(a) { return a.id === adId; });
    if (!ad) return;

    var ic = ad.image_creative || {};
    var imgUrl = ic.composited_image_path
      ? storageBaseUrl + '/' + ic.composited_image_path
      : (ic.base_image ? storageBaseUrl + '/' + ic.base_image.storage_path : '');
    var captions = ic.image_creative_caption || [];
    var captionText = captions.map(function(c) { return c.caption ? c.caption.text : ''; }).filter(Boolean).join(', ');
    var adSet = STATE.adSets.find(function(as) { return as.id === ad.ad_set_id; });

    var bcOptions = '<option value="">No body copy</option>' + STATE.bodyCopy.map(function(bc) {
      var label = bc.headline || bc.text || 'Body ' + bc.id.slice(0, 8);
      if (label.length > 60) label = label.slice(0, 57) + '...';
      var selected = ad.body_copy_id === bc.id ? ' selected' : '';
      return '<option value="' + bc.id + '"' + selected + '>' + escapeHtml(label) + '</option>';
    }).join('');

    $adDetailContent.innerHTML = ''
      + (imgUrl ? '<img src="' + imgUrl + '" alt="" style="width:100%;border-radius:var(--radius);margin-bottom:12px;" />' : '')
      + (captionText ? '<div style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;">' + escapeHtml(captionText) + '</div>' : '')
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">'
        + '<div style="display:flex;justify-content:space-between;font-size:13px;">'
          + '<span style="color:var(--text-secondary);">Ad Set</span>'
          + '<span>' + escapeHtml(adSet ? adSet.name : 'Unassigned') + '</span>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">'
          + '<span style="color:var(--text-secondary);">Status</span>'
          + '<span>' + statusLabel(ad) + '</span>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">'
          + '<span style="color:var(--text-secondary);">Meta Ad ID</span>'
          + '<span style="font-family:monospace;font-size:11px;">' + (ad.meta_ad_id ? escapeHtml(ad.meta_ad_id) : 'Not yet synced') + '</span>'
        + '</div>'
      + '</div>'
      + '<div style="margin-bottom:12px;">' + statusActionHtml(ad) + '</div>'
      + '<label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px;">Body Copy</label>'
      + '<select id="detail-body-copy" style="width:100%;padding:8px;border:1px solid var(--separator);border-radius:var(--radius);font-size:14px;font-family:var(--font-body);margin-bottom:12px;">'
      + bcOptions
      + '</select>'
      + '<button id="detail-save-btn" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;">Save</button>';

    $adDetailSheet.classList.remove('hidden');
    $adDetailOverlay.classList.remove('hidden');

    wireStatusActions($adDetailSheet);

    document.getElementById('detail-save-btn').addEventListener('click', async function() {
      var bcSelect = document.getElementById('detail-body-copy');
      var updateObj = { body_copy_id: bcSelect.value || null };
      var res = await db().from('meta_ad').update(updateObj).eq('id', adId);
      if (res.error) { alert('Failed: ' + res.error.message); return; }
      closeAdDetail();
      await loadData();
    });
  }

  function closeAdDetail() {
    $adDetailSheet.classList.add('hidden');
    $adDetailOverlay.classList.add('hidden');
  }

  $adDetailOverlay.addEventListener('click', closeAdDetail);

  // --- Fullscreen image viewer ---
  var $fullscreenOverlay = document.getElementById('fullscreen-overlay');
  function showFullscreen(src) {
    $fullscreenOverlay.innerHTML = '<img src="' + src + '" alt="" />';
    $fullscreenOverlay.classList.remove('hidden');
  }
  $fullscreenOverlay.addEventListener('click', function() { $fullscreenOverlay.classList.add('hidden'); });

  function wireThumbClicks(container) {
    container.querySelectorAll('.ad-row-thumb[src]').forEach(function(img) {
      img.addEventListener('click', function(e) { e.stopPropagation(); showFullscreen(img.src); });
    });
  }

  // --- Render: Sync Log ---
  function renderSyncLog() {
    if (STATE.syncLog.length === 0) {
      $viewLog.innerHTML = '<div class="empty-state"><div class="empty-state-title">No Sync History</div>Sync some ads to see activity here.</div>';
      return;
    }

    $viewLog.innerHTML = STATE.syncLog.map(function(entry) {
      var time = new Date(entry.synced_at).toLocaleString();
      var statusClass = entry.status === 'success' ? 'dot-synced' : 'dot-pending';

      return '<div class="log-entry">'
        + '<div class="log-time">' + time + '</div>'
        + '<div class="log-action">'
        + '<span class="status-dot ' + statusClass + '"></span> '
        + entry.action + ' ' + entry.entity_type
        + (entry.meta_id ? ' &rarr; ' + entry.meta_id : '')
        + '</div>'
        + (entry.error ? '<div class="log-error">' + escapeHtml(entry.error) + '</div>' : '')
        + '</div>';
    }).join('');
  }

  // --- Sync ---
  async function handleSync(adSetId) {
    var $syncBtn = document.getElementById('sync-btn');
    var $syncResults = document.getElementById('sync-results');
    if ($syncBtn) { $syncBtn.disabled = true; $syncBtn.textContent = 'Syncing...'; }

    try {
      var resp = await supabaseClient.functions.invoke('meta-sync', { body: { ad_set_id: adSetId } });
      var errMsg = await fnError(resp.error, resp.data);
      if (errMsg) {
        console.error('Sync error:', errMsg);
        if ($syncResults) { $syncResults.innerHTML = '<div class="sync-result sync-result-error">' + escapeHtml(errMsg) + '</div>'; }
        return;
      }

      var results = resp.data.synced || [];
      if ($syncResults && results.length > 0) {
        $syncResults.innerHTML = results.map(function(r) {
          if (r.success) {
            return '<div class="sync-result sync-result-success">' + r.action + ': ' + r.ad_id.slice(0, 8) + ' &rarr; ' + (r.meta_ad_id || '') + '</div>';
          } else {
            return '<div class="sync-result sync-result-error">' + r.action + ': ' + r.ad_id.slice(0, 8) + ' &mdash; ' + escapeHtml(r.error) + '</div>';
          }
        }).join('');
      } else if ($syncResults && resp.data.message) {
        $syncResults.innerHTML = '<div class="sync-result sync-result-success">' + escapeHtml(resp.data.message) + '</div>';
      }

      await loadData();
    } catch (err) {
      console.error('Sync error:', err);
      if ($syncResults) { $syncResults.innerHTML = '<div class="sync-result sync-result-error">' + escapeHtml(err.message || 'Sync failed') + '</div>'; }
    } finally {
      if ($syncBtn) { $syncBtn.disabled = false; $syncBtn.textContent = 'Sync'; }
    }
  }

  // --- Helpers ---
  function getCampaignExpectedCities(campaign) {
    if (!campaign.language_code) return [];
    return STATE.cities.filter(function(city) {
      return city.country && city.country.language_code === campaign.language_code;
    });
  }

  function renderCityDetail(adSet) {
    var targeted = getAdSetTargetedCityKeys(adSet);
    if (targeted.length === 0 && adSet.city_scope !== 'all') return '';

    var html = '<div style="padding:8px 16px 12px;">';
    html += '<div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;">'
      + 'Cities' + (adSet.city_scope === 'all' ? ' (all for language)' : ' (specific)')
      + '</div>';

    // Targeted cities
    var targetedNames = targeted.map(function(key) {
      var city = STATE.cities.find(function(c) { return c.meta_geo_key === key; });
      return city ? city.name : 'key:' + key;
    });
    if (targetedNames.length > 0) {
      html += targetedNames.map(function(name) {
        return '<span style="display:inline-block;padding:2px 8px;margin:0 4px 4px 0;background:#D1F2D1;color:#1B7A1B;border-radius:5px;font-size:12px;">' + escapeHtml(name) + '</span>';
      }).join('');
    }

    // Missing cities (only for "all" scope)
    if (adSet.city_scope === 'all' && adSet.campaign_id) {
      var campaign = STATE.campaigns.find(function(c) { return c.id === adSet.campaign_id; });
      if (campaign) {
        var expected = getCampaignExpectedCities(campaign);
        var missing = expected.filter(function(city) {
          return targeted.indexOf(city.meta_geo_key) === -1;
        });
        if (missing.length > 0) {
          html += missing.map(function(city) {
            return '<span style="display:inline-block;padding:2px 8px;margin:0 4px 4px 0;background:#F8D7DA;color:#721C24;border-radius:5px;font-size:12px;">' + escapeHtml(city.name) + ' (missing)</span>';
          }).join('');
        }
      }
    }

    html += '</div>';
    return html;
  }

  function getAdSetTargetedCityKeys(adSet) {
    if (!adSet.targeting || !adSet.targeting.geo_locations) return [];
    var gl = adSet.targeting.geo_locations;
    var keys = [];
    if (gl.cities) gl.cities.forEach(function(c) { keys.push(c.key || c.key_); });
    if (gl.medium_geo_areas) gl.medium_geo_areas.forEach(function(c) { keys.push(c.key || c.key_); });
    if (gl.regions) gl.regions.forEach(function(c) { keys.push(c.key || c.key_); });
    return keys;
  }

  function getGeoLocationNames(gl) {
    var names = [];
    if (gl.cities && gl.cities.length > 0) gl.cities.forEach(function(c) { names.push(c.name || ('key:' + c.key)); });
    if (gl.medium_geo_areas && gl.medium_geo_areas.length > 0) gl.medium_geo_areas.forEach(function(a) { names.push(a.name || ('key:' + a.key)); });
    if (gl.regions && gl.regions.length > 0) gl.regions.forEach(function(r) { names.push(r.name || r); });
    if (gl.countries && gl.countries.length > 0) gl.countries.forEach(function(c) { names.push(typeof c === 'string' ? c : c.name || c); });
    return names;
  }

  function getTargetingSummary(targeting) {
    if (!targeting) return '';
    var parts = [];
    if (targeting.age_min || targeting.age_max) parts.push((targeting.age_min || '?') + '–' + (targeting.age_max || '?'));
    if (targeting.geo_locations) {
      var geoNames = getGeoLocationNames(targeting.geo_locations);
      if (geoNames.length > 0) parts.push(geoNames.join(', '));
    }
    return parts.join(' · ');
  }

  function renderTargetingInfo(targeting) {
    if (!targeting) return '';
    var parts = [];
    if (targeting.age_min || targeting.age_max) {
      parts.push((targeting.age_min || '?') + '–' + (targeting.age_max || '?'));
    }
    if (targeting.geo_locations) {
      var geoNames = getGeoLocationNames(targeting.geo_locations);
      if (geoNames.length > 0) parts.push(geoNames.join(', '));
    }
    if (targeting.genders && targeting.genders.length > 0 && targeting.genders.length < 2) {
      parts.push(targeting.genders[0] === 1 ? 'Male' : 'Female');
    }
    if (targeting.flexible_spec && targeting.flexible_spec.length > 0) {
      var interests = [];
      targeting.flexible_spec.forEach(function(spec) {
        if (spec.interests) spec.interests.forEach(function(i) { interests.push(i.name || i.id); });
      });
      if (interests.length > 0) parts.push(interests.join(', '));
    }
    if (parts.length === 0) return '';
    return '<div class="targeting-info">' + parts.map(function(p) { return '<span>' + escapeHtml(p) + '</span>'; }).join(' · ') + '</div>';
  }

  function statusLabel(ad) {
    var d = ad.desired_status;
    var m = ad.meta_status;
    if (d === 'draft') return '<span class="status-dot dot-draft"></span> Draft';
    if (d === 'queued' && !m) return '<span class="status-dot dot-queued"></span> Queued for publishing';
    if (d === 'live' && m === 'ACTIVE') return '<span class="status-dot dot-synced"></span> Live';
    if (d === 'live' && m === 'PAUSED') return '<span class="status-dot dot-pending"></span> Paused on Meta &middot; pending unpause';
    if (d === 'live' && !m) return '<span class="status-dot dot-pending"></span> Queued to go live';
    if (d === 'paused' && m === 'ACTIVE') return '<span class="status-dot dot-pending"></span> Live on Meta &middot; pending pause';
    if (d === 'paused' && m === 'PAUSED') return '<span class="status-dot dot-paused"></span> Paused';
    if (d === 'paused' && !m) return '<span class="status-dot dot-paused"></span> Paused';
    return '<span class="status-dot dot-' + d + '"></span> ' + d + (m ? ' &rarr; Meta: ' + m : '');
  }

  function statusActionHtml(ad) {
    var btn = '';
    if (ad.desired_status === 'draft') btn = '<button class="status-action-btn action-queue" data-ad-id="' + ad.id + '" data-next="queued">Queue</button>';
    else if (ad.desired_status === 'queued') btn = '<button class="status-action-btn action-unqueue" data-ad-id="' + ad.id + '" data-next="draft">Back to Draft</button>';
    else if (ad.desired_status === 'live') btn = '<button class="status-action-btn action-pause" data-ad-id="' + ad.id + '" data-next="paused">Pause</button>';
    else if (ad.desired_status === 'paused') btn = '<button class="status-action-btn action-unpause" data-ad-id="' + ad.id + '" data-next="live">Unpause</button>';
    return btn;
  }

  function wireStatusActions(container) {
    container.querySelectorAll('.status-action-btn').forEach(function(btn) {
      btn.addEventListener('click', async function(e) {
        e.stopPropagation();
        var adId = btn.dataset.adId;
        var next = btn.dataset.next;
        btn.disabled = true;

        // For synced ads (pause/unpause), call Meta immediately
        var ad = STATE.ads.find(function(a) { return a.id === adId; });
        if (ad && ad.meta_ad_id && (next === 'live' || next === 'paused')) {
          try {
            var resp = await supabaseClient.functions.invoke('meta-sync', {
              body: { action: 'update_ad_status', ad_id: adId, desired_status: next }
            });
            var errMsg = await fnError(resp.error, resp.data);
            if (errMsg) { alert('Failed: ' + errMsg); btn.disabled = false; return; }
          } catch (err) {
            console.error('Update ad status error:', err);
            alert('Failed: ' + (err.message || 'Unknown error'));
            btn.disabled = false;
            return;
          }
        } else {
          // Local-only status change (draft/queued)
          var res = await db().from('meta_ad').update({ desired_status: next }).eq('id', adId);
          if (res.error) { alert('Failed: ' + res.error.message); btn.disabled = false; return; }
        }

        if (!$adDetailSheet.classList.contains('hidden')) closeAdDetail();
        await loadData();
      });
    });
  }

  function needsSync(ad) {
    if (ad.desired_status === 'queued' && !ad.meta_ad_id) return true;
    if (ad.desired_status === 'live' && ad.meta_status !== 'ACTIVE') return true;
    if (ad.desired_status === 'paused' && ad.meta_status !== 'PAUSED') return true;
    return false;
  }

  function getSyncState(ad) {
    if (needsSync(ad)) return 'pending';
    if (ad.meta_ad_id) return 'synced';
    return 'none';
  }

  // --- Init ---
  async function initApp() {
    if (appInitialised) return;
    appInitialised = true;
    await loadData();
    $loading.classList.add('hidden');
    $app.classList.remove('hidden');
  }

  // --- Boot ---
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  supabaseClient.auth.onAuthStateChange(function(event, session) {
    currentSession = session;
    if (session) {
      $loginScreen.classList.add('hidden');
      initApp();
    } else {
      $loading.classList.add('hidden');
      $loginScreen.classList.remove('hidden');
      $app.classList.add('hidden');
      appInitialised = false;
    }
  });

})();
</script>
</body>
