  function renderImageGrid(images) {
    // Archive toggle (always shown)
    let html = '<div class="archive-toggle">'
      + '<button class="archive-toggle-btn' + (!showArchived ? ' active' : '') + '" data-show="active">Active</button>'
      + '<button class="archive-toggle-btn' + (showArchived ? ' active' : '') + '" data-show="archived">Archived</button>'
      + '</div>';

    if (!images.length) {
      const emptyMsg = showArchived
        ? '<div>No archived images.</div>'
        : '<div>No images yet.</div><div style="font-size:13px;">Head to Generate to create some.</div>';
      $libImageGrid.innerHTML = html
        + '<div class="lib-empty"><div style="font-size:32px; opacity:0.3;">&#128247;</div>' + emptyMsg + '</div>';
      attachArchiveToggleHandlers();
      return;
    }

    // Header with count + select button
    html += '<div class="image-grid-header">'
      + '<span class="image-grid-header-label">' + images.length + ' image' + (images.length !== 1 ? 's' : '') + '</span>'
      + '<button class="image-select-btn" id="image-select-toggle">' + (selectMode ? 'Cancel' : 'Select') + '</button>'
      + '</div>';

    // Group images by generation_prompt.id
    const grouped = new Map();
    const ungrouped = [];

    images.forEach(img => {
      if (img.generation_prompt && img.generation_prompt.id) {
        const pid = img.generation_prompt.id;
        if (!grouped.has(pid)) {
          grouped.set(pid, { prompt: img.generation_prompt, images: [] });
        }
        grouped.get(pid).images.push(img);
      } else {
        ungrouped.push(img);
      }
    });

    html += '<div class="image-grid' + (selectMode ? ' select-mode' : '') + '">';

    if (ungrouped.length) {
      ungrouped.forEach(img => { html += renderImageCell(img); });
    }

    grouped.forEach(group => {
      const promptText = group.prompt.prompt || 'Generated';
      const truncated = promptText.length > 60 ? promptText.substring(0, 60) + '...' : promptText;
      html += '<div class="image-group-divider">' + escapeHtml(truncated) + '</div>';
      group.images.forEach(img => { html += renderImageCell(img); });
    });

    html += '</div>';
    $libImageGrid.innerHTML = html;

    // Attach click handlers
    $libImageGrid.querySelectorAll('.image-cell-wrap').forEach(cell => {
      cell.addEventListener('click', () => {
        if (selectMode) {
          const id = cell.dataset.imageId;
          if (selectedImageIds.has(id)) {
            selectedImageIds.delete(id);
            cell.classList.remove('selected');
          } else {
            selectedImageIds.add(id);
            cell.classList.add('selected');
          }
          updateSelectActionBar();
        } else {
          openViewer(cell.dataset.imageId);
        }
      });
    });

    // Select toggle button
    const $selectToggle = document.getElementById('image-select-toggle');
    if ($selectToggle) {
      $selectToggle.addEventListener('click', () => {
        if (selectMode) { exitSelectMode(); } else { enterSelectMode(); }
      });
    }

    attachArchiveToggleHandlers();
  }

  function attachArchiveToggleHandlers() {
    $libImageGrid.querySelectorAll('.archive-toggle-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newShowArchived = btn.dataset.show === 'archived';
        if (newShowArchived === showArchived) return;
        showArchived = newShowArchived;
        if (selectMode) exitSelectMode();
        await loadData();
      });
    });
  }

  function enterSelectMode() {
    selectMode = true;
    selectedImageIds.clear();
    renderLibrary();
    updateSelectActionBar();
    show(document.getElementById('select-action-bar'));
  }

  function exitSelectMode() {
    selectMode = false;
    selectedImageIds.clear();
    hide(document.getElementById('select-action-bar'));
    renderLibrary();
  }

  function updateSelectActionBar() {
    const count = selectedImageIds.size;
    const $count = document.getElementById('select-count');
    const $btn = document.getElementById('select-archive-btn');

    $count.textContent = count + ' selected';

    if (showArchived) {
      $btn.textContent = 'Restore';
      $btn.className = 'select-archive-btn restore';
    } else {
      $btn.textContent = 'Archive';
      $btn.className = 'select-archive-btn archive';
    }

    $btn.disabled = count === 0;
    $btn.style.opacity = count === 0 ? '0.4' : '1';
  }

  function renderImageCell(img) {
    const src = storageBaseUrl + '/' + img.storage_path;
    const selectedClass = selectedImageIds.has(img.id) ? ' selected' : '';
    return '<div class="image-cell-wrap' + selectedClass + '" data-image-id="' + escapeHtml(img.id) + '">'
      + '<div class="select-check"></div>'
      + '<img src="' + escapeHtml(src) + '" loading="lazy" alt="" />'
      + '</div>';
  }

  // --- Ads Grid ---
  function adImageUrl(ad) {
    if (ad.composited_image_path) {
      const cacheBust = ad.updated_at ? '?t=' + new Date(ad.updated_at).getTime() : '';
      return storageBaseUrl + '/' + ad.composited_image_path + cacheBust;
    }
    if (ad.base_image && ad.base_image.storage_path) {
      return storageBaseUrl + '/' + ad.base_image.storage_path;
    }
    return '';
  }

  function renderAdsGrid(ads) {
    if (!ads.length) {
      $libAdsView.innerHTML = '<div class="lib-empty">'
        + '<div style="font-size:32px; opacity:0.3;">&#128240;</div>'
        + '<div>No ads yet.</div>'
        + '<div style="font-size:13px;">Open an image and tap Build Ad to create one.</div>'
        + '</div>';
      return;
    }

    let html = '<div class="image-grid">';
    ads.forEach(ad => {
      const src = adImageUrl(ad);
      if (src) {
        html += '<img data-ad-id="' + escapeHtml(ad.id) + '" '
          + 'src="' + escapeHtml(src) + '" '
          + 'loading="lazy" '
          + 'alt="" />';
      }
    });
    html += '</div>';
    $libAdsView.innerHTML = html;

    // Attach click handlers — open fullscreen ad viewer
    $libAdsView.querySelectorAll('[data-ad-id]').forEach(cell => {
      cell.addEventListener('click', () => {
        openAdViewer(cell.dataset.adId);
      });
    });
  }

  // --- Fullscreen Ad Viewer ---
  function openAdViewer(adId) {
    const ads = filteredAds();
    const idx = ads.findIndex(ad => ad.id === adId);
    if (idx === -1) return;

    adViewerIndex = idx;
    adViewerOpen = true;
    updateAdViewerImage();
    show($adViewer);
    document.body.style.overflow = 'hidden';
  }

  function closeAdViewer() {
    adViewerOpen = false;
    adViewerIndex = -1;
    hide($adViewer);
    document.body.style.overflow = '';
    $adViewerImage.style.transform = '';
  }

  function updateAdViewerImage() {
    const ads = filteredAds();
    if (adViewerIndex < 0 || adViewerIndex >= ads.length) return;
    const ad = ads[adViewerIndex];
    $adViewerImage.src = adImageUrl(ad);
    $adViewerCounter.textContent = (adViewerIndex + 1) + ' of ' + ads.length;
    $adViewerImage.style.transform = '';

    // Reset regenerate button state
    if (!adRegenerating) {
      $adViewerRegenBtn.textContent = 'Regenerate';
      $adViewerRegenBtn.disabled = false;
      $adViewerRegenBtn.classList.remove('loading');
    }
  }

  function showNextAd() {
    const ads = filteredAds();
    if (adViewerIndex < ads.length - 1) {
      adViewerIndex++;
      updateAdViewerImage();
    }
  }

  function showPrevAd() {
    if (adViewerIndex > 0) {
      adViewerIndex--;
      updateAdViewerImage();
    }
  }

  // Ad viewer close button
  $adViewerClose.addEventListener('click', closeAdViewer);

  // Regenerate button
  $adViewerRegenBtn.addEventListener('click', async () => {
    const ads = filteredAds();
    if (adViewerIndex < 0 || adViewerIndex >= ads.length) return;
    if (adRegenerating) return;

    const ad = ads[adViewerIndex];
    adRegenerating = true;
    $adViewerRegenBtn.textContent = 'Regenerating...';
    $adViewerRegenBtn.disabled = true;
    $adViewerRegenBtn.classList.add('loading');

    try {
      const { data, error } = await supabaseClient.functions.invoke('composite', {
        body: { adId: ad.id }
      });
      const errMsg = fnError(error, data);
      if (errMsg) throw new Error(errMsg);

      // Realtime subscription will fire loadData() which calls render()
      // But also reload explicitly to be safe
      await loadData();

      // Update the current viewer image with latest data
      const updatedAds = filteredAds();
      const updatedIdx = updatedAds.findIndex(a => a.id === ad.id);
      if (updatedIdx !== -1) {
        adViewerIndex = updatedIdx;
        updateAdViewerImage();
      }

      $adViewerRegenBtn.textContent = 'Regenerate';
      $adViewerRegenBtn.disabled = false;
      $adViewerRegenBtn.classList.remove('loading');
    } catch (err) {
      console.error('Regenerate failed:', err);
      $adViewerRegenBtn.textContent = 'Failed — Tap to retry';
      $adViewerRegenBtn.disabled = false;
      $adViewerRegenBtn.classList.remove('loading');
    } finally {
      adRegenerating = false;
    }
  });

  // Ad viewer swipe navigation
  (function() {
    let touchStartX = 0;
    let touchStartY = 0;
    let touchDeltaX = 0;
    let swiping = false;

    $adViewer.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchDeltaX = 0;
      swiping = false;
      $adViewerImage.style.transition = 'none';
    }, { passive: true });

    $adViewer.addEventListener('touchmove', function(e) {
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      if (!swiping && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (!swiping) {
        if (Math.abs(dy) > Math.abs(dx)) return;
        swiping = true;
      }

      if (swiping) {
        e.preventDefault();
        touchDeltaX = dx;
        $adViewerImage.style.transform = 'translateX(' + touchDeltaX + 'px)';
      }
    }, { passive: false });

    $adViewer.addEventListener('touchend', function() {
      $adViewerImage.style.transition = 'transform 0.25s ease-out';
      if (touchDeltaX > 50) {
        showPrevAd();
      } else if (touchDeltaX < -50) {
        showNextAd();
      } else {
        $adViewerImage.style.transform = '';
      }
      touchDeltaX = 0;
      swiping = false;
    }, { passive: true });
  })();

  // --- Fullscreen Image Viewer ---
  function openViewer(imageId) {
    const images = filteredImages();
    const idx = images.findIndex(img => img.id === imageId);
    if (idx === -1) return;

    viewerImageIndex = idx;
    viewerOpen = true;
    updateViewerImage();
    show($viewer);
    document.body.style.overflow = 'hidden';
  }

  function closeViewer() {
    viewerOpen = false;
    viewerImageIndex = -1;
    hide($viewer);
    document.body.style.overflow = '';
    $viewerImage.style.transform = '';
  }

  function updateViewerImage() {
    const images = filteredImages();
    if (viewerImageIndex < 0 || viewerImageIndex >= images.length) return;
    const img = images[viewerImageIndex];
    $viewerImage.src = storageBaseUrl + '/' + img.storage_path;
    $viewerCounter.textContent = (viewerImageIndex + 1) + ' of ' + images.length;
    $viewerImage.style.transform = '';
  }

  function showNextImage() {
    const images = filteredImages();
    if (viewerImageIndex < images.length - 1) {
      viewerImageIndex++;
      updateViewerImage();
    }
  }

  function showPrevImage() {
    if (viewerImageIndex > 0) {
      viewerImageIndex--;
      updateViewerImage();
    }
  }

  // Close button
  $viewerClose.addEventListener('click', closeViewer);

  // Build Ad button — opens the ad builder bottom sheet
  $viewerBuildBtn.addEventListener('click', () => {
    const images = filteredImages();
    if (viewerImageIndex >= 0 && viewerImageIndex < images.length) {
      builderImageId = images[viewerImageIndex].id;
      openAdBuilder();
    }
  });

  // Swipe navigation
  (function() {
    let touchStartX = 0;
    let touchStartY = 0;
    let touchDeltaX = 0;
    let swiping = false; // true once we confirm horizontal swipe

    $viewer.addEventListener('touchstart', function(e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchDeltaX = 0;
      swiping = false;
      $viewerImage.style.transition = 'none';
    }, { passive: true });

    $viewer.addEventListener('touchmove', function(e) {
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      // Decide direction on first significant movement
      if (!swiping && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (!swiping) {
        // If more vertical than horizontal, ignore (allow scroll)
        if (Math.abs(dy) > Math.abs(dx)) return;
        swiping = true;
      }

      if (swiping) {
        e.preventDefault();
        touchDeltaX = dx;
        $viewerImage.style.transform = 'translateX(' + touchDeltaX + 'px)';
      }
    }, { passive: false });

    $viewer.addEventListener('touchend', function() {
      $viewerImage.style.transition = 'transform 0.25s ease-out';
      if (touchDeltaX > 50) {
        showPrevImage();
      } else if (touchDeltaX < -50) {
        showNextImage();
      } else {
        $viewerImage.style.transform = '';
      }
      touchDeltaX = 0;
      swiping = false;
    }, { passive: true });
  })();

  // Close viewer on escape key (for desktop testing)
  document.addEventListener('keydown', function(e) {
    if (adViewerOpen) {
      if (e.key === 'Escape') closeAdViewer();
      if (e.key === 'ArrowLeft') showPrevAd();
      if (e.key === 'ArrowRight') showNextAd();
      return;
    }
    if (!viewerOpen) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') showPrevImage();
    if (e.key === 'ArrowRight') showNextImage();
  });

  // --- Ad Builder Bottom Sheet ---

  function openAdBuilder() {
    if (!builderImageId) return;
    selectedCaptionIds = [];
    builderCreating = false;
    renderBuilderContent();
    updateBuilderActionBtn();

    // Show backdrop + sheet
    $builderBackdrop.classList.remove('hidden');
    $builderSheet.classList.remove('hidden');

    // Trigger reflow then animate in
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        $builderBackdrop.classList.add('visible');
        $builderSheet.classList.add('visible');
      });
    });
  }

  function closeAdBuilder() {
    $builderBackdrop.classList.remove('visible');
    $builderSheet.classList.remove('visible');

    // Wait for transition to finish then hide
    setTimeout(() => {
      $builderBackdrop.classList.add('hidden');
      $builderSheet.classList.add('hidden');
      selectedCaptionIds = [];
      builderImageId = null;
      $builderContent.innerHTML = '';
    }, 300);
  }

  function renderBuilderContent() {
    const image = STATE.images.find(img => img.id === builderImageId);
    if (!image) return;

    const imgSrc = storageBaseUrl + '/' + image.storage_path;
    const captions = filteredCaptions();

    // Group captions by role
    const roleOrder = ['headline', 'subline', 'cta', 'tagline'];
    const groups = {};
    roleOrder.forEach(r => { groups[r] = []; });
    groups['other'] = [];

    captions.forEach(cap => {
      const role = cap.role && roleOrder.includes(cap.role) ? cap.role : 'other';
      groups[role].push(cap);
    });

    let html = '';

    // Image preview
    html += '<div class="builder-preview">';
    html += '<img src="' + escapeHtml(imgSrc) + '" alt="" />';
    html += '<div>';
    html += '<div class="builder-preview-label">Select captions</div>';
    html += '<div class="builder-preview-sub">Or use image as-is</div>';
    html += '</div>';
    html += '</div>';

    // Render each role group
    const roleLabels = {
      headline: 'Headlines',
      subline: 'Sublines',
      cta: 'Calls to Action',
      tagline: 'Taglines',
      other: 'Other',
    };

    const allRoles = [...roleOrder, 'other'];
    for (const role of allRoles) {
      const caps = groups[role];
      html += '<div class="builder-role-section">';
      html += '<div class="builder-role-title">' + roleLabels[role] + '</div>';
      if (caps.length === 0) {
        html += '<div class="builder-role-empty">No ' + roleLabels[role].toLowerCase() + '</div>';
      } else {
        for (const cap of caps) {
          const isSelected = selectedCaptionIds.includes(cap.id);
          html += '<div class="builder-caption-card' + (isSelected ? ' selected' : '') + '" data-caption-id="' + escapeHtml(cap.id) + '">';
          html += '<div class="builder-caption-text">' + escapeHtml(cap.text) + '</div>';
          html += '<div class="builder-caption-check">' + (isSelected ? '&#10003;' : '') + '</div>';
          html += '</div>';
        }
      }
      html += '</div>';
    }

    $builderContent.innerHTML = html;

    // Attach click handlers to caption cards
    $builderContent.querySelectorAll('.builder-caption-card').forEach(card => {
      card.addEventListener('click', () => {
        toggleCaption(card.dataset.captionId);
      });
    });
  }

  function toggleCaption(captionId) {
    const idx = selectedCaptionIds.indexOf(captionId);
    if (idx === -1) {
      selectedCaptionIds.push(captionId);
    } else {
      selectedCaptionIds.splice(idx, 1);
    }

    // Update card visuals
    $builderContent.querySelectorAll('.builder-caption-card').forEach(card => {
      const isSelected = selectedCaptionIds.includes(card.dataset.captionId);
      card.classList.toggle('selected', isSelected);
      const checkEl = card.querySelector('.builder-caption-check');
      if (checkEl) checkEl.innerHTML = isSelected ? '&#10003;' : '';
    });

    updateBuilderActionBtn();
  }

  function updateBuilderActionBtn() {
    if (selectedCaptionIds.length > 0) {
      $builderActionBtn.textContent = 'Generate Ad (' + selectedCaptionIds.length + ')';
    } else {
      $builderActionBtn.textContent = 'Use as Ad';
    }
  }

  async function handleCreateAd() {
    if (builderCreating || !builderImageId) return;
    builderCreating = true;
    $builderActionBtn.disabled = true;
    $builderActionBtn.classList.add('loading');

    const image = STATE.images.find(img => img.id === builderImageId);
    if (!image) {
      builderCreating = false;
      $builderActionBtn.disabled = false;
      $builderActionBtn.classList.remove('loading');
      return;
    }

    try {
      if (selectedCaptionIds.length === 0) {
        // "Use as Ad" path — no captions, use base image directly
        const { data: ad, error } = await db().from('ad')
          .insert({ base_image_id: builderImageId, composited_image_path: image.storage_path })
          .select().single();
        if (error) throw error;

        if (activeSegmentId) {
          await db().from('ad_segment').insert({ ad_id: ad.id, segment_id: activeSegmentId });
        }
      } else {
        // "Generate Ad" path — with captions, trigger compositing
        const { data: ad, error } = await db().from('ad')
          .insert({ base_image_id: builderImageId })
          .select().single();
        if (error) throw error;

        for (const captionId of selectedCaptionIds) {
          await db().from('ad_caption').insert({ ad_id: ad.id, caption_id: captionId });
        }

        if (activeSegmentId) {
          await db().from('ad_segment').insert({ ad_id: ad.id, segment_id: activeSegmentId });
        }

        // Trigger compositing
        const { data: compData, error: compError } = await supabaseClient.functions.invoke('composite', {
          body: { adId: ad.id }
        });
        const compErrMsg = fnError(compError, compData);
        if (compErrMsg) throw new Error(compErrMsg);
      }

      // Close builder and viewer
      closeAdBuilder();
      closeViewer();

      // Switch to Library tab > Ads view
      switchTab('library');
      switchLibraryView('ads');

      // Reload data
      await loadData();

      // Show success toast
      showBuilderToast('Ad created');

    } catch (err) {
      console.error('handleCreateAd failed:', err);
      $builderActionBtn.disabled = false;
      $builderActionBtn.classList.remove('loading');
      $builderActionBtn.textContent = 'Failed — Tap to retry';
      builderCreating = false;
      return;
    }

    builderCreating = false;
    $builderActionBtn.disabled = false;
    $builderActionBtn.classList.remove('loading');
    updateBuilderActionBtn();
  }

  function showBuilderToast(msg) {
    $builderToast.textContent = msg;
    $builderToast.classList.add('visible');
    setTimeout(() => {
      $builderToast.classList.remove('visible');
    }, 2000);
  }

  // Wire builder events
  $builderBackdrop.addEventListener('click', closeAdBuilder);
  $builderActionBtn.addEventListener('click', handleCreateAd);

  // --- Render ---
  function render() {
    renderGenerateTab();
    renderLibrary();
  }

  // --- Boot sequence ---
  async function boot() {
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) currentSession = session;
        if (event === 'SIGNED_IN' && session) showApp(session.user);
        if (event === 'SIGNED_OUT') {
          currentSession = null;
          showLogin();
        }
      });

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentSession = session;
        showApp(session.user);
      } else {
        showLogin();
      }
    } catch (err) {
      console.error('Boot failed:', err);
      $loading.textContent = 'Failed to load.';
    }
  }

  function showLogin() {
    hide($loading);
    hide($app);
    show($loginScreen);
  }

  function showApp(user) {
    hide($loading);
    hide($loginScreen);
    show($app);
    if (!appInitialised) {
      appInitialised = true;
      init();
    }
  }

  async function init() {
    await loadData();
    connectRealtime();
  }

  // --- Login form ---
  $loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $loginEmail.value.trim();
    if (!email) return;

    $loginBtn.disabled = true;
    $loginBtn.textContent = 'Sending...';
    hide($loginMessage);

    try {
      const { error } = await supabaseClient.auth.signInWithOtp({ email });
      if (error) throw error;
      $loginMessage.textContent = 'Check your email for the magic link.';
      $loginMessage.className = 'login-message';
      show($loginMessage);
    } catch (err) {
      $loginMessage.textContent = err.message || 'Failed to send magic link.';
      $loginMessage.className = 'login-message error';
      show($loginMessage);
    } finally {
      $loginBtn.disabled = false;
      $loginBtn.textContent = 'Send magic link';
    }
  });

  // --- Sign out ---
  $signoutBtn.addEventListener('click', handleSignout);

  async function handleSignout() {
    try { await supabaseClient.auth.signOut(); } catch (e) {}
    currentSession = null;
    appInitialised = false;
    STATE = { images: [], captions: [], ads: [], segments: [] };
    showLogin();
  }

  // --- Start ---
  boot();
})();
</script>
</body>
</html>
