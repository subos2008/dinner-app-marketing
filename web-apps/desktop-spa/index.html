<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come Join Us — Ad Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap');

  :root {
    --cream: #FAF6F1;
    --warm-white: #FFF9F3;
    --amber: #C8956C;
    --amber-light: #E8C9A8;
    --amber-dark: #8B5E3C;
    --charcoal: #2C2826;
    --warm-gray: #6B6461;
    --light-gray: #E8E2DC;
    --red: #C4553A;
    --green: #5B8A5E;
    --shadow-sm: 0 1px 3px rgba(44, 40, 38, 0.08);
    --shadow-md: 0 4px 16px rgba(44, 40, 38, 0.1);
    --shadow-lg: 0 8px 32px rgba(44, 40, 38, 0.12);
    --radius: 6px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
    font-weight: 300;
    min-height: 100vh;
  }

  /* --- Top bar --- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--charcoal);
    color: var(--cream);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }

  .topbar-brand {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .topbar-brand span { opacity: 0.5; font-weight: 300; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    opacity: 0.6;
  }

  .topbar-right button {
    background: transparent;
    border: 1px solid rgba(250,246,241,0.25);
    color: var(--cream);
    padding: 4px 12px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 12px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.15s;
  }

  .topbar-right button:hover { opacity: 1; }

  /* --- Main layout --- */
  .main {
    display: grid;
    grid-template-columns: 55% 45%;
    margin-top: 52px;
    height: calc(100vh - 52px);
  }

  .panel-library {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--light-gray);
    overflow: hidden;
  }

  .panel-ads {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--light-gray);
    background: var(--warm-white);
    flex-shrink: 0;
  }

  .tab {
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--warm-gray);
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }

  .tab:hover { color: var(--charcoal); }

  .tab.active {
    color: var(--charcoal);
    font-weight: 600;
    border-bottom-color: var(--amber);
  }

  /* --- Segment filter bar --- */
  .segment-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--warm-white);
    border-bottom: 1px solid var(--light-gray);
    flex-wrap: wrap;
    min-height: 40px;
  }

  .segment-pill {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 400;
    padding: 4px 12px;
    border-radius: 14px;
    border: 1px solid var(--light-gray);
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    position: relative;
  }

  .segment-pill:hover {
    border-color: var(--amber);
    color: var(--amber-dark);
  }

  .segment-pill.active {
    background: var(--charcoal);
    color: var(--cream);
    border-color: var(--charcoal);
    font-weight: 600;
  }

  .segment-pill.drag-over {
    background: var(--amber-light);
    border-color: var(--amber);
    color: var(--amber-dark);
  }

  .segment-pill-add {
    font-size: 14px;
    padding: 2px 10px;
    border: 1px dashed var(--light-gray);
    border-radius: 14px;
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
  }

  .segment-pill-add:hover {
    border-color: var(--amber);
    color: var(--amber-dark);
  }

  .segment-add-input {
    font-family: var(--font-body);
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid var(--amber);
    border-radius: 14px;
    background: #fff;
    color: var(--charcoal);
    outline: none;
    width: 140px;
  }

  .segment-pill-menu {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 4px;
    background: #fff;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    z-index: 50;
    min-width: 100px;
    overflow: hidden;
  }

  .segment-pill-menu button {
    display: block;
    width: 100%;
    padding: 6px 12px;
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--charcoal);
    cursor: pointer;
    text-align: left;
  }

  .segment-pill-menu button:hover {
    background: var(--cream);
  }

  .segment-pill-menu button.danger {
    color: var(--red);
  }

  /* --- Segments management panel --- */
  .segment-manage-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 0;
  }

  .segment-manage-card {
    background: #fff;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    padding: 12px;
  }

  .segment-manage-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .segment-manage-header input[type="text"] {
    flex: 1;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .segment-manage-header input[type="text"]:hover,
  .segment-manage-header input[type="text"]:focus {
    border-color: var(--light-gray);
    background: var(--warm-white);
  }

  .segment-manage-header input[type="text"]:focus {
    border-color: var(--amber);
  }

  .segment-manage-delete {
    background: transparent;
    border: none;
    color: var(--warm-gray);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }

  .segment-manage-delete:hover {
    color: var(--red);
    background: rgba(196, 85, 58, 0.08);
  }

  .segment-manage-hint-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .segment-manage-card textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.4;
    padding: 6px 8px;
    border: 1px solid var(--light-gray);
    border-radius: 4px;
    background: #fff;
    color: var(--charcoal);
    resize: vertical;
    min-height: 40px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.15s;
  }

  .segment-manage-card textarea:focus {
    border-color: var(--amber);
  }

  .segment-manage-add {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .segment-manage-add input {
    flex: 1;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 10px;
    border: 1px dashed var(--light-gray);
    border-radius: var(--radius);
    background: transparent;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s;
  }

  .segment-manage-add input:focus {
    border-color: var(--amber);
    border-style: solid;
  }

  .segment-manage-add input::placeholder {
    color: var(--warm-gray);
  }

  /* --- Generate tab segment hint --- */
  .generate-segment-hint {
    margin-bottom: 12px;
    padding: 8px 10px;
    background: rgba(200, 149, 108, 0.1);
    border-left: 3px solid var(--amber);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 13px;
    color: var(--warm-gray);
    line-height: 1.4;
  }

  .generate-segment-hint strong {
    color: var(--charcoal);
    font-weight: 600;
  }

  .segment-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 10px;
    background: rgba(200, 149, 108, 0.15);
    color: var(--amber-dark);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .segment-chip .remove-seg {
    cursor: pointer;
    opacity: 0.5;
    font-size: 12px;
    line-height: 1;
  }

  .segment-chip .remove-seg:hover {
    opacity: 1;
  }

  /* --- Panel content area --- */
  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    position: relative;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--light-gray);
    background: var(--warm-white);
    flex-shrink: 0;
  }

  .panel-header h2 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
  }

  .panel-header .count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--warm-gray);
  }

  .ads-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  /* --- Image grid --- */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .image-card {
    position: relative;
    background: var(--warm-white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s;
  }

  .image-card:hover { box-shadow: var(--shadow-md); }
  .image-card[draggable] { cursor: grab; }
  .image-card[draggable]:active { cursor: grabbing; }

  .image-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  .image-card-info {
    padding: 8px 10px;
    font-size: 11px;
    color: var(--warm-gray);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .image-card-tags {
    padding: 0 10px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* --- Tag chips --- */
  .tag-chip {
    display: inline-block;
    background: var(--amber-light);
    color: var(--amber-dark);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }

  /* --- Caption strip (below images panel) --- */
  .caption-strip {
    border-top: 1px solid var(--light-gray);
    background: var(--warm-white);
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
  }

  .caption-strip:empty { display: none; }

  .caption-chip {
    background: var(--amber-light);
    color: var(--amber-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 16px;
    white-space: nowrap;
    cursor: grab;
    user-select: none;
    flex-shrink: 0;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: box-shadow 0.15s;
  }

  .caption-chip:active { cursor: grabbing; }
  .caption-chip:hover { box-shadow: var(--shadow-md); }

  /* --- Caption cards --- */
  .caption-card {
    position: relative;
    background: var(--warm-white);
    padding: 14px 40px 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.15s;
  }

  .caption-card:active { cursor: grabbing; }
  .caption-card:hover { box-shadow: var(--shadow-md); }

  .caption-card-text {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .caption-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .role-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border-radius: 3px;
    line-height: 1.4;
    font-family: var(--font-mono);
  }

  .role-badge.headline { background: #E8D5B7; color: #6B4E2B; }
  .role-badge.subline  { background: #D5E8D5; color: #2B6B3E; }
  .role-badge.cta      { background: #E8D5D5; color: #6B2B2B; }
  .role-badge.tagline  { background: #D5D5E8; color: #2B2B6B; }
  .role-badge.general  { background: var(--light-gray); color: var(--warm-gray); }

  .caption-role-select {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: var(--warm-white);
    font-family: var(--font-body);
  }

  .ad-builder-caption-zones {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .drop-zone.drop-zone-half {
    min-height: 56px;
    flex: 1;
  }

  .drop-zone.filled.caption-zone-filled {
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    padding: 8px;
    gap: 4px;
  }

  .builder-caption-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: var(--cream);
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.3;
  }

  .builder-caption-item .btn-clear {
    position: static;
    background: transparent;
    color: var(--warm-gray);
    border: none;
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
  }

  .builder-caption-item .btn-clear:hover { color: var(--red); }

  /* --- Body copy cards --- */
  .bodycopy-card {
    position: relative;
    background: var(--warm-white);
    padding: 14px 40px 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
  }

  .bodycopy-card:hover { box-shadow: var(--shadow-md); }

  .bodycopy-headline {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .bodycopy-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--warm-gray);
    margin-bottom: 6px;
  }

  .bodycopy-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* --- Delete button (cards) --- */
  .btn-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--warm-gray);
    font-size: 16px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    line-height: 1;
    padding: 4px;
  }

  .image-card:hover .btn-delete,
  .caption-card:hover .btn-delete,
  .bodycopy-card:hover .btn-delete,
  .ad-card:hover .btn-delete {
    opacity: 1;
  }

  .btn-delete:hover { color: var(--red); }

  /* --- Add forms --- */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .add-form input,
  .add-form textarea {
    flex: 1;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s;
  }

  .add-form input:focus,
  .add-form textarea:focus {
    border-color: var(--amber);
  }

  .add-form textarea {
    min-height: 60px;
    resize: vertical;
  }

  .add-form button,
  .btn-primary {
    flex-shrink: 0;
    background: var(--amber);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .add-form button:hover,
  .btn-primary:hover {
    background: var(--amber-dark);
  }

  .bodycopy-form {
    flex-direction: column;
  }

  .bodycopy-form-row {
    display: flex;
    gap: 8px;
  }

  /* --- Ad cards --- */
  .ad-card {
    position: relative;
    background: #fff;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s;
  }

  .ad-card:hover { box-shadow: var(--shadow-md); }

  .ad-card-image {
    position: relative;
    width: 100%;
    background: var(--light-gray);
  }

  .ad-card-image img {
    width: 100%;
    display: block;
  }

  .ad-card-caption-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(44, 40, 38, 0.75);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
  }

  .ad-card-body {
    padding: 16px;
  }

  .ad-card-caption-text {
    font-style: italic;
    color: var(--warm-gray);
    font-size: 14px;
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 3px solid var(--amber-light);
  }

  .ad-card-bodycopy {
    margin-bottom: 12px;
  }

  .ad-card-bodycopy-headline {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
  }

  .ad-card-bodycopy-text {
    font-size: 13px;
    color: var(--warm-gray);
    line-height: 1.5;
  }

  .ad-card-status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .ad-card-status label {
    font-size: 12px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .ad-card-status select {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 4px 8px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    cursor: pointer;
  }

  .status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .status-badge.draft { background: var(--light-gray); color: var(--warm-gray); }
  .status-badge.approved, .status-badge.queued { background: #d9ead3; color: var(--green); }
  .status-badge.active, .status-badge.live { background: #d1f0d1; color: var(--green); }
  .status-badge.paused { background: #f5d5cc; color: var(--red); }
  .status-badge.warning { background: #fce8d5; color: var(--amber-dark); font-weight: 400; }

  .status-action-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    border: none;
    transition: opacity 0.15s;
  }
  .status-action-btn:hover { opacity: 0.85; }
  .status-action-btn.approve { background: var(--green); color: #fff; }
  .status-action-btn.pause { background: var(--red); color: #fff; }
  .status-action-btn.reactivate { background: var(--amber); color: #fff; }
  .status-action-btn.revert { background: transparent; color: var(--warm-gray); border: 1px solid var(--light-gray); font-weight: 400; }

  /* --- Ad set chip on ad cards --- */
  .adset-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 10px;
    background: rgba(91, 138, 94, 0.15);
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* --- Sync indicator --- */
  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    background: rgba(200, 149, 108, 0.2);
    color: var(--amber);
    opacity: 1;
  }
  .sync-badge.in-sync {
    background: rgba(91, 138, 94, 0.15);
    color: var(--green);
  }

  /* --- Ad Sets management panel --- */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  'use strict';

  // --- Config (public/publishable values) ---
  const SUPABASE_URL = 'https://pqrhphvbyjqhntqjzljc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_vJfmD1tuFO7X2tiKTmRe3Q_-Py5ObXh';

  // --- State ---
  let STATE = { images: [], captions: [], bodyCopy: [], ads: [], adSets: [], campaigns: [], tags: [], segments: [] };
  let activeSegment = 'all'; // 'all', 'generic', or a segment UUID
  const storageBaseUrl = SUPABASE_URL + '/storage/v1/object/public/creative';
  let activeTab = 'images';
  let supabaseClient = null;
  let currentSession = null;
  let appInitialised = false;

  // Ad builder state
  let builderState = { imageId: null, captionIds: [] };

  // --- Supabase helpers ---
  /** Marketing schema query builder */
  function db() { return supabaseClient.schema('marketing'); }

  // --- DOM refs ---
  const $loading = document.getElementById('loading');
  const $loginScreen = document.getElementById('login-screen');
  const $loginForm = document.getElementById('login-form');
  const $loginEmail = document.getElementById('login-email');
  const $loginBtn = document.getElementById('login-btn');
  const $loginMessage = document.getElementById('login-message');
  const $app = document.getElementById('app');
  const $userEmail = document.getElementById('user-email');
  const $signoutBtn = document.getElementById('signout-btn');
  const $panelImages = document.getElementById('panel-images');
  const $panelCaptions = document.getElementById('panel-captions');
  const $panelBodycopy = document.getElementById('panel-bodycopy');
  const $panelGenerate = document.getElementById('panel-generate');
  const $panelAdsTab = document.getElementById('panel-ads-tab');
  const $panelAdSets = document.getElementById('panel-adsets');
  const $panelSegments = document.getElementById('panel-segments');
  const $captionStrip = document.getElementById('caption-strip');
  const $adsList = document.getElementById('ads-list');
  const $dropZoneImage = document.getElementById('drop-zone-image');
  const $dropZoneHeadline = document.getElementById('drop-zone-headline');
  const $dropZoneCta = document.getElementById('drop-zone-cta');
  const $builderBodycopy = document.getElementById('builder-bodycopy-select');
  const $builderAdSet = document.getElementById('builder-adset-select');
  const $builderCreateBtn = document.getElementById('builder-create-btn');

  // --- Utility ---
  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function filterBySegment(items) {
    if (activeSegment === 'all') return items;
    if (activeSegment === 'generic') return items.filter(item => !item.segments || item.segments.length === 0);
    return items.filter(item => (item.segments || []).some(s => s.id === activeSegment));
  }

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  // --- Boot sequence ---
  async function boot() {
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentSession = session;
        }
        if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session) {
          showApp(session.user);
        }
        if (event === 'SIGNED_OUT') {
          currentSession = null;
          showLogin();
        }
      });

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentSession = session;
        showApp(session.user);
      } else {
        showLogin();
      }
    } catch (err) {
      console.error('Boot failed:', err);
      $loading.textContent = 'Failed to load.';
    }
  }

  function showLogin() {
    hide($loading);
    hide($app);
    show($loginScreen);
  }

  function showApp(user) {
    hide($loading);
    hide($loginScreen);
    show($app);
    $userEmail.textContent = user.email || '';
    if (!appInitialised) {
      appInitialised = true;
      init();
    }
  }

  async function init() {
    await loadData();
    connectRealtime();
    setupTabs();
  }

  // --- Login form ---
  $loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $loginEmail.value.trim();
    if (!email) return;

    $loginBtn.disabled = true;
    $loginBtn.textContent = 'Sending...';
    hide($loginMessage);

    try {
      const { error } = await supabaseClient.auth.signInWithOtp({ email });
      if (error) throw error;
      $loginMessage.textContent = 'Check your email for the magic link.';
      $loginMessage.className = 'login-message';
      show($loginMessage);
    } catch (err) {
      $loginMessage.textContent = err.message || 'Failed to send magic link.';
      $loginMessage.className = 'login-message error';
      show($loginMessage);
    } finally {
      $loginBtn.disabled = false;
      $loginBtn.textContent = 'Send magic link';
    }
  });

  // --- Sign out ---

    currentSession = null;

  // --- Data loading (direct Supabase queries) ---
  async function loadData() {
    try {
      const [rawImages, rawCaptions, rawBc, rawAds, rawAdSets, rawCampaigns, rawTags, rawSegments] = await Promise.all([
        db().from('base_image')
          .select('*, base_image_tag(tag_id, tag:tag_id(id, name)), base_image_segment(segment_id, segment:segment_id(id, name)), generation_prompt:generation_prompt_id(id, type, prompt, created_at)')
          .order('created_at', { ascending: false }),
        db().from('caption')
          .select('*, caption_tag(tag_id, tag:tag_id(id, name)), caption_segment(segment_id, segment:segment_id(id, name)), generation_prompt:generation_prompt_id(id, type, prompt, created_at)')
          .order('created_at', { ascending: false }),
        db().from('body_copy')
          .select('*, body_copy_tag(tag_id, tag:tag_id(id, name)), body_copy_segment(segment_id, segment:segment_id(id, name))')
          .order('created_at', { ascending: false }),
        db().from('ad')
          .select('*, base_image:base_image_id(*), body_copy:body_copy_id(*), ad_set:ad_set_id(id, name, meta_ad_set_id, campaign_id, daily_budget_cents, age_min, age_max, geo_locations, placements), ad_segment(segment_id, segment:segment_id(id, name)), ad_caption(caption_id, caption:caption_id(*))')
          .order('created_at', { ascending: false }),
        db().from('ad_set')
          .select('*, campaign:campaign_id(id, name, meta_campaign_id)')
          .order('created_at', { ascending: false }),
        db().from('campaign')
          .select('*')
          .order('created_at', { ascending: false }),
        db().from('tag')
          .select('*')
          .order('name'),
        db().from('segment')
          .select('*')
          .order('name'),
      ]);

      const images = (rawImages.data || []).map(row => {
        const tags = (row.base_image_tag || []).map(jt => jt.tag).filter(Boolean);
        const segments = (row.base_image_segment || []).map(js => js.segment).filter(Boolean);
        const { base_image_tag, base_image_segment, ...rest } = row;
        return { ...rest, tags, segments };
      });
      const captions = (rawCaptions.data || []).map(row => {
        const tags = (row.caption_tag || []).map(jt => jt.tag).filter(Boolean);
        const segments = (row.caption_segment || []).map(js => js.segment).filter(Boolean);
        const { caption_tag, caption_segment, ...rest } = row;
        return { ...rest, tags, segments };
      });
      const bodyCopy = (rawBc.data || []).map(row => {
        const tags = (row.body_copy_tag || []).map(jt => jt.tag).filter(Boolean);
        const segments = (row.body_copy_segment || []).map(js => js.segment).filter(Boolean);
        const { body_copy_tag, body_copy_segment, ...rest } = row;
        return { ...rest, tags, segments };
      });
      const ads = (rawAds.data || []).map(row => {
        const segments = (row.ad_segment || []).map(js => js.segment).filter(Boolean);
        const captions = (row.ad_caption || []).map(jc => jc.caption).filter(Boolean);
        const { ad_segment, ad_caption, ...rest } = row;
        return { ...rest, segments, captions };
      });

      STATE = {
        images,
        captions,
        bodyCopy,
        ads,
        adSets: rawAdSets.data || [],
        campaigns: rawCampaigns.data || [],
        tags: rawTags.data || [],
        segments: rawSegments.data || [],
      };
      render();
    } catch (err) {
      console.error('loadData failed:', err);
    }
  }

  // --- Realtime (replaces SSE) ---
  function connectRealtime() {
    supabaseClient
      .channel('marketing-changes')
      .on('postgres_changes', { event: '*', schema: 'marketing', table: 'ad' }, () => loadData())
      .on('postgres_changes', { event: '*', schema: 'marketing', table: 'ad_set' }, () => loadData())
      .on('postgres_changes', { event: '*', schema: 'marketing', table: 'campaign' }, () => loadData())
      .subscribe();
  }

  // --- Segment bar ---
  function renderSegmentBar() {
    const $bar = document.getElementById('segment-bar');
    let html = '<button class="segment-pill' + (activeSegment === 'all' ? ' active' : '') + '" data-segment="all">All</button>';
    html += '<button class="segment-pill' + (activeSegment === 'generic' ? ' active' : '') + '" data-segment="generic">Generic</button>';

    for (const seg of STATE.segments) {
      html += '<button class="segment-pill' + (activeSegment === seg.id ? ' active' : '') + '" data-segment="' + seg.id + '" data-segment-name="' + escapeHtml(seg.name) + '">'
        + escapeHtml(seg.name)
        + '</button>';
    }

    html += '<button class="segment-pill-add" id="segment-add-btn" title="Add segment">+</button>';
    $bar.innerHTML = html;

    // Click handlers for pills
    $bar.querySelectorAll('.segment-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        activeSegment = pill.dataset.segment;
        render();
      });

      // Right-click context menu for real segments (not All/Generic)
      if (pill.dataset.segment !== 'all' && pill.dataset.segment !== 'generic') {
        pill.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          showSegmentMenu(pill, pill.dataset.segment, pill.dataset.segmentName);
        });

        // Drop target for assigning items to segments
        pill.addEventListener('dragover', (e) => {
          e.preventDefault();
          pill.classList.add('drag-over');
        });
        pill.addEventListener('dragleave', () => {
          pill.classList.remove('drag-over');
        });
        pill.addEventListener('drop', async (e) => {
          e.preventDefault();
          pill.classList.remove('drag-over');
          const segmentId = pill.dataset.segment;
          const imageId = e.dataTransfer.getData('application/image-id');
          const captionId = e.dataTransfer.getData('application/caption-id');
          const bodyCopyId = e.dataTransfer.getData('application/bodycopy-id');
          const adId = e.dataTransfer.getData('application/ad-id');
          try {
            if (imageId) await db().from('base_image_segment').insert({ base_image_id: imageId, segment_id: segmentId });
            if (captionId) await db().from('caption_segment').insert({ caption_id: captionId, segment_id: segmentId });
            if (bodyCopyId) await db().from('body_copy_segment').insert({ body_copy_id: bodyCopyId, segment_id: segmentId });
            if (adId) await db().from('ad_segment').insert({ ad_id: adId, segment_id: segmentId });
            await loadData();
          } catch (err) {
            console.error('Assign segment failed:', err);
          }
        });
      }
    });

    // Add button
    document.getElementById('segment-add-btn').addEventListener('click', () => {
      const btn = document.getElementById('segment-add-btn');
      const input = document.createElement('input');
      input.className = 'segment-add-input';
      input.placeholder = 'Segment name...';
      btn.replaceWith(input);
      input.focus();

      async function submit() {
        const name = input.value.trim();
        if (name) {
          try {
            await db().from('segment').insert({ name });
            await loadData();
          } catch (err) {
            console.error('Create segment failed:', err);
          }
        } else {
          renderSegmentBar();
        }
      }
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submit();
        if (e.key === 'Escape') renderSegmentBar();
      });
      input.addEventListener('blur', submit);
    });
  }

  function showSegmentMenu(pill, segmentId, segmentName) {
    // Close any existing menu
    document.querySelectorAll('.segment-pill-menu').forEach(m => m.remove());

    const menu = document.createElement('div');
    menu.className = 'segment-pill-menu';
    menu.innerHTML = '<button data-action="rename">Rename</button>'
      + '<button data-action="delete" class="danger">Delete</button>';
    pill.style.position = 'relative';
    pill.appendChild(menu);

    menu.querySelector('[data-action="rename"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      menu.remove();
      const newName = prompt('Rename segment:', segmentName);
      if (newName && newName.trim() && newName.trim() !== segmentName) {
        try {
          await db().from('segment').update({ name: newName.trim() }).eq('id', segmentId);
          await loadData();
        } catch (err) {
          console.error('Rename segment failed:', err);
        }
      }
    });

    menu.querySelector('[data-action="delete"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      menu.remove();
      if (confirm('Delete segment "' + segmentName + '"? Items won\'t be deleted, just unassigned.')) {
        try {
          if (activeSegment === segmentId) activeSegment = 'all';
          await db().from('segment').delete().eq('id', segmentId);
          await loadData();
        } catch (err) {
          console.error('Delete segment failed:', err);
        }
      }
    });

    // Close on click outside
    setTimeout(() => {
      document.addEventListener('click', function closeMenu(e) {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeMenu);
        }
      });
    }, 0);
  }

  // --- Images panel ---
  function renderImages() {
    const filtered = filterBySegment(STATE.images);
    if (filtered.length === 0) {
      $panelImages.innerHTML = '<div class="empty-state"><p>No images yet.</p><p>Upload images via the CLI or API.</p></div>';
      return;
    }

    // Group images by generation_prompt_id
    const groups = new Map(); // promptId -> { prompt, images }
    const ungrouped = [];
    for (const img of filtered) {
      const gp = img.generation_prompt;
      if (gp && gp.id) {
        if (!groups.has(gp.id)) {
          groups.set(gp.id, { prompt: gp, images: [] });
        }
        groups.get(gp.id).images.push(img);
      } else {
        ungrouped.push(img);
      }
    }

    let html = '';

    function renderImageGrid(images) {
      let g = '<div class="image-grid">';
      for (const img of images) {
        const src = storageBaseUrl + '/' + img.storage_path;
        const tagsHtml = (img.tags || []).map(t => '<span class="tag-chip">' + escapeHtml(t.name) + '</span>').join('');
        const segHtml = (img.segments || []).map(s =>
          '<span class="segment-chip">' + escapeHtml(s.name)
          + ' <span class="remove-seg" onclick="window.__removeImageSegment(\'' + img.id + '\', \'' + s.id + '\')">&times;</span>'
          + '</span>'
        ).join('');
        g += '<div class="image-card" draggable="true" data-image-id="' + img.id + '">'
          + '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(img.filename) + '" loading="lazy" onclick="window.__openLightbox(this.src, event)" style="cursor:zoom-in" />'
          + '<div class="image-card-info">' + escapeHtml(img.filename) + '</div>'
          + (tagsHtml || segHtml ? '<div class="image-card-tags">' + tagsHtml + segHtml + '</div>' : '')
          + '<button class="btn-delete" onclick="window.__deleteImage(\'' + img.id + '\')" title="Delete">&times;</button>'
          + '</div>';
      }
      g += '</div>';
      return g;
    }

    // Render grouped
    for (const [promptId, group] of groups) {
      html += '<div class="prompt-group">'
        + '<div class="prompt-group-header">'
        + '<span class="prompt-group-text" title="' + escapeHtml(group.prompt.prompt) + '">' + escapeHtml(group.prompt.prompt) + '</span>'
        + '<button class="prompt-group-reuse" data-prompt-text="' + escapeHtml(group.prompt.prompt) + '" data-prompt-type="' + escapeHtml(group.prompt.type) + '" title="Re-use this prompt">&#8635;</button>'
        + '</div>'
        + renderImageGrid(group.images)
        + '</div>';
    }

    // Render ungrouped
    if (ungrouped.length > 0) {
      html += '<div class="prompt-group">';
      if (groups.size > 0) {
        html += '<div class="prompt-group-header"><span class="prompt-group-text">Ungrouped</span></div>';
      }
      html += renderImageGrid(ungrouped) + '</div>';
    }

    $panelImages.innerHTML = html;

    // Attach drag handlers to image cards
    $panelImages.querySelectorAll('.image-card[draggable]').forEach(card => {
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('application/image-id', card.dataset.imageId);
        e.dataTransfer.effectAllowed = 'copy';
      });
    });

    // Attach re-use handlers
    $panelImages.querySelectorAll('.prompt-group-reuse').forEach(btn => {
      btn.addEventListener('click', () => {
        reusePrompt(btn.dataset.promptText, btn.dataset.promptType);
      });
    });
  }

  // --- Captions panel ---
  function renderCaptions() {
    const filtered = filterBySegment(STATE.captions);
    let html = '<form class="add-form" id="form-add-caption" style="display:flex;gap:6px;align-items:center">'
      + '<input type="text" placeholder="Write a caption..." required style="flex:1" />'
      + '<select class="caption-role-select" id="caption-role-select">'
      + '<option value="headline">Headline</option>'
      + '<option value="subline">Subline</option>'
      + '<option value="cta">CTA</option>'

      + '<button type="submit">Add</button>'
      + '</form>';

    if (filtered.length === 0) {
      html += '<div class="empty-state"><p>No captions yet.</p></div>';
    } else {
      // Group captions by generation_prompt_id
      const groups = new Map();
      const ungrouped = [];
      for (const cap of filtered) {
        const gp = cap.generation_prompt;
        if (gp && gp.id) {
          if (!groups.has(gp.id)) {
            groups.set(gp.id, { prompt: gp, captions: [] });
          }
          groups.get(gp.id).captions.push(cap);
        } else {
          ungrouped.push(cap);
        }

      function renderCaptionCards(captions) {
        let c = '';
        for (const cap of captions) {
          const roleBadge = cap.role
            ? '<span class="role-badge ' + escapeHtml(cap.role) + '">' + escapeHtml(cap.role) + '</span> '
            : '';
          const tagsHtml = (cap.tags || []).map(t => '<span class="tag-chip">' + escapeHtml(t.name) + '</span>').join('');
          const segHtml = (cap.segments || []).map(s =>
            '<span class="segment-chip">' + escapeHtml(s.name)
            + ' <span class="remove-seg" onclick="window.__removeCaptionSegment(\'' + cap.id + '\', \'' + s.id + '\')">&times;</span>'
            + '</span>'
          ).join('');
          c += '<div class="caption-card" draggable="true" data-caption-id="' + cap.id + '">'
            + '<div class="caption-card-text">' + roleBadge + escapeHtml(cap.text) + '</div>'
            + (tagsHtml || segHtml ? '<div class="caption-card-tags">' + tagsHtml + segHtml + '</div>' : '')
            + '<button class="btn-delete" onclick="window.__deleteCaption(\'' + cap.id + '\')" title="Delete">&times;</button>'
            + '</div>';
        }
        return c;
      }

      // Render grouped
      for (const [promptId, group] of groups) {
        html += '<div class="prompt-group">'
          + '<div class="prompt-group-header">'
          + '<span class="prompt-group-text" title="' + escapeHtml(group.prompt.prompt) + '">' + escapeHtml(group.prompt.prompt) + '</span>'
          + '<button class="prompt-group-reuse" data-prompt-text="' + escapeHtml(group.prompt.prompt) + '" data-prompt-type="' + escapeHtml(group.prompt.type) + '" title="Re-use this prompt">&#8635;</button>'
          + '</div>'
          + renderCaptionCards(group.captions)
          + '</div>';
      }

      // Render ungrouped
      if (ungrouped.length > 0) {
        html += '<div class="prompt-group">';
        if (groups.size > 0) {
          html += '<div class="prompt-group-header"><span class="prompt-group-text">Ungrouped</span></div>';
        }
        html += renderCaptionCards(ungrouped) + '</div>';
      }
    }
    $panelCaptions.innerHTML = html;

    // Attach add form handler
    const form = document.getElementById('form-add-caption');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = form.querySelector('input');
        const text = input.value.trim();
        if (!text) return;
        const roleSelect = document.getElementById('caption-role-select');
        const role = roleSelect ? roleSelect.value || undefined : undefined;
        try {
          const insert = { text };
          if (role) insert.role = role;
          const { data: cap, error } = await db().from('caption').insert(insert).select().single();
          if (error) throw error;
          if (activeSegment && activeSegment !== 'all' && activeSegment !== 'generic' && cap.id) {
            await db().from('caption_segment').insert({ caption_id: cap.id, segment_id: activeSegment }).catch(() => {});
          }
          await loadData();
        } catch (err) {
          console.error('Add caption failed:', err);
        }
      });
    }

    // Attach drag handlers to caption cards
    $panelCaptions.querySelectorAll('.caption-card[draggable]').forEach(card => {
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('application/caption-id', card.dataset.captionId);
        e.dataTransfer.effectAllowed = 'copy';
      });
    });

    // Attach re-use handlers
    $panelCaptions.querySelectorAll('.prompt-group-reuse').forEach(btn => {
      btn.addEventListener('click', () => {
        reusePrompt(btn.dataset.promptText, btn.dataset.promptType);
      });
    });
  }

  // --- Generate panel ---
  let generateBriefLoaded = false;
  let generateType = 'image';
  let generateBriefVisible = true;

  function renderGenerate() {
    // Only render the static shell once; subsequent calls skip
    if ($panelGenerate.querySelector('.generate-section')) return;

    const briefFromStorage = localStorage.getItem('generate-brief') || '';

    let html = '';

    // Creative brief section
    html += '<div class="generate-section generate-brief">'
      + '<div class="generate-section-header">'
      + '<label>Creative Brief</label>'
      + '<button id="generate-brief-toggle">hide</button>'
      + '</div>'
      + '<textarea id="generate-brief-text" placeholder="Loading creative brief...">' + escapeHtml(briefFromStorage) + '</textarea>'
      + '</div>';

    // Type toggle
    html += '<div class="generate-type-toggle">'
      + '<button class="active" data-gen-type="image">Image</button>'
      + '<button data-gen-type="caption">Caption</button>'
      + '</div>';

    // Prompt
    const promptFromStorage = localStorage.getItem('generate-prompt-' + generateType) || '';
    html += '<div class="generate-prompt">'
      + '<textarea id="generate-prompt-text" placeholder="Describe what you want...">' + escapeHtml(promptFromStorage) + '</textarea>'
      + '</div>';

    // Actions
    html += '<div class="generate-actions">'
      + '<button class="btn-primary" id="generate-btn" disabled>Generate</button>'
      + '<span class="generate-status" id="generate-status"></span>'
      + '</div>';

    $panelGenerate.innerHTML = html;

    // Wire up events
    const $brief = document.getElementById('generate-brief-text');
    const $briefToggle = document.getElementById('generate-brief-toggle');
    const $prompt = document.getElementById('generate-prompt-text');
    const $genBtn = document.getElementById('generate-btn');
    const $genStatus = document.getElementById('generate-status');

    // Load brief from Storage if not in localStorage
    if (!briefFromStorage && !generateBriefLoaded) {
      generateBriefLoaded = true;
      fetch(storageBaseUrl + '/creative-brief.md')
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(text => {
          if (text && !$brief.value) {
            $brief.value = text;
            localStorage.setItem('generate-brief', text);
          }
        }).catch(() => {});
    }

    // Save brief to localStorage on edit
    $brief.addEventListener('input', () => {
      localStorage.setItem('generate-brief', $brief.value);
    });

    // Toggle brief visibility
    $briefToggle.addEventListener('click', () => {
      generateBriefVisible = !generateBriefVisible;
      $brief.style.display = generateBriefVisible ? '' : 'none';
      $briefToggle.textContent = generateBriefVisible ? 'hide' : 'show';
    });

    // Type toggle
    $panelGenerate.querySelectorAll('.generate-type-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        // Save current prompt before switching
        localStorage.setItem('generate-prompt-' + generateType, $prompt.value);
        generateType = btn.dataset.genType;
        $panelGenerate.querySelectorAll('.generate-type-toggle button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Restore prompt for new type
        $prompt.value = localStorage.getItem('generate-prompt-' + generateType) || '';
        updateGenBtn();
      });
    });

    // Prompt input — enable/disable generate button + persist
    function updateGenBtn() {
      $genBtn.disabled = !$prompt.value.trim();
    }
    $prompt.addEventListener('input', () => {
      localStorage.setItem('generate-prompt-' + generateType, $prompt.value);
      updateGenBtn();
    });
    updateGenBtn();

    // Generate button
    $genBtn.addEventListener('click', async () => {
      const prompt = $prompt.value.trim();
      if (!prompt) return;

      $genBtn.disabled = true;
      $genStatus.textContent = generateType === 'image'
        ? 'Generating image... this may take a minute'
        : 'Generating captions...';

      try {
        // Include segment prompt hint if a segment is active
        let segmentHint = '';
        if (activeSegment && activeSegment !== 'all' && activeSegment !== 'generic') {
          const seg = STATE.segments.find(s => s.id === activeSegment);
          if (seg && seg.prompt_hint) segmentHint = seg.prompt_hint;
        }
        const fnName = generateType === 'image' ? 'generate-image' : 'generate-captions';
        const body = {
          brief: $brief.value || '',
          prompt,
          segment_hint: segmentHint || undefined
        };
        const { data, error } = await supabaseClient.functions.invoke(fnName, { body });

        if (error) {
          $genStatus.textContent = 'Error: ' + (error.message || 'Generation failed');
          return;
        }
        if (data && data.error) {
          $genStatus.textContent = 'Error: ' + data.error;
          return;
        }

        $genStatus.textContent = '';

        // Auto-assign active segment to generated items
        if (activeSegment && activeSegment !== 'all' && activeSegment !== 'generic') {
          if (data.image) {
            await db().from('base_image_segment').insert({ base_image_id: data.image.id, segment_id: activeSegment }).catch(() => {});
          }
          if (data.captions) {
            for (const cap of data.captions) {
              await db().from('caption_segment').insert({ caption_id: cap.id, segment_id: activeSegment }).catch(() => {});
            }
          }
        }

        // Reload data then switch to the appropriate tab
        await loadData();
        const targetTab = generateType === 'image' ? 'images' : 'captions';
        switchToTab(targetTab);

      } catch (err) {
        $genStatus.textContent = 'Error: ' + err.message;
      } finally {
        $genBtn.disabled = false;
        updateGenBtn();
      }
    });
  }

        + '</div>';

      + '<input type="text" class="seg-add-input" placeholder="+ Add new segment...">'
      + '</div>';
    html += '</div>';

    // Name editing — save on blur/enter
    $panelSegments.querySelectorAll('.seg-name-input').forEach(input => {
      const card = input.closest('.segment-manage-card');
      const segId = card.dataset.segId;

      async function saveName() {
        const newName = input.value.trim();
        const original = input.dataset.original;
        if (!newName || newName === original) {
          input.value = original;
          return;
        }
        try {
          await db().from('segment').update({ name: newName }).eq('id', segId);
          input.dataset.original = newName;
          await loadData();
        } catch (err) {
          console.error('Rename segment failed:', err);
          input.value = original;
        }
      }
      input.addEventListener('blur', saveName);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = input.dataset.original; input.blur(); }
      });
    });

    // Hint editing — save on blur/enter
    $panelSegments.querySelectorAll('.seg-hint-input').forEach(textarea => {
      const card = textarea.closest('.segment-manage-card');
      const segId = card.dataset.segId;
      const seg = STATE.segments.find(s => s.id === segId);
      let lastSaved = seg ? seg.prompt_hint || '' : '';

      async function saveHint() {
        const newHint = textarea.value.trim();
        if (newHint === lastSaved) return;
        try {
          await db().from('segment').update({ prompt_hint: newHint }).eq('id', segId);
          lastSaved = newHint;
          await loadData();
        } catch (err) {
          console.error('Update prompt hint failed:', err);
          textarea.value = lastSaved;
        }
      }
      textarea.addEventListener('blur', saveHint);
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textarea.blur(); }
        if (e.key === 'Escape') { textarea.value = lastSaved; textarea.blur(); }
      });
    });

    // Delete buttons
    $panelSegments.querySelectorAll('.segment-manage-delete').forEach(btn => {
      const card = btn.closest('.segment-manage-card');
      const segId = card.dataset.segId;
      const seg = STATE.segments.find(s => s.id === segId);
      btn.addEventListener('click', async () => {

      try {

      } catch (err) {

  // --- Sync indicator ---
  function renderSyncIndicator() {
    const $indicator = document.getElementById('sync-indicator');
    if (!$indicator) return;

    // Count entities where desired != actual
    let pendingCount = 0;

    // Campaigns: desired_status != meta_status (and not draft)
    for (const c of STATE.campaigns) {
      if (c.desired_status === 'draft') continue;
      if (!c.meta_campaign_id) { pendingCount++; continue; }
      const desired = c.desired_status === 'paused' ? 'paused' : 'active';
      if (c.meta_status !== desired) pendingCount++;
    }

    // Ad sets: desired_status != meta_status (and has campaign)
    for (const as of STATE.adSets) {
      if (as.desired_status === 'paused' && !as.meta_ad_set_id) continue;
      if (!as.meta_ad_set_id && as.campaign_id && as.desired_status !== 'paused') { pendingCount++; continue; }
      if (as.meta_ad_set_id) {
        const desired = as.desired_status === 'paused' ? 'paused' : 'active';
        if (as.meta_status !== desired) pendingCount++;
      }
    }

    // Ads: approved but no meta_ad_id, or desired != meta
    for (const ad of STATE.ads) {
      if (ad.desired_status === 'approved' && !ad.meta_ad_id && ad.composited_image_path && ad.ad_set_id) {
        pendingCount++;
      } else if (ad.meta_ad_id) {
        const desired = ad.desired_status === 'paused' ? 'paused' : 'active';
        if (ad.meta_status !== desired) pendingCount++;
      }
    }

    if (pendingCount > 0) {
      $indicator.textContent = pendingCount + ' change' + (pendingCount !== 1 ? 's' : '') + ' pending';
      $indicator.classList.remove('in-sync');
    } else {
      $indicator.textContent = 'In sync';
      $indicator.classList.add('in-sync');
    }
  }

  // --- Generate tab hint display ---
  function renderGenerateHint() {
    // Remove existing hint element if present
    const existing = document.getElementById('generate-segment-hint');
    if (existing) existing.remove();

    // Only show if a real segment is active and has a hint
    if (!activeSegment || activeSegment === 'all' || activeSegment === 'generic') return;
    const seg = STATE.segments.find(s => s.id === activeSegment);
    if (!seg || !seg.prompt_hint) return;

    const hintEl = document.createElement('div');
    hintEl.id = 'generate-segment-hint';
    hintEl.className = 'generate-segment-hint';
    hintEl.innerHTML = '<strong>Segment hint:</strong> ' + escapeHtml(seg.prompt_hint);

    // Insert after the type toggle (before the prompt textarea)
    const typeToggle = $panelGenerate.querySelector('.generate-type-toggle');
    if (typeToggle) {
      typeToggle.insertAdjacentElement('afterend', hintEl);
    }
  }

  function switchToTab(tabName) {
    activeTab = tabName;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const panelId = tabName === 'ads' ? 'panel-ads-tab' : ('panel-' + tabName);
    const panel = document.getElementById(panelId);
    if (panel) panel.classList.add('active');
  }

  function reusePrompt(text, type) {
    switchToTab('generate');
    // Set prompt text
    const $prompt = document.getElementById('generate-prompt-text');
    if ($prompt) {
      $prompt.value = text;
      localStorage.setItem('generate-prompt-' + (type || generateType), text);
    }
    // Set type toggle
    if (type === 'image' || type === 'caption') {
      generateType = type;
      $panelGenerate.querySelectorAll('.generate-type-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.genType === type);
      });
    }
    // Enable generate button
    const $genBtn = document.getElementById('generate-btn');
    if ($genBtn) $genBtn.disabled = !text;
    // Focus the prompt field
    if ($prompt) $prompt.focus();
  }

  // --- Ads ---
  function renderAdCard(ad) {
    const baseImage = ad.base_image;
    const captions = ad.captions || [];
    const bodyCopy = ad.body_copy;
    const hasComposited = !!ad.composited_image_path;
    const cacheBust = ad.updated_at ? '?t=' + new Date(ad.updated_at).getTime() : '';
    const imageSrc = hasComposited
      ? storageBaseUrl + '/' + ad.composited_image_path + cacheBust
      : (baseImage ? storageBaseUrl + '/' + baseImage.storage_path : '');

    let html = '<div class="ad-card" data-ad-id="' + ad.id + '">';

    // Image area
    if (imageSrc) {
      html += '<div class="ad-card-image">'
        + '<img src="' + escapeHtml(imageSrc) + '" loading="lazy" />';
      if (!hasComposited && captions.length > 0) {
        // Show headline caption as overlay, or first caption
        const overlayCaption = captions.find(c => c.role === 'headline') || captions[0];
        html += '<div class="ad-card-caption-overlay">' + escapeHtml(overlayCaption.text) + '</div>';
      }
      html += '</div>';
    }

    html += '<div class="ad-card-body">';

    if (captions.length > 0) {
      for (const cap of captions) {
        const badge = cap.role
          ? '<span class="role-badge ' + escapeHtml(cap.role) + '">' + escapeHtml(cap.role) + '</span> '
          : '';
        html += '<div class="ad-card-caption-text">' + badge + escapeHtml(cap.text) + '</div>';
      }
    }

    if (bodyCopy) {
      html += '<div class="ad-card-bodycopy">';
      if (bodyCopy.headline) {
        html += '<div class="ad-card-bodycopy-headline">' + escapeHtml(bodyCopy.headline) + '</div>';
      }
      html += '<div class="ad-card-bodycopy-text">' + escapeHtml(bodyCopy.text) + '</div>';
      html += '</div>';
    }

    const desiredStatus = ad.desired_status || 'draft';
    const metaStatus = ad.meta_status;
    html += '<div class="ad-card-status">';

    if (desiredStatus === 'draft' && !metaStatus) {
      // Draft, never published — show Approve button
      html += '<span class="status-badge draft">Draft</span>';
      html += '<button class="status-action-btn approve" onclick="window.__approveAd(\'' + ad.id + '\', this)">Approve</button>';
    } else if (desiredStatus === 'approved' && !metaStatus) {
      // Approved, not yet on Meta — queued for next sync
      html += '<span class="status-badge queued">Queued</span>';
      // Check pre-publish readiness
      const adSet = ad.ad_set;
      const warnings = [];
      if (!ad.composited_image_path) warnings.push('No composited image');
      if (!ad.ad_set_id) warnings.push('Not assigned to an ad set');
      if (adSet && !adSet.daily_budget_cents) warnings.push('Ad set needs budget');
      if (adSet && !adSet.geo_locations) warnings.push('Ad set needs location');
      if (adSet && !adSet.campaign_id) warnings.push('Ad set needs campaign');
      if (warnings.length) {
        html += ' <span class="status-badge warning" title="' + escapeHtml(warnings.join(', ')) + '">⚠ ' + warnings.length + ' issue' + (warnings.length > 1 ? 's' : '') + '</span>';
      }
      html += '<button class="status-action-btn revert" onclick="window.__updateAdStatus(\'' + ad.id + '\', \'draft\')">Revert to Draft</button>';
    } else if (desiredStatus === 'approved' && metaStatus === 'active') {
      // Live on Meta
      html += '<span class="status-badge active">Live</span>';
      html += '<button class="status-action-btn pause" onclick="window.__updateAdStatus(\'' + ad.id + '\', \'paused\')">Pause</button>';
    } else if (desiredStatus === 'paused' && metaStatus === 'active') {
      // Queued for pausing
      html += '<span class="status-badge active">Live</span>';
      html += '<span class="status-badge queued">Queued for pausing</span>';
    } else if (desiredStatus === 'paused' && metaStatus === 'paused') {
      // Paused on Meta
      html += '<span class="status-badge paused">Paused</span>';
      html += '<button class="status-action-btn reactivate" onclick="window.__updateAdStatus(\'' + ad.id + '\', \'approved\')">Re-activate</button>';
    } else if (desiredStatus === 'paused' && !metaStatus) {
      // Never published, paused
      html += '<span class="status-badge paused">Paused</span>';
      html += '<button class="status-action-btn approve" onclick="window.__approveAd(\'' + ad.id + '\', this)">Approve</button>';
    } else {
      // Fallback
      html += '<span class="status-badge ' + escapeHtml(desiredStatus) + '">' + escapeHtml(desiredStatus) + '</span>';
      if (metaStatus) html += ' <span class="status-badge ' + escapeHtml(metaStatus) + '">' + escapeHtml(metaStatus) + '</span>';
    }

    html += '</div>';

    // Ad set chip + segment chips
    const chipsHtml = [];
    if (ad.ad_set) {
      chipsHtml.push('<span class="adset-chip">' + escapeHtml(ad.ad_set.name) + '</span>');
    }
    const adSegHtml = (ad.segments || []).map(s =>
      '<span class="segment-chip">' + escapeHtml(s.name)
      + ' <span class="remove-seg" onclick="window.__removeAdSegment(\'' + ad.id + '\', \'' + s.id + '\')">&times;</span>'
      + '</span>'
    );
    chipsHtml.push(...adSegHtml);
    if (chipsHtml.length) {
      html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">' + chipsHtml.join('') + '</div>';
    }

    html += '<div class="ad-card-feedback">'
      + '<textarea placeholder="Feedback notes..." data-ad-id="' + ad.id + '" data-original="' + escapeHtml(ad.feedback || '') + '"'
      + ' onblur="window.__saveAdFeedback(this)">'
      + escapeHtml(ad.feedback || '')
      + '</textarea>'
      + '</div>';

    html += '<div class="ad-card-actions">';
    html += '<button class="btn-generate" onclick="window.__generateAd(\'' + ad.id + '\', this)">'
      + (hasComposited ? 'Re-generate' : 'Generate') + '</button>';
    html += '</div>';

    html += '<button class="btn-delete" onclick="window.__deleteAd(\'' + ad.id + '\')" title="Delete ad">&times;</button>';

    html += '</div>'; // ad-card-body
    html += '</div>'; // ad-card
    return html;
  }

  function renderAds() {
    const filtered = filterBySegment(STATE.ads);
    // Ads tab — full list
    if (filtered.length === 0) {
      $panelAdsTab.innerHTML = '<div class="empty-state"><p>No ads yet.</p><p>Drop an image and captions into the builder to create one.</p></div>';
    } else {
      const count = filtered.length + ' ad' + (filtered.length !== 1 ? 's' : '');
      let html = '<div style="margin-bottom:12px;font-family:var(--font-mono);font-size:12px;color:var(--warm-gray)">' + count + '</div>';
      for (const ad of filtered) {
        html += renderAdCard(ad);
      }
      $panelAdsTab.innerHTML = html;
    }

    // Right panel — always show most recent ad (unfiltered)
    if (STATE.ads.length === 0) {
      $adsList.innerHTML = '<div class="empty-state"><p>No ads yet.</p></div>';
    } else {
      $adsList.innerHTML = renderAdCard(STATE.ads[0]);
    }

    // Attach drag handlers to ad cards
    const adContainers = [$panelAdsTab, $adsList];
    adContainers.forEach(container => {
      container.querySelectorAll('.ad-card[data-ad-id]').forEach(card => {
        card.setAttribute('draggable', 'true');
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('application/ad-id', card.dataset.adId);
          e.dataTransfer.effectAllowed = 'copy';
        });
      });
    });
  }

  // --- Global event handlers (called from inline handlers) ---

  window.__openLightbox = function(src, e) {
    e.stopPropagation();
    e.preventDefault();
    const overlay = document.createElement('div');
    overlay.className = 'lightbox';
    overlay.innerHTML = '<img src="' + src + '" />';
    overlay.addEventListener('click', () => overlay.remove());
    const onKey = (ev) => {
      if (ev.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', onKey); }
    };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  };

  window.__deleteImage = async function(id) {
    if (!confirm('Delete this image?')) return;
    try {
      const { error } = await db().from('base_image').delete().eq('id', id);
      if (error) {
        if (error.code === '23503') {
          alert('Cannot delete image — it is used by one or more ads. Delete those ads first.');
        } else {
          alert(error.message || 'Failed to delete image');
        }
        return;
      }
      await loadData();
    } catch (err) {
      console.error('Delete image failed:', err);
    }
  };

  window.__deleteCaption = async function(id) {
    if (!confirm('Delete this caption?')) return;
    try {
      await db().from('caption').delete().eq('id', id);
      await loadData();
    } catch (err) {
      console.error('Delete caption failed:', err);
    }
  };

  window.__deleteBodyCopy = async function(id) {
    if (!confirm('Delete this body copy?')) return;
    try {
      await db().from('body_copy').delete().eq('id', id);
      await loadData();
    } catch (err) {
      console.error('Delete body copy failed:', err);
    }
  };

  window.__deleteAd = async function(id) {
    if (!confirm('Delete this ad?')) return;
    try {
      await db().from('ad').delete().eq('id', id);
      await loadData();
    } catch (err) {
      console.error('Delete ad failed:', err);
    }
  };

  window.__updateAdStatus = async function(id, status) {
    try {
      await db().from('ad').update({ desired_status: status }).eq('id', id);
      await loadData();
    } catch (err) {
      console.error('Update ad status failed:', err);
    }
  };

  window.__approveAd = async function(id, btn) {
    // Pre-publish validation
    const ad = STATE.ads.find(a => a.id === id);
    if (!ad) return;
    const warnings = [];
    if (!ad.composited_image_path) warnings.push('Ad has no composited image — generate it first');
    if (!ad.ad_set_id) warnings.push('Ad is not assigned to an ad set');
    if (ad.ad_set) {
      if (!ad.ad_set.daily_budget_cents) warnings.push('Ad set has no budget');
      if (!ad.ad_set.geo_locations) warnings.push('Ad set has no location targeting');
      if (!ad.ad_set.campaign_id) warnings.push('Ad set is not assigned to a campaign');
    }
    if (warnings.length > 0) {
      const proceed = confirm('Approve with warnings?\n\n' + warnings.map(w => '- ' + w).join('\n') + '\n\nApprove anyway?');
      if (!proceed) return;
    }
    try {
      await db().from('ad').update({ desired_status: 'approved' }).eq('id', id);
      await loadData();
    } catch (err) {
      console.error('Approve ad failed:', err);
    }
  };

  window.__saveAdFeedback = async function(textarea) {
    const id = textarea.dataset.adId;
    const original = textarea.dataset.original;
    const current = textarea.value;
    if (current === original) return;
    try {
      await db().from('ad').update({ feedback: current }).eq('id', id);
      textarea.dataset.original = current;
    } catch (err) {
      console.error('Save feedback failed:', err);
    }
  };

  window.__generateAd = async function(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Generating...';
    try {
      const { data, error } = await supabaseClient.functions.invoke('composite', {
        body: { adId: id }
      });
      if (error) {
        alert('Generation failed: ' + error.message);
      } else if (data && data.error) {
        alert((data.error || 'Generation failed') + (data.detail ? '\n\n' + data.detail : ''));
      }
    } catch (err) {
      alert('Generation failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  };

  window.__removeImageSegment = async function(imageId, segmentId) {
    try {
      await db().from('base_image_segment').delete().eq('base_image_id', imageId).eq('segment_id', segmentId);
      await loadData();
    } catch (err) { console.error('Remove image segment failed:', err); }
  };

  window.__removeCaptionSegment = async function(captionId, segmentId) {
    try {
      await db().from('caption_segment').delete().eq('caption_id', captionId).eq('segment_id', segmentId);
      await loadData();
    } catch (err) { console.error('Remove caption segment failed:', err); }
  };

  window.__removeBodyCopySegment = async function(bodyId, segmentId) {
    try {
      await db().from('body_copy_segment').delete().eq('body_copy_id', bodyId).eq('segment_id', segmentId);
      await loadData();
    } catch (err) { console.error('Remove body copy segment failed:', err); }
  };

  window.__removeAdSegment = async function(adId, segmentId) {
    try {
      await db().from('ad_segment').delete().eq('ad_id', adId).eq('segment_id', segmentId);
      await loadData();
    } catch (err) { console.error('Remove ad segment failed:', err); }
  };

  // --- Ad Builder ---
  function renderBuilder() {
    // Image drop zone
    const image = builderState.imageId ? STATE.images.find(i => i.id === builderState.imageId) : null;
    if (image) {
      const src = storageBaseUrl + '/' + image.storage_path;
      $dropZoneImage.innerHTML = '<img src="' + escapeHtml(src) + '" />'
        + '<button class="btn-clear" onclick="window.__clearBuilderImage()">&times;</button>';
      $dropZoneImage.classList.add('filled');
    } else {
      $dropZoneImage.innerHTML = '<span>Drop image here</span>';
      $dropZoneImage.classList.remove('filled');
    }

    // Caption drop zones — headline/subline and cta/tagline
    function renderCaptionZone($zone, roles, emptyLabel) {
      const items = builderState.captionIds
        .map(cid => STATE.captions.find(c => c.id === cid))
        .filter(cap => cap && roles.includes(cap.role || ''));
      if (items.length > 0) {
        let html = '';
        for (const cap of items) {
          const badge = cap.role
            ? '<span class="role-badge ' + escapeHtml(cap.role) + '">' + escapeHtml(cap.role) + '</span> '
            : '';
          html += '<div class="builder-caption-item">'
            + badge + escapeHtml(cap.text)
            + '<button class="btn-clear" onclick="window.__removeBuilderCaption(\'' + cap.id + '\')">&times;</button>'
            + '</div>';
        }
        $zone.innerHTML = html;
        $zone.classList.add('filled', 'caption-zone-filled');
      } else {
        $zone.innerHTML = '<span>' + emptyLabel + '</span>';
        $zone.classList.remove('filled', 'caption-zone-filled');
      }
    }
    renderCaptionZone($dropZoneHeadline, ['headline', 'subline', ''], 'Headline / Subline');
    renderCaptionZone($dropZoneCta, ['cta', 'tagline'], 'CTA / Tagline');

    // Body copy dropdown
    let options = '<option value="">Body copy (optional)</option>';
    for (const bc of STATE.bodyCopy) {
      const label = bc.headline ? bc.headline + ': ' + bc.text.slice(0, 60) : bc.text.slice(0, 80);
      options += '<option value="' + bc.id + '">' + escapeHtml(label) + '</option>';
    }
    $builderBodycopy.innerHTML = options;

    // Ad set dropdown
    let asOptions = '<option value="">Ad set (optional)</option>';
    for (const as of STATE.adSets) {
      asOptions += '<option value="' + as.id + '">' + escapeHtml(as.name) + '</option>';
    }
    $builderAdSet.innerHTML = asOptions;

    // Enable create button only if image is set
    $builderCreateBtn.disabled = !builderState.imageId;
  }

  window.__clearBuilderImage = function() {
    builderState.imageId = null;
    renderBuilder();
  };

  window.__clearBuilderCaption = function() {
    builderState.captionIds = [];
    renderBuilder();
  };

  window.__removeBuilderCaption = function(captionId) {
    builderState.captionIds = builderState.captionIds.filter(id => id !== captionId);
    renderBuilder();
  };

  // Drop zone handlers
  function setupDropZone(el, dataType, onDrop) {
    el.addEventListener('dragover', (e) => {
      if (e.dataTransfer.types.includes(dataType)) {
        e.preventDefault();
        el.classList.add('dragover');
      }
    });
    el.addEventListener('dragleave', () => {
      el.classList.remove('dragover');
    });
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      el.classList.remove('dragover');
      const id = e.dataTransfer.getData(dataType);
      if (id) onDrop(id);
    });
  }

  setupDropZone($dropZoneImage, 'application/image-id', (id) => {
    builderState.imageId = id;
    renderBuilder();
  });

  function onCaptionDrop(id) {
    if (!builderState.captionIds.includes(id)) {
      builderState.captionIds.push(id);
    }
    renderBuilder();
  }
  setupDropZone($dropZoneHeadline, 'application/caption-id', onCaptionDrop);
  setupDropZone($dropZoneCta, 'application/caption-id', onCaptionDrop);

  // Create ad button
  $builderCreateBtn.addEventListener('click', async () => {
    if (!builderState.imageId) return;

    const adInsert = { base_image_id: builderState.imageId };
    const bcId = $builderBodycopy.value;
    if (bcId) adInsert.body_copy_id = bcId;
    const asId = $builderAdSet.value;
    if (asId) adInsert.ad_set_id = asId;

    $builderCreateBtn.disabled = true;
    $builderCreateBtn.textContent = 'Creating...';

    try {
      const { data: ad, error } = await db().from('ad').insert(adInsert).select().single();
      if (error) throw error;
      // Assign captions via M2M join table
      for (const captionId of builderState.captionIds) {
        await db().from('ad_caption').insert({ ad_id: ad.id, caption_id: captionId });
      }
      await loadData();
    } catch (err) {
      console.error('Create ad failed:', err);
      alert('Failed to create ad: ' + err.message);
    } finally {
      $builderCreateBtn.textContent = 'Create Ad';
      renderBuilder();
    }
  });

  // --- Start ---
  boot();
})();
</script>
</body>
</html>
