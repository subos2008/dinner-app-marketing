<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come Join Us — Ad Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap');

  :root {
    --cream: #FAF6F1;
    --warm-white: #FFF9F3;
    --amber: #C8956C;
    --amber-light: #E8C9A8;
    --amber-dark: #8B5E3C;
    --charcoal: #2C2826;
    --warm-gray: #6B6461;
    --light-gray: #E8E2DC;
    --red: #C4553A;
    --green: #5B8A5E;
    --shadow-sm: 0 1px 3px rgba(44, 40, 38, 0.08);
    --shadow-md: 0 4px 16px rgba(44, 40, 38, 0.1);
    --shadow-lg: 0 8px 32px rgba(44, 40, 38, 0.12);
    --radius: 6px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
    font-weight: 300;
    min-height: 100vh;
  }

  /* --- Top bar --- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--charcoal);
    color: var(--cream);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }

  .topbar-brand {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .topbar-brand span { opacity: 0.5; font-weight: 300; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    opacity: 0.6;
  }

  .topbar-right button {
    background: transparent;
    border: 1px solid rgba(250,246,241,0.25);
    color: var(--cream);
    padding: 4px 12px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 12px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.15s;
  }

  .topbar-right button:hover { opacity: 1; }

  /* --- Main layout --- */
  .main {
    display: grid;
    grid-template-columns: 55% 45%;
    margin-top: 52px;
    height: calc(100vh - 52px);
  }

  .panel-library {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--light-gray);
    overflow: hidden;
  }

  .panel-ads {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--light-gray);
    background: var(--warm-white);
    flex-shrink: 0;
  }

  .tab {
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--warm-gray);
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }

  .tab:hover { color: var(--charcoal); }

  .tab.active {
    color: var(--charcoal);
    font-weight: 600;
    border-bottom-color: var(--amber);
  }

  /* --- Panel content area --- */
  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    position: relative;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--light-gray);
    background: var(--warm-white);
    flex-shrink: 0;
  }

  .panel-header h2 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
  }

  .panel-header .count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--warm-gray);
  }

  .ads-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  /* --- Image grid --- */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .image-card {
    position: relative;
    background: var(--warm-white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s, outline-color 0.15s;
    outline: 3px dashed transparent;
  }

  .image-card:hover { box-shadow: var(--shadow-md); }

  .image-card.drop-target {
    outline: 3px dashed var(--amber);
    box-shadow: var(--shadow-lg);
  }

  .image-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  .image-card-info {
    padding: 8px 10px;
    font-size: 11px;
    color: var(--warm-gray);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .image-card-tags {
    padding: 0 10px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* --- Tag chips --- */
  .tag-chip {
    display: inline-block;
    background: var(--amber-light);
    color: var(--amber-dark);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }

  /* --- Caption strip (below images panel) --- */
  .caption-strip {
    border-top: 1px solid var(--light-gray);
    background: var(--warm-white);
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
  }

  .caption-strip:empty { display: none; }

  .caption-chip {
    background: var(--amber-light);
    color: var(--amber-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 16px;
    white-space: nowrap;
    cursor: grab;
    user-select: none;
    flex-shrink: 0;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: box-shadow 0.15s;
  }

  .caption-chip:active { cursor: grabbing; }
  .caption-chip:hover { box-shadow: var(--shadow-md); }

  /* --- Caption cards --- */
  .caption-card {
    position: relative;
    background: var(--warm-white);
    padding: 14px 40px 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.15s;
  }

  .caption-card:active { cursor: grabbing; }
  .caption-card:hover { box-shadow: var(--shadow-md); }

  .caption-card-text {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .caption-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* --- Body copy cards --- */
  .bodycopy-card {
    position: relative;
    background: var(--warm-white);
    padding: 14px 40px 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
  }

  .bodycopy-card:hover { box-shadow: var(--shadow-md); }

  .bodycopy-headline {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .bodycopy-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--warm-gray);
    margin-bottom: 6px;
  }

  .bodycopy-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* --- Delete button (cards) --- */
  .btn-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--warm-gray);
    font-size: 16px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    line-height: 1;
    padding: 4px;
  }

  .caption-card:hover .btn-delete,
  .bodycopy-card:hover .btn-delete,
  .ad-card:hover .btn-delete {
    opacity: 1;
  }

  .btn-delete:hover { color: var(--red); }

  /* --- Add forms --- */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .add-form input,
  .add-form textarea {
    flex: 1;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s;
  }

  .add-form input:focus,
  .add-form textarea:focus {
    border-color: var(--amber);
  }

  .add-form textarea {
    min-height: 60px;
    resize: vertical;
  }

  .add-form button,
  .btn-primary {
    flex-shrink: 0;
    background: var(--amber);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .add-form button:hover,
  .btn-primary:hover {
    background: var(--amber-dark);
  }

  .bodycopy-form {
    flex-direction: column;
  }

  .bodycopy-form-row {
    display: flex;
    gap: 8px;
  }

  /* --- Ad cards --- */
  .ad-card {
    position: relative;
    background: #fff;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s;
  }

  .ad-card:hover { box-shadow: var(--shadow-md); }

  .ad-card-image {
    position: relative;
    width: 100%;
    background: var(--light-gray);
  }

  .ad-card-image img {
    width: 100%;
    display: block;
  }

  .ad-card-caption-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(44, 40, 38, 0.75);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
  }

  .ad-card-body {
    padding: 16px;
  }

  .ad-card-caption-text {
    font-style: italic;
    color: var(--warm-gray);
    font-size: 14px;
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 3px solid var(--amber-light);
  }

  .ad-card-bodycopy {
    margin-bottom: 12px;
  }

  .ad-card-bodycopy-headline {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
  }

  .ad-card-bodycopy-text {
    font-size: 13px;
    color: var(--warm-gray);
    line-height: 1.5;
  }

  .ad-card-status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .ad-card-status label {
    font-size: 12px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .ad-card-status select {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 4px 8px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    cursor: pointer;
  }

  .status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .status-badge.draft { background: var(--light-gray); color: var(--warm-gray); }
  .status-badge.approved { background: #d9ead3; color: var(--green); }
  .status-badge.live { background: #fce8d5; color: var(--amber-dark); }
  .status-badge.paused { background: #f5d5cc; color: var(--red); }

  .ad-card-feedback textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: var(--warm-white);
    color: var(--charcoal);
    resize: vertical;
    min-height: 48px;
    outline: none;
    transition: border-color 0.15s;
  }

  .ad-card-feedback textarea:focus { border-color: var(--amber); }

  .ad-card-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .btn-generate {
    background: var(--charcoal);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-generate:hover { opacity: 0.85; }
  .btn-generate:disabled { opacity: 0.4; cursor: default; }

  /* --- Modal --- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal-backdrop.hidden { display: none; }

  .modal {
    background: #fff;
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
  }

  .modal h3 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 20px;
  }

  .modal-preview {
    position: relative;
    margin-bottom: 20px;
    border-radius: var(--radius);
    overflow: hidden;
  }

  .modal-preview img {
    width: 100%;
    display: block;
  }

  .modal-preview-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(44, 40, 38, 0.75);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
  }

  .modal-field {
    margin-bottom: 16px;
  }

  .modal-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .modal-field select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
  }

  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--light-gray);
    padding: 8px 18px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--warm-gray);
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .btn-cancel:hover { border-color: var(--charcoal); color: var(--charcoal); }

  /* --- Empty state --- */
  .empty-state {
    text-align: center;
    color: var(--warm-gray);
    padding: 48px 24px;
    font-size: 14px;
    line-height: 1.6;
  }

  .empty-state p {
    margin-bottom: 4px;
  }

  /* --- Login screen --- */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: #fff;
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    padding: 40px;
    width: 380px;
    max-width: 100%;
    text-align: center;
  }

  .login-card h1 {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 400;
    margin-bottom: 8px;
  }

  .login-card p {
    color: var(--warm-gray);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .login-card input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }

  .login-card input:focus { border-color: var(--amber); }

  .login-card button {
    width: 100%;
    background: var(--amber);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .login-card button:hover { background: var(--amber-dark); }
  .login-card button:disabled { opacity: 0.5; cursor: default; }

  .login-message {
    margin-top: 14px;
    font-size: 13px;
    color: var(--warm-gray);
  }

  .login-message.error { color: var(--red); }

  /* --- Loading overlay --- */
  .loading-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--warm-gray);
    font-size: 14px;
  }

  /* --- Utility --- */
  .hidden { display: none !important; }

  /* Scrollbar styling */
  .tab-content::-webkit-scrollbar,
  .ads-scroll::-webkit-scrollbar,
  .caption-strip::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  .tab-content::-webkit-scrollbar-thumb,
  .ads-scroll::-webkit-scrollbar-thumb {
    background: var(--light-gray);
    border-radius: 3px;
  }
</style>
</head>
<body>

<!-- Loading state -->
<div id="loading" class="loading-overlay">Loading...</div>

<!-- Login screen -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <h1>Come Join Us</h1>
    <p>Ad Manager — sign in to continue</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
      <button type="submit" id="login-btn">Send magic link</button>
    </form>
    <div id="login-message" class="login-message hidden"></div>
  </div>
</div>

<!-- App shell -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-brand">Come Join Us <span>— Ad Manager</span></div>
    <div class="topbar-right">
      <span id="user-email"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </div>

  <div class="main">
    <!-- Left: Library panels -->
    <div class="panel-library">
      <div class="tabs">
        <div class="tab active" data-tab="images">Images</div>
        <div class="tab" data-tab="captions">Captions</div>
        <div class="tab" data-tab="bodycopy">Body Copy</div>
      </div>

      <div class="tab-content">
        <div id="panel-images" class="tab-panel active"></div>
        <div id="panel-captions" class="tab-panel"></div>
        <div id="panel-bodycopy" class="tab-panel"></div>
      </div>

      <div id="caption-strip" class="caption-strip"></div>
    </div>

    <!-- Right: Ads panel -->
    <div class="panel-ads">
      <div class="panel-header">
        <h2>Ads</h2>
        <span id="ads-count" class="count"></span>
      </div>
      <div id="ads-list" class="ads-scroll"></div>
    </div>
  </div>
</div>

<!-- Create Ad Modal -->
<div id="modal-create-ad" class="modal-backdrop hidden">
  <div class="modal">
    <h3>Create Ad</h3>
    <div id="modal-preview" class="modal-preview"></div>
    <div class="modal-field">
      <label>Body Copy</label>
      <select id="modal-bodycopy-select">
        <option value="">None</option>
      </select>
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-create">Create Ad</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  'use strict';

  // --- State ---
  let STATE = { images: [], captions: [], bodyCopy: [], ads: [], adSets: [], tags: [] };
  let storageBaseUrl = '';
  let activeTab = 'images';
  let supabaseClient = null;
  let currentSession = null;

  // Pending ad creation (from drag-drop)
  let pendingAd = { imageId: null, captionId: null };

  // --- DOM refs ---
  const $loading = document.getElementById('loading');
  const $loginScreen = document.getElementById('login-screen');
  const $loginForm = document.getElementById('login-form');
  const $loginEmail = document.getElementById('login-email');
  const $loginBtn = document.getElementById('login-btn');
  const $loginMessage = document.getElementById('login-message');
  const $app = document.getElementById('app');
  const $userEmail = document.getElementById('user-email');
  const $signoutBtn = document.getElementById('signout-btn');
  const $panelImages = document.getElementById('panel-images');
  const $panelCaptions = document.getElementById('panel-captions');
  const $panelBodycopy = document.getElementById('panel-bodycopy');
  const $captionStrip = document.getElementById('caption-strip');
  const $adsCount = document.getElementById('ads-count');
  const $adsList = document.getElementById('ads-list');
  const $modalBackdrop = document.getElementById('modal-create-ad');
  const $modalPreview = document.getElementById('modal-preview');
  const $modalBodycopySelect = document.getElementById('modal-bodycopy-select');
  const $modalCancel = document.getElementById('modal-cancel');
  const $modalCreate = document.getElementById('modal-create');

  // --- Utility ---
  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  // --- Auth helpers ---
  function getToken() {
    if (currentSession && currentSession.access_token) return currentSession.access_token;
    return null;
  }

  async function authFetch(url, opts = {}) {
    const token = getToken();
    if (!token) throw new Error('Not authenticated');
    const headers = { ...opts.headers, 'Authorization': 'Bearer ' + token };
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, { ...opts, headers });
    if (res.status === 401) {
      // Session expired
      handleSignout();
      throw new Error('Session expired');
    }
    return res;
  }

  // --- Boot sequence ---
  async function boot() {
    try {
      // 1. Fetch config
      const config = await fetch('/api/config').then(r => r.json());
      storageBaseUrl = config.storageBaseUrl;

      // 2. Init Supabase
      supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

      // 3. Check existing session
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentSession = session;
        showApp(session.user);
        return;
      }

      // 4. No session — show login
      showLogin();

      // 5. Listen for auth changes (sign-in + token refresh)
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentSession = session;
        }
        if (event === 'SIGNED_IN' && session) {
          showApp(session.user);
        }
        if (event === 'SIGNED_OUT') {
          currentSession = null;
          showLogin();
        }
      });
    } catch (err) {
      console.error('Boot failed:', err);
      $loading.textContent = 'Failed to load. Check server is running.';
    }
  }

  function showLogin() {
    hide($loading);
    hide($app);
    show($loginScreen);
  }

  function showApp(user) {
    hide($loading);
    hide($loginScreen);
    show($app);
    $userEmail.textContent = user.email || '';
    init();
  }

  async function init() {
    await loadData();
    connectSSE();
    setupTabs();
  }

  // --- Login form ---
  $loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $loginEmail.value.trim();
    if (!email) return;

    $loginBtn.disabled = true;
    $loginBtn.textContent = 'Sending...';
    hide($loginMessage);

    try {
      const { error } = await supabaseClient.auth.signInWithOtp({ email });
      if (error) throw error;
      $loginMessage.textContent = 'Check your email for the magic link.';
      $loginMessage.className = 'login-message';
      show($loginMessage);
    } catch (err) {
      $loginMessage.textContent = err.message || 'Failed to send magic link.';
      $loginMessage.className = 'login-message error';
      show($loginMessage);
    } finally {
      $loginBtn.disabled = false;
      $loginBtn.textContent = 'Send magic link';
    }
  });

  // --- Sign out ---
  $signoutBtn.addEventListener('click', handleSignout);

  async function handleSignout() {
    try { await supabaseClient.auth.signOut(); } catch (e) {}
    currentSession = null;
    localStorage.removeItem('sb-session');
    showLogin();
  }

  // --- Data loading ---
  async function loadData() {
    try {
      const [images, captions, bodyCopy, ads, adSets, tags] = await Promise.all([
        authFetch('/api/images').then(r => r.json()),
        authFetch('/api/captions').then(r => r.json()),
        authFetch('/api/body-copy').then(r => r.json()),
        authFetch('/api/ads').then(r => r.json()),
        authFetch('/api/ad-sets').then(r => r.json()),
        authFetch('/api/tags').then(r => r.json()),
      ]);
      STATE = { images, captions, bodyCopy, ads, adSets, tags };
      render();
    } catch (err) {
      console.error('loadData failed:', err);
    }
  }

  // --- SSE ---
  let sseRetryDelay = 1000;
  function connectSSE() {
    const token = getToken();
    if (!token) return;
    const es = new EventSource('/api/events?token=' + encodeURIComponent(token));
    es.onmessage = async (e) => {
      if (e.data === 'reload') await loadData();
    };
    es.onopen = () => { sseRetryDelay = 1000; };
    es.onerror = () => {
      es.close();
      setTimeout(connectSSE, sseRetryDelay);
      sseRetryDelay = Math.min(sseRetryDelay * 2, 30000);
    };
  }

  // --- Tabs ---
  function setupTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        const panelId = 'panel-' + activeTab;
        document.getElementById(panelId).classList.add('active');
      });
    });
  }

  // --- Render (called after data loads) ---
  function render() {
    renderImages();
    renderCaptions();
    renderBodyCopy();
    renderCaptionStrip();
    renderAds();
  }

  // --- Images panel ---
  function renderImages() {
    if (STATE.images.length === 0) {
      $panelImages.innerHTML = '<div class="empty-state"><p>No images yet.</p><p>Upload images via the CLI or API.</p></div>';
      return;
    }
    let html = '<div class="image-grid">';
    for (const img of STATE.images) {
      const src = storageBaseUrl + '/' + img.storage_path;
      const tagsHtml = (img.tags || []).map(t => '<span class="tag-chip">' + escapeHtml(t.name) + '</span>').join('');
      html += '<div class="image-card" data-image-id="' + img.id + '"'
        + ' ondragover="event.preventDefault(); this.classList.add(\'drop-target\')"'
        + ' ondragleave="this.classList.remove(\'drop-target\')"'
        + ' ondrop="window.__onImageDrop(event, this)">'
        + '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(img.filename) + '" loading="lazy" />'
        + '<div class="image-card-info">' + escapeHtml(img.filename) + '</div>'
        + (tagsHtml ? '<div class="image-card-tags">' + tagsHtml + '</div>' : '')
        + '</div>';
    }
    html += '</div>';
    $panelImages.innerHTML = html;
  }

  // --- Captions panel ---
  function renderCaptions() {
    let html = '<form class="add-form" id="form-add-caption">'
      + '<input type="text" placeholder="Write a caption..." required />'
      + '<button type="submit">Add</button>'
      + '</form>';

    if (STATE.captions.length === 0) {
      html += '<div class="empty-state"><p>No captions yet.</p></div>';
    } else {
      for (const cap of STATE.captions) {
        const tagsHtml = (cap.tags || []).map(t => '<span class="tag-chip">' + escapeHtml(t.name) + '</span>').join('');
        html += '<div class="caption-card" draggable="true" data-caption-id="' + cap.id + '">'
          + '<div class="caption-card-text">' + escapeHtml(cap.text) + '</div>'
          + (tagsHtml ? '<div class="caption-card-tags">' + tagsHtml + '</div>' : '')
          + '<button class="btn-delete" onclick="window.__deleteCaption(\'' + cap.id + '\')" title="Delete">&times;</button>'
          + '</div>';
      }
    }
    $panelCaptions.innerHTML = html;

    // Attach add form handler
    const form = document.getElementById('form-add-caption');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = form.querySelector('input');
        const text = input.value.trim();
        if (!text) return;
        try {
          await authFetch('/api/captions', { method: 'POST', body: { text } });
          await loadData();
        } catch (err) {
          console.error('Add caption failed:', err);
        }
      });
    }

    // Attach drag handlers to caption cards
    document.querySelectorAll('.caption-card[draggable]').forEach(card => {
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('application/caption-id', card.dataset.captionId);
        e.dataTransfer.effectAllowed = 'copy';
      });
    });
  }

  // --- Body Copy panel ---
  function renderBodyCopy() {
    let html = '<form class="add-form bodycopy-form" id="form-add-bodycopy">'
      + '<input type="text" placeholder="Headline (optional)" />'
      + '<div class="bodycopy-form-row">'
      + '<textarea placeholder="Body copy text..." required></textarea>'
      + '<button type="submit">Add</button>'
      + '</div>'
      + '</form>';

    if (STATE.bodyCopy.length === 0) {
      html += '<div class="empty-state"><p>No body copy yet.</p></div>';
    } else {
      for (const bc of STATE.bodyCopy) {
        const tagsHtml = (bc.tags || []).map(t => '<span class="tag-chip">' + escapeHtml(t.name) + '</span>').join('');
        html += '<div class="bodycopy-card" data-bodycopy-id="' + bc.id + '">'
          + (bc.headline ? '<div class="bodycopy-headline">' + escapeHtml(bc.headline) + '</div>' : '')
          + '<div class="bodycopy-text">' + escapeHtml(bc.text) + '</div>'
          + (tagsHtml ? '<div class="bodycopy-card-tags">' + tagsHtml + '</div>' : '')
          + '<button class="btn-delete" onclick="window.__deleteBodyCopy(\'' + bc.id + '\')" title="Delete">&times;</button>'
          + '</div>';
      }
    }
    $panelBodycopy.innerHTML = html;

    // Attach add form handler
    const form = document.getElementById('form-add-bodycopy');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const headlineInput = form.querySelector('input');
        const textArea = form.querySelector('textarea');
        const text = textArea.value.trim();
        if (!text) return;
        const headline = headlineInput.value.trim() || null;
        try {
          await authFetch('/api/body-copy', { method: 'POST', body: { text, headline } });
          await loadData();
        } catch (err) {
          console.error('Add body copy failed:', err);
        }
      });
    }
  }

  // --- Caption strip (persistent at bottom of library panel) ---
  function renderCaptionStrip() {
    if (STATE.captions.length === 0) {
      $captionStrip.innerHTML = '';
      return;
    }
    let html = '';
    for (const cap of STATE.captions) {
      const truncated = cap.text.length > 40 ? cap.text.slice(0, 37) + '...' : cap.text;
      html += '<div class="caption-chip" draggable="true" data-caption-id="' + cap.id + '"'
        + ' title="' + escapeHtml(cap.text) + '">'
        + escapeHtml(truncated)
        + '</div>';
    }
    $captionStrip.innerHTML = html;

    // Drag handlers for strip chips
    $captionStrip.querySelectorAll('.caption-chip').forEach(chip => {
      chip.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('application/caption-id', chip.dataset.captionId);
        e.dataTransfer.effectAllowed = 'copy';
      });
    });
  }

  // --- Ads panel ---
  function renderAds() {
    $adsCount.textContent = STATE.ads.length + ' ad' + (STATE.ads.length !== 1 ? 's' : '');

    if (STATE.ads.length === 0) {
      $adsList.innerHTML = '<div class="empty-state"><p>No ads yet.</p><p>Drag a caption onto an image to create an ad.</p></div>';
      return;
    }

    let html = '';
    for (const ad of STATE.ads) {
      const baseImage = ad.base_image;
      const caption = ad.caption;
      const bodyCopy = ad.body_copy;
      const hasComposited = !!ad.composited_image_path;
      const imageSrc = hasComposited
        ? storageBaseUrl + '/' + ad.composited_image_path
        : (baseImage ? storageBaseUrl + '/' + baseImage.storage_path : '');

      html += '<div class="ad-card" data-ad-id="' + ad.id + '">';

      // Image area
      if (imageSrc) {
        html += '<div class="ad-card-image">'
          + '<img src="' + escapeHtml(imageSrc) + '" loading="lazy" />';
        // Show caption overlay if no composited image
        if (!hasComposited && caption) {
          html += '<div class="ad-card-caption-overlay">' + escapeHtml(caption.text) + '</div>';
        }
        html += '</div>';
      }

      html += '<div class="ad-card-body">';

      // Caption as quote
      if (caption) {
        html += '<div class="ad-card-caption-text">' + escapeHtml(caption.text) + '</div>';
      }

      // Body copy
      if (bodyCopy) {
        html += '<div class="ad-card-bodycopy">';
        if (bodyCopy.headline) {
          html += '<div class="ad-card-bodycopy-headline">' + escapeHtml(bodyCopy.headline) + '</div>';
        }
        html += '<div class="ad-card-bodycopy-text">' + escapeHtml(bodyCopy.text) + '</div>';
        html += '</div>';
      }

      // Status
      const desiredStatus = ad.desired_status || 'draft';
      html += '<div class="ad-card-status">'
        + '<label>Status</label>'
        + '<select onchange="window.__updateAdStatus(\'' + ad.id + '\', this.value)">'
        + '<option value="draft"' + (desiredStatus === 'draft' ? ' selected' : '') + '>Draft</option>'
        + '<option value="approved"' + (desiredStatus === 'approved' ? ' selected' : '') + '>Approved</option>'
        + '<option value="live"' + (desiredStatus === 'live' ? ' selected' : '') + '>Live</option>'
        + '<option value="paused"' + (desiredStatus === 'paused' ? ' selected' : '') + '>Paused</option>'
        + '</select>';
      if (ad.meta_status) {
        html += ' <span class="status-badge ' + escapeHtml(ad.meta_status) + '">' + escapeHtml(ad.meta_status) + '</span>';
      }
      html += '</div>';

      // Feedback
      html += '<div class="ad-card-feedback">'
        + '<textarea placeholder="Feedback notes..." data-ad-id="' + ad.id + '" data-original="' + escapeHtml(ad.feedback || '') + '"'
        + ' onblur="window.__saveAdFeedback(this)">'
        + escapeHtml(ad.feedback || '')
        + '</textarea>'
        + '</div>';

      // Actions
      html += '<div class="ad-card-actions">';
      if (!hasComposited) {
        html += '<button class="btn-generate" onclick="window.__generateAd(\'' + ad.id + '\', this)">Generate</button>';
      }
      html += '</div>';

      // Delete
      html += '<button class="btn-delete" onclick="window.__deleteAd(\'' + ad.id + '\')" title="Delete ad">&times;</button>';

      html += '</div>'; // ad-card-body
      html += '</div>'; // ad-card
    }
    $adsList.innerHTML = html;
  }

  // --- Global event handlers (called from inline handlers) ---

  window.__deleteCaption = async function(id) {
    if (!confirm('Delete this caption?')) return;
    try {
      await authFetch('/api/captions/' + id, { method: 'DELETE' });
      await loadData();
    } catch (err) {
      console.error('Delete caption failed:', err);
    }
  };

  window.__deleteBodyCopy = async function(id) {
    if (!confirm('Delete this body copy?')) return;
    try {
      await authFetch('/api/body-copy/' + id, { method: 'DELETE' });
      await loadData();
    } catch (err) {
      console.error('Delete body copy failed:', err);
    }
  };

  window.__deleteAd = async function(id) {
    if (!confirm('Delete this ad?')) return;
    try {
      await authFetch('/api/ads/' + id, { method: 'DELETE' });
      await loadData();
    } catch (err) {
      console.error('Delete ad failed:', err);
    }
  };

  window.__updateAdStatus = async function(id, status) {
    try {
      await authFetch('/api/ads/' + id, { method: 'PUT', body: { desired_status: status } });
      await loadData();
    } catch (err) {
      console.error('Update ad status failed:', err);
    }
  };

  window.__saveAdFeedback = async function(textarea) {
    const id = textarea.dataset.adId;
    const original = textarea.dataset.original;
    const current = textarea.value;
    if (current === original) return;
    try {
      await authFetch('/api/ads/' + id, { method: 'PUT', body: { feedback: current } });
      textarea.dataset.original = current;
    } catch (err) {
      console.error('Save feedback failed:', err);
    }
  };

  window.__generateAd = async function(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Generating...';
    try {
      const res = await authFetch('/api/ads/' + id + '/generate', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'Generation failed');
      }
    } catch (err) {
      alert('Generation failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  };

  // --- Drag & Drop: caption onto image ---
  window.__onImageDrop = function(event, cardEl) {
    event.preventDefault();
    cardEl.classList.remove('drop-target');

    const captionId = event.dataTransfer.getData('application/caption-id');
    if (!captionId) return;

    const imageId = cardEl.dataset.imageId;
    if (!imageId) return;

    // Find the image and caption
    const image = STATE.images.find(i => i.id === imageId);
    const caption = STATE.captions.find(c => c.id === captionId);
    if (!image || !caption) return;

    // Store pending and show modal
    pendingAd.imageId = imageId;
    pendingAd.captionId = captionId;
    showCreateAdModal(image, caption);
  };

  function showCreateAdModal(image, caption) {
    const imageSrc = storageBaseUrl + '/' + image.storage_path;
    $modalPreview.innerHTML = '<img src="' + escapeHtml(imageSrc) + '" />'
      + '<div class="modal-preview-caption">' + escapeHtml(caption.text) + '</div>';

    // Populate body copy dropdown
    let options = '<option value="">None</option>';
    for (const bc of STATE.bodyCopy) {
      const label = bc.headline ? bc.headline + ': ' + bc.text.slice(0, 60) : bc.text.slice(0, 80);
      options += '<option value="' + bc.id + '">' + escapeHtml(label) + '</option>';
    }
    $modalBodycopySelect.innerHTML = options;

    show($modalBackdrop);
  }

  $modalCancel.addEventListener('click', () => {
    hide($modalBackdrop);
    pendingAd = { imageId: null, captionId: null };
  });

  $modalBackdrop.addEventListener('click', (e) => {
    if (e.target === $modalBackdrop) {
      hide($modalBackdrop);
      pendingAd = { imageId: null, captionId: null };
    }
  });

  $modalCreate.addEventListener('click', async () => {
    if (!pendingAd.imageId || !pendingAd.captionId) return;

    const body = {
      base_image_id: pendingAd.imageId,
      caption_id: pendingAd.captionId,
    };
    const bcId = $modalBodycopySelect.value;
    if (bcId) body.body_copy_id = bcId;

    $modalCreate.disabled = true;
    $modalCreate.textContent = 'Creating...';

    try {
      await authFetch('/api/ads', { method: 'POST', body });
      hide($modalBackdrop);
      pendingAd = { imageId: null, captionId: null };
      await loadData();
    } catch (err) {
      console.error('Create ad failed:', err);
      alert('Failed to create ad: ' + err.message);
    } finally {
      $modalCreate.disabled = false;
      $modalCreate.textContent = 'Create Ad';
    }
  });

  // --- Start ---
  boot();
})();
</script>
</body>
</html>
