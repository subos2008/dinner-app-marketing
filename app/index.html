<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come Join Us — Ad Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap');

  :root {
    --cream: #FAF6F1;
    --warm-white: #FFF9F3;
    --amber: #C8956C;
    --amber-light: #E8C9A8;
    --amber-dark: #8B5E3C;
    --charcoal: #2C2826;
    --warm-gray: #6B6461;
    --light-gray: #E8E2DC;
    --red: #C4553A;
    --green: #5B8A5E;
    --shadow-sm: 0 1px 3px rgba(44, 40, 38, 0.08);
    --shadow-md: 0 4px 16px rgba(44, 40, 38, 0.1);
    --shadow-lg: 0 8px 32px rgba(44, 40, 38, 0.12);
    --radius: 6px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
    font-weight: 300;
    min-height: 100vh;
  }

  /* --- Top bar --- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--charcoal);
    color: var(--cream);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }

  .topbar-brand {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .topbar-brand span { opacity: 0.5; font-weight: 300; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    opacity: 0.6;
  }

  .topbar-right button {
    background: transparent;
    border: 1px solid rgba(250,246,241,0.25);
    color: var(--cream);
    padding: 4px 12px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 12px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.15s;
  }

  .topbar-right button:hover { opacity: 1; }

  /* --- Main layout --- */
  .main {
    display: grid;
    grid-template-columns: 55% 45%;
    margin-top: 52px;
    height: calc(100vh - 52px);
  }

  .panel-library {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--light-gray);
    overflow: hidden;
  }

  .panel-ads {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--light-gray);
    background: var(--warm-white);
    flex-shrink: 0;
  }

  .tab {
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--warm-gray);
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }

  .tab:hover { color: var(--charcoal); }

  .tab.active {
    color: var(--charcoal);
    font-weight: 600;
    border-bottom-color: var(--amber);
  }

  /* --- Segment filter bar --- */
  .segment-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--warm-white);
    border-bottom: 1px solid var(--light-gray);
    flex-wrap: wrap;
    min-height: 40px;
  }

  .segment-pill {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 400;
    padding: 4px 12px;
    border-radius: 14px;
    border: 1px solid var(--light-gray);
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    position: relative;
  }

  .segment-pill:hover {
    border-color: var(--amber);
    color: var(--amber-dark);
  }

  .segment-pill.active {
    background: var(--charcoal);
    color: var(--cream);
    border-color: var(--charcoal);
    font-weight: 600;
  }

  .segment-pill.drag-over {
    background: var(--amber-light);
    border-color: var(--amber);
    color: var(--amber-dark);
  }

  .segment-pill-add {
    font-size: 14px;
    padding: 2px 10px;
    border: 1px dashed var(--light-gray);
    border-radius: 14px;
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
  }

  .segment-pill-add:hover {
    border-color: var(--amber);
    color: var(--amber-dark);
  }

  .segment-add-input {
    font-family: var(--font-body);
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid var(--amber);
    border-radius: 14px;
    background: #fff;
    color: var(--charcoal);
    outline: none;
    width: 140px;
  }

  .segment-pill-menu {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 4px;
    background: #fff;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    z-index: 50;
    min-width: 100px;
    overflow: hidden;
  }

  .segment-pill-menu button {
    display: block;
    width: 100%;
    padding: 6px 12px;
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--charcoal);
    cursor: pointer;
    text-align: left;
  }

  .segment-pill-menu button:hover {
    background: var(--cream);
  }

  .segment-pill-menu button.danger {
    color: var(--red);
  }

  /* --- Segments management panel --- */
  .segment-manage-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 0;
  }

  .segment-manage-card {
    background: #fff;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    padding: 12px;
  }

  .segment-manage-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .segment-manage-header input[type="text"] {
    flex: 1;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .segment-manage-header input[type="text"]:hover,
  .segment-manage-header input[type="text"]:focus {
    border-color: var(--light-gray);
    background: var(--warm-white);
  }

  .segment-manage-header input[type="text"]:focus {
    border-color: var(--amber);
  }

  .segment-manage-delete {
    background: transparent;
    border: none;
    color: var(--warm-gray);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }

  .segment-manage-delete:hover {
    color: var(--red);
    background: rgba(196, 85, 58, 0.08);
  }

  .segment-manage-hint-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .segment-manage-card textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.4;
    padding: 6px 8px;
    border: 1px solid var(--light-gray);
    border-radius: 4px;
    background: #fff;
    color: var(--charcoal);
    resize: vertical;
    min-height: 40px;
    max-height: 120px;
    outline: none;
    transition: border-color 0.15s;
  }

  .segment-manage-card textarea:focus {
    border-color: var(--amber);
  }

  .segment-manage-add {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .segment-manage-add input {
    flex: 1;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 6px 10px;
    border: 1px dashed var(--light-gray);
    border-radius: var(--radius);
    background: transparent;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s;
  }

  .segment-manage-add input:focus {
    border-color: var(--amber);
    border-style: solid;
  }

  .segment-manage-add input::placeholder {
    color: var(--warm-gray);
  }

  /* --- Generate tab segment hint --- */
  .generate-segment-hint {
    margin-bottom: 12px;
    padding: 8px 10px;
    background: rgba(200, 149, 108, 0.1);
    border-left: 3px solid var(--amber);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 13px;
    color: var(--warm-gray);
    line-height: 1.4;
  }

  .generate-segment-hint strong {
    color: var(--charcoal);
    font-weight: 600;
  }

  .segment-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 10px;
    background: rgba(200, 149, 108, 0.15);
    color: var(--amber-dark);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .segment-chip .remove-seg {
    cursor: pointer;
    opacity: 0.5;
    font-size: 12px;
    line-height: 1;
  }

  .segment-chip .remove-seg:hover {
    opacity: 1;
  }

  /* --- Panel content area --- */
  .tab-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    position: relative;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--light-gray);
    background: var(--warm-white);
    flex-shrink: 0;
  }

  .panel-header h2 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
  }

  .panel-header .count {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--warm-gray);
  }

  .ads-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  /* --- Image grid --- */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .image-card {
    position: relative;
    background: var(--warm-white);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s;
  }

  .image-card:hover { box-shadow: var(--shadow-md); }
  .image-card[draggable] { cursor: grab; }
  .image-card[draggable]:active { cursor: grabbing; }

  .image-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  .image-card-info {
    padding: 8px 10px;
    font-size: 11px;
    color: var(--warm-gray);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .image-card-tags {
    padding: 0 10px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* --- Tag chips --- */
  .tag-chip {
    display: inline-block;
    background: var(--amber-light);
    color: var(--amber-dark);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }

  /* --- Caption strip (below images panel) --- */
  .caption-strip {
    border-top: 1px solid var(--light-gray);
    background: var(--warm-white);
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
  }

  .caption-strip:empty { display: none; }

  .caption-chip {
    background: var(--amber-light);
    color: var(--amber-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 16px;
    white-space: nowrap;
    cursor: grab;
    user-select: none;
    flex-shrink: 0;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: box-shadow 0.15s;
  }

  .caption-chip:active { cursor: grabbing; }
  .caption-chip:hover { box-shadow: var(--shadow-md); }

  /* --- Caption cards --- */
  .caption-card {
    position: relative;
    background: var(--warm-white);
    padding: 14px 40px 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    cursor: grab;
    user-select: none;
    transition: box-shadow 0.15s;
  }

  .caption-card:active { cursor: grabbing; }
  .caption-card:hover { box-shadow: var(--shadow-md); }

  .caption-card-text {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 6px;
  }

  .caption-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .role-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border-radius: 3px;
    line-height: 1.4;
    font-family: var(--font-mono);
  }

  .role-badge.headline { background: #E8D5B7; color: #6B4E2B; }
  .role-badge.subline  { background: #D5E8D5; color: #2B6B3E; }
  .role-badge.cta      { background: #E8D5D5; color: #6B2B2B; }
  .role-badge.tagline  { background: #D5D5E8; color: #2B2B6B; }
  .role-badge.general  { background: var(--light-gray); color: var(--warm-gray); }

  .caption-role-select {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: var(--warm-white);
    font-family: var(--font-body);
  }

  .ad-builder-caption-zones {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .drop-zone.drop-zone-half {
    min-height: 56px;
    flex: 1;
  }

  .drop-zone.filled.caption-zone-filled {
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    padding: 8px;
    gap: 4px;
  }

  .builder-caption-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: var(--cream);
    border-radius: var(--radius);
    font-size: 13px;
    line-height: 1.3;
  }

  .builder-caption-item .btn-clear {
    position: static;
    background: transparent;
    color: var(--warm-gray);
    border: none;
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
  }

  .builder-caption-item .btn-clear:hover { color: var(--red); }

  /* --- Body copy cards --- */
  .bodycopy-card {
    position: relative;
    background: var(--warm-white);
    padding: 14px 40px 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
  }

  .bodycopy-card:hover { box-shadow: var(--shadow-md); }

  .bodycopy-headline {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .bodycopy-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--warm-gray);
    margin-bottom: 6px;
  }

  .bodycopy-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* --- Delete button (cards) --- */
  .btn-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--warm-gray);
    font-size: 16px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    line-height: 1;
    padding: 4px;
  }

  .image-card:hover .btn-delete,
  .caption-card:hover .btn-delete,
  .bodycopy-card:hover .btn-delete,
  .ad-card:hover .btn-delete {
    opacity: 1;
  }

  .btn-delete:hover { color: var(--red); }

  /* --- Add forms --- */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .add-form input,
  .add-form textarea {
    flex: 1;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s;
  }

  .add-form input:focus,
  .add-form textarea:focus {
    border-color: var(--amber);
  }

  .add-form textarea {
    min-height: 60px;
    resize: vertical;
  }

  .add-form button,
  .btn-primary {
    flex-shrink: 0;
    background: var(--amber);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .add-form button:hover,
  .btn-primary:hover {
    background: var(--amber-dark);
  }

  .bodycopy-form {
    flex-direction: column;
  }

  .bodycopy-form-row {
    display: flex;
    gap: 8px;
  }

  /* --- Ad cards --- */
  .ad-card {
    position: relative;
    background: #fff;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s;
  }

  .ad-card:hover { box-shadow: var(--shadow-md); }

  .ad-card-image {
    position: relative;
    width: 100%;
    background: var(--light-gray);
  }

  .ad-card-image img {
    width: 100%;
    display: block;
  }

  .ad-card-caption-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(44, 40, 38, 0.75);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
  }

  .ad-card-body {
    padding: 16px;
  }

  .ad-card-caption-text {
    font-style: italic;
    color: var(--warm-gray);
    font-size: 14px;
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 3px solid var(--amber-light);
  }

  .ad-card-bodycopy {
    margin-bottom: 12px;
  }

  .ad-card-bodycopy-headline {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
  }

  .ad-card-bodycopy-text {
    font-size: 13px;
    color: var(--warm-gray);
    line-height: 1.5;
  }

  .ad-card-status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .ad-card-status label {
    font-size: 12px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .ad-card-status select {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 4px 8px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    cursor: pointer;
  }

  .status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .status-badge.draft { background: var(--light-gray); color: var(--warm-gray); }
  .status-badge.approved { background: #d9ead3; color: var(--green); }
  .status-badge.live { background: #fce8d5; color: var(--amber-dark); }
  .status-badge.paused { background: #f5d5cc; color: var(--red); }

  .ad-card-feedback textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: var(--warm-white);
    color: var(--charcoal);
    resize: vertical;
    min-height: 48px;
    outline: none;
    transition: border-color 0.15s;
  }

  .ad-card-feedback textarea:focus { border-color: var(--amber); }

  .ad-card-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .btn-generate {
    background: var(--charcoal);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-generate:hover { opacity: 0.85; }
  .btn-generate:disabled { opacity: 0.4; cursor: default; }

  /* --- Ad Builder --- */
  .ad-builder {
    border-bottom: 1px solid var(--light-gray);
    background: var(--warm-white);
    padding: 16px 20px;
    flex-shrink: 0;
  }

  .ad-builder-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }

  .ad-builder-zones {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .drop-zone {
    flex: 1;
    min-height: 120px;
    border: 2px dashed var(--light-gray);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--warm-gray);
    font-size: 13px;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .drop-zone.dragover {
    border-color: var(--amber);
    background: rgba(200, 149, 108, 0.08);
  }

  .drop-zone.filled {
    border-style: solid;
    border-color: var(--amber-light);
  }

  .drop-zone.filled img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .drop-zone-caption-text {
    padding: 10px;
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    color: var(--charcoal);
  }

  .drop-zone .btn-clear {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(44, 40, 38, 0.7);
    color: #fff;
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .drop-zone .btn-clear:hover {
    background: var(--red);
  }

  .ad-builder-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .ad-builder-controls select {
    flex: 1;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
  }

  .ad-builder-controls .btn-primary:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* --- Empty state --- */
  .empty-state {
    text-align: center;
    color: var(--warm-gray);
    padding: 48px 24px;
    font-size: 14px;
    line-height: 1.6;
  }

  .empty-state p {
    margin-bottom: 4px;
  }

  /* --- Login screen --- */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: #fff;
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    padding: 40px;
    width: 380px;
    max-width: 100%;
    text-align: center;
  }

  .login-card h1 {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 400;
    margin-bottom: 8px;
  }

  .login-card p {
    color: var(--warm-gray);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .login-card input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }

  .login-card input:focus { border-color: var(--amber); }

  .login-card button {
    width: 100%;
    background: var(--amber);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .login-card button:hover { background: var(--amber-dark); }
  .login-card button:disabled { opacity: 0.5; cursor: default; }

  .login-message {
    margin-top: 14px;
    font-size: 13px;
    color: var(--warm-gray);
  }

  .login-message.error { color: var(--red); }

  /* --- Loading overlay --- */
  .loading-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--warm-gray);
    font-size: 14px;
  }

  /* --- Generate tab --- */
  .generate-section {
    margin-bottom: 20px;
  }

  .generate-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .generate-section-header label {
    font-size: 12px;
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .generate-section-header button {
    background: transparent;
    border: none;
    color: var(--warm-gray);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
  }

  .generate-section-header button:hover {
    color: var(--charcoal);
  }

  .generate-brief textarea {
    width: 100%;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
    padding: 10px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    resize: vertical;
    min-height: 80px;
    max-height: 300px;
    outline: none;
    transition: border-color 0.15s;
  }

  .generate-brief textarea:focus {
    border-color: var(--amber);
  }

  .generate-type-toggle {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
  }

  .generate-type-toggle button {
    flex: 1;
    padding: 8px 16px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--light-gray);
    background: var(--warm-white);
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
  }

  .generate-type-toggle button:first-child {
    border-radius: var(--radius) 0 0 var(--radius);
    border-right: none;
  }

  .generate-type-toggle button:last-child {
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  .generate-type-toggle button.active {
    background: var(--charcoal);
    color: #fff;
    border-color: var(--charcoal);
    font-weight: 600;
  }

  .generate-prompt textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    background: #fff;
    color: var(--charcoal);
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 12px;
  }

  .generate-prompt textarea:focus {
    border-color: var(--amber);
  }

  .generate-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .generate-actions .btn-primary:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .generate-status {
    font-size: 13px;
    color: var(--warm-gray);
    font-style: italic;
  }

  /* --- Prompt group headers --- */
  .prompt-group {
    margin-bottom: 24px;
  }

  .prompt-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--light-gray);
  }

  .prompt-group-text {
    flex: 1;
    font-size: 13px;
    color: var(--warm-gray);
    font-family: var(--font-mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .prompt-group-reuse {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--light-gray);
    color: var(--warm-gray);
    font-size: 13px;
    padding: 2px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }

  .prompt-group-reuse:hover {
    border-color: var(--amber);
    color: var(--amber-dark);
    background: rgba(200, 149, 108, 0.08);
  }

  /* --- Lightbox --- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(44, 40, 38, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
  }

  /* --- Utility --- */
  .hidden { display: none !important; }

  /* Scrollbar styling */
  .tab-content::-webkit-scrollbar,
  .ads-scroll::-webkit-scrollbar,
  .caption-strip::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  .tab-content::-webkit-scrollbar-thumb,
  .ads-scroll::-webkit-scrollbar-thumb {
    background: var(--light-gray);
    border-radius: 3px;
  }
</style>
</head>
<body>

<!-- Loading state -->
<div id="loading" class="loading-overlay">Loading...</div>

<!-- Login screen -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <h1>Come Join Us</h1>
    <p>Ad Manager — sign in to continue</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
      <button type="submit" id="login-btn">Send magic link</button>
    </form>
    <div id="login-message" class="login-message hidden"></div>
  </div>
</div>

<!-- App shell -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-brand">Come Join Us <span>— Ad Manager</span></div>
    <div class="topbar-right">
      <span id="user-email"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </div>

  <div class="main">
    <!-- Left: Library panels -->
    <div class="panel-library">
      <div class="tabs">
        <div class="tab active" data-tab="images">Images</div>
        <div class="tab" data-tab="captions">Captions</div>
        <div class="tab" data-tab="bodycopy">Body Copy</div>
        <div class="tab" data-tab="ads">Ads</div>
        <div class="tab" data-tab="segments">Segments</div>
        <div class="tab" data-tab="generate">Generate</div>
      </div>

      <div class="segment-bar" id="segment-bar"></div>

      <div class="tab-content">
        <div id="panel-images" class="tab-panel active"></div>
        <div id="panel-captions" class="tab-panel"></div>
        <div id="panel-bodycopy" class="tab-panel"></div>
        <div id="panel-ads-tab" class="tab-panel"></div>
        <div id="panel-segments" class="tab-panel"></div>
        <div id="panel-generate" class="tab-panel"></div>
      </div>

      <div id="caption-strip" class="caption-strip"></div>
    </div>

    <!-- Right: Ads panel -->
    <div class="panel-ads">
      <div class="ad-builder" id="ad-builder">
        <div class="ad-builder-label">Ad Builder</div>
        <div class="ad-builder-zones">
          <div class="drop-zone" id="drop-zone-image">
            <span>Drop image here</span>
          </div>
          <div class="ad-builder-caption-zones">
            <div class="drop-zone drop-zone-half" id="drop-zone-headline">
              <span>Headline / Subline</span>
            </div>
            <div class="drop-zone drop-zone-half" id="drop-zone-cta">
              <span>CTA / Tagline</span>
            </div>
          </div>
        </div>
        <div class="ad-builder-controls">
          <select id="builder-bodycopy-select">
            <option value="">Body copy (optional)</option>
          </select>
          <button class="btn-primary" id="builder-create-btn" disabled>Create Ad</button>
        </div>
      </div>
      <div id="ads-list" class="ads-scroll"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  'use strict';

  // --- State ---
  let STATE = { images: [], captions: [], bodyCopy: [], ads: [], adSets: [], tags: [], segments: [] };
  let activeSegment = 'all'; // 'all', 'generic', or a segment UUID
  let storageBaseUrl = '';
  let activeTab = 'images';
  let supabaseClient = null;
  let currentSession = null;
  let appInitialised = false;

  // Ad builder state
  let builderState = { imageId: null, captionIds: [] };

  // --- DOM refs ---
  const $loading = document.getElementById('loading');
  const $loginScreen = document.getElementById('login-screen');
  const $loginForm = document.getElementById('login-form');
  const $loginEmail = document.getElementById('login-email');
  const $loginBtn = document.getElementById('login-btn');
  const $loginMessage = document.getElementById('login-message');
  const $app = document.getElementById('app');
  const $userEmail = document.getElementById('user-email');
  const $signoutBtn = document.getElementById('signout-btn');
  const $panelImages = document.getElementById('panel-images');
  const $panelCaptions = document.getElementById('panel-captions');
  const $panelBodycopy = document.getElementById('panel-bodycopy');
  const $panelGenerate = document.getElementById('panel-generate');
  const $panelAdsTab = document.getElementById('panel-ads-tab');
  const $panelSegments = document.getElementById('panel-segments');
  const $captionStrip = document.getElementById('caption-strip');
  const $adsList = document.getElementById('ads-list');
  const $dropZoneImage = document.getElementById('drop-zone-image');
  const $dropZoneHeadline = document.getElementById('drop-zone-headline');
  const $dropZoneCta = document.getElementById('drop-zone-cta');
  const $builderBodycopy = document.getElementById('builder-bodycopy-select');
  const $builderCreateBtn = document.getElementById('builder-create-btn');

  // --- Utility ---
  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function filterBySegment(items) {
    if (activeSegment === 'all') return items;
    if (activeSegment === 'generic') return items.filter(item => !item.segments || item.segments.length === 0);
    return items.filter(item => (item.segments || []).some(s => s.id === activeSegment));
  }

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  // --- Auth helpers ---
  function getToken() {
    if (currentSession && currentSession.access_token) return currentSession.access_token;
    return null;
  }

  async function authFetch(url, opts = {}) {
    const token = getToken();
    if (!token) throw new Error('Not authenticated');
    const headers = { ...opts.headers, 'Authorization': 'Bearer ' + token };
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, { ...opts, headers });
    if (res.status === 401) {
      // Session expired
      handleSignout();
      throw new Error('Session expired');
    }
    return res;
  }

  // --- Boot sequence ---
  async function boot() {
    try {
      // 1. Fetch config
      const config = await fetch('/api/config').then(r => r.json());
      storageBaseUrl = config.storageBaseUrl;

      // 2. Init Supabase
      supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

      // 3. Listen for auth changes (sign-in + token refresh) — must be registered
      //    before getSession so we always catch TOKEN_REFRESHED events
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentSession = session;
        }
        if (event === 'SIGNED_IN' && session) {
          showApp(session.user);
        }
        if (event === 'SIGNED_OUT') {
          currentSession = null;
          showLogin();
        }
      });

      // 4. Check existing session
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentSession = session;
        showApp(session.user);
      } else {
        showLogin();
      }
    } catch (err) {
      console.error('Boot failed:', err);
      $loading.textContent = 'Failed to load. Check server is running.';
    }
  }

  function showLogin() {
    hide($loading);
    hide($app);
    show($loginScreen);
  }

  function showApp(user) {
    hide($loading);
    hide($loginScreen);
    show($app);
    $userEmail.textContent = user.email || '';
    if (!appInitialised) {
      appInitialised = true;
      init();
    }
  }

  async function init() {
    await loadData();
    connectSSE();
    setupTabs();
  }

  // --- Login form ---
  $loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $loginEmail.value.trim();
    if (!email) return;

    $loginBtn.disabled = true;
    $loginBtn.textContent = 'Sending...';
    hide($loginMessage);

    try {
      const { error } = await supabaseClient.auth.signInWithOtp({ email });
      if (error) throw error;
      $loginMessage.textContent = 'Check your email for the magic link.';
      $loginMessage.className = 'login-message';
      show($loginMessage);
    } catch (err) {
      $loginMessage.textContent = err.message || 'Failed to send magic link.';
      $loginMessage.className = 'login-message error';
      show($loginMessage);
    } finally {
      $loginBtn.disabled = false;
      $loginBtn.textContent = 'Send magic link';
    }
  });

  // --- Sign out ---
  $signoutBtn.addEventListener('click', handleSignout);

  async function handleSignout() {
    try { await supabaseClient.auth.signOut(); } catch (e) {}
    currentSession = null;
    appInitialised = false;
    localStorage.removeItem('sb-session');
    showLogin();
  }

  // --- Data loading ---
  async function loadData() {
    try {
      const [images, captions, bodyCopy, ads, adSets, tags, segments] = await Promise.all([
        authFetch('/api/images').then(r => r.json()),
        authFetch('/api/captions').then(r => r.json()),
        authFetch('/api/body-copy').then(r => r.json()),
        authFetch('/api/ads').then(r => r.json()),
        authFetch('/api/ad-sets').then(r => r.json()),
        authFetch('/api/tags').then(r => r.json()),
        authFetch('/api/segments').then(r => r.json()),
      ]);
      STATE = { images, captions, bodyCopy, ads, adSets, tags, segments };
      render();
    } catch (err) {
      console.error('loadData failed:', err);
    }
  }

  // --- SSE ---
  let sseRetryDelay = 1000;
  function connectSSE() {
    const token = getToken();
    if (!token) return;
    const es = new EventSource('/api/events?token=' + encodeURIComponent(token));
    es.onmessage = async (e) => {
      if (e.data === 'reload') await loadData();
    };
    es.onopen = () => { sseRetryDelay = 1000; };
    es.onerror = () => {
      es.close();
      setTimeout(connectSSE, sseRetryDelay);
      sseRetryDelay = Math.min(sseRetryDelay * 2, 30000);
    };
  }

  // --- Tabs ---
  function setupTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        switchToTab(tab.dataset.tab);
      });
    });
  }

  // --- Render (called after data loads) ---
  function render() {
    renderSegmentBar();
    renderImages();
    renderCaptions();
    renderBodyCopy();
    renderCaptionStrip();
    renderGenerate();
    renderGenerateHint();
    renderSegmentsPanel();
    renderBuilder();
    renderAds();
  }

  // --- Segment bar ---
  function renderSegmentBar() {
    const $bar = document.getElementById('segment-bar');
    let html = '<button class="segment-pill' + (activeSegment === 'all' ? ' active' : '') + '" data-segment="all">All</button>';
    html += '<button class="segment-pill' + (activeSegment === 'generic' ? ' active' : '') + '" data-segment="generic">Generic</button>';

    for (const seg of STATE.segments) {
      html += '<button class="segment-pill' + (activeSegment === seg.id ? ' active' : '') + '" data-segment="' + seg.id + '" data-segment-name="' + escapeHtml(seg.name) + '">'
        + escapeHtml(seg.name)
        + '</button>';
    }

    html += '<button class="segment-pill-add" id="segment-add-btn" title="Add segment">+</button>';
    $bar.innerHTML = html;

    // Click handlers for pills
    $bar.querySelectorAll('.segment-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        activeSegment = pill.dataset.segment;
        render();
      });

      // Right-click context menu for real segments (not All/Generic)
      if (pill.dataset.segment !== 'all' && pill.dataset.segment !== 'generic') {
        pill.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          showSegmentMenu(pill, pill.dataset.segment, pill.dataset.segmentName);
        });

        // Drop target for assigning items to segments
        pill.addEventListener('dragover', (e) => {
          e.preventDefault();
          pill.classList.add('drag-over');
        });
        pill.addEventListener('dragleave', () => {
          pill.classList.remove('drag-over');
        });
        pill.addEventListener('drop', async (e) => {
          e.preventDefault();
          pill.classList.remove('drag-over');
          const segmentId = pill.dataset.segment;
          const imageId = e.dataTransfer.getData('application/image-id');
          const captionId = e.dataTransfer.getData('application/caption-id');
          const bodyCopyId = e.dataTransfer.getData('application/bodycopy-id');
          const adId = e.dataTransfer.getData('application/ad-id');
          try {
            if (imageId) await authFetch('/api/images/' + imageId + '/segments', { method: 'POST', body: { segment_id: segmentId } });
            if (captionId) await authFetch('/api/captions/' + captionId + '/segments', { method: 'POST', body: { segment_id: segmentId } });
            if (bodyCopyId) await authFetch('/api/body-copy/' + bodyCopyId + '/segments', { method: 'POST', body: { segment_id: segmentId } });
            if (adId) await authFetch('/api/ads/' + adId + '/segments', { method: 'POST', body: { segment_id: segmentId } });
            await loadData();
          } catch (err) {
            console.error('Assign segment failed:', err);
          }
        });
      }
    });

    // Add button
    document.getElementById('segment-add-btn').addEventListener('click', () => {
      const btn = document.getElementById('segment-add-btn');
      const input = document.createElement('input');
      input.className = 'segment-add-input';
      input.placeholder = 'Segment name...';
      btn.replaceWith(input);
      input.focus();

      async function submit() {
        const name = input.value.trim();
        if (name) {
          try {
            await authFetch('/api/segments', { method: 'POST', body: { name } });
            await loadData();
          } catch (err) {
            console.error('Create segment failed:', err);
          }
        } else {
          renderSegmentBar();
        }
      }
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submit();
        if (e.key === 'Escape') renderSegmentBar();
      });
      input.addEventListener('blur', submit);
    });
  }

  function showSegmentMenu(pill, segmentId, segmentName) {
    // Close any existing menu
    document.querySelectorAll('.segment-pill-menu').forEach(m => m.remove());

    const menu = document.createElement('div');
    menu.className = 'segment-pill-menu';
    menu.innerHTML = '<button data-action="rename">Rename</button>'
      + '<button data-action="delete" class="danger">Delete</button>';
    pill.style.position = 'relative';
    pill.appendChild(menu);

    menu.querySelector('[data-action="rename"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      menu.remove();
      const newName = prompt('Rename segment:', segmentName);
      if (newName && newName.trim() && newName.trim() !== segmentName) {
        try {
          await authFetch('/api/segments/' + segmentId, { method: 'PUT', body: { name: newName.trim() } });
          await loadData();
        } catch (err) {
          console.error('Rename segment failed:', err);
        }
      }
    });

    menu.querySelector('[data-action="delete"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      menu.remove();
      if (confirm('Delete segment "' + segmentName + '"? Items won\'t be deleted, just unassigned.')) {
        try {
          if (activeSegment === segmentId) activeSegment = 'all';
          await authFetch('/api/segments/' + segmentId, { method: 'DELETE' });
          await loadData();
        } catch (err) {
          console.error('Delete segment failed:', err);
        }
      }
    });

    // Close on click outside
    setTimeout(() => {
      document.addEventListener('click', function closeMenu(e) {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeMenu);
        }
      });
    }, 0);
  }

  // --- Images panel ---
  function renderImages() {
    const filtered = filterBySegment(STATE.images);
    if (filtered.length === 0) {
      $panelImages.innerHTML = '<div class="empty-state"><p>No images yet.</p><p>Upload images via the CLI or API.</p></div>';
      return;
    }

    // Group images by generation_prompt_id
    const groups = new Map(); // promptId -> { prompt, images }
    const ungrouped = [];
    for (const img of filtered) {
      const gp = img.generation_prompt;
      if (gp && gp.id) {
        if (!groups.has(gp.id)) {
          groups.set(gp.id, { prompt: gp, images: [] });
        }
        groups.get(gp.id).images.push(img);
      } else {
        ungrouped.push(img);
      }
    }

    let html = '';

    function renderImageGrid(images) {
      let g = '<div class="image-grid">';
      for (const img of images) {
        const src = storageBaseUrl + '/' + img.storage_path;
        const tagsHtml = (img.tags || []).map(t => '<span class="tag-chip">' + escapeHtml(t.name) + '</span>').join('');
        const segHtml = (img.segments || []).map(s =>
          '<span class="segment-chip">' + escapeHtml(s.name)
          + ' <span class="remove-seg" onclick="window.__removeImageSegment(\'' + img.id + '\', \'' + s.id + '\')">&times;</span>'
          + '</span>'
        ).join('');
        g += '<div class="image-card" draggable="true" data-image-id="' + img.id + '">'
          + '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(img.filename) + '" loading="lazy" onclick="window.__openLightbox(this.src, event)" style="cursor:zoom-in" />'
          + '<div class="image-card-info">' + escapeHtml(img.filename) + '</div>'
          + (tagsHtml || segHtml ? '<div class="image-card-tags">' + tagsHtml + segHtml + '</div>' : '')
          + '<button class="btn-delete" onclick="window.__deleteImage(\'' + img.id + '\')" title="Delete">&times;</button>'
          + '</div>';
      }
      g += '</div>';
      return g;
    }

    // Render grouped
    for (const [promptId, group] of groups) {
      html += '<div class="prompt-group">'
        + '<div class="prompt-group-header">'
        + '<span class="prompt-group-text" title="' + escapeHtml(group.prompt.prompt) + '">' + escapeHtml(group.prompt.prompt) + '</span>'
        + '<button class="prompt-group-reuse" data-prompt-text="' + escapeHtml(group.prompt.prompt) + '" data-prompt-type="' + escapeHtml(group.prompt.type) + '" title="Re-use this prompt">&#8635;</button>'
        + '</div>'
        + renderImageGrid(group.images)
        + '</div>';
    }

    // Render ungrouped
    if (ungrouped.length > 0) {
      html += '<div class="prompt-group">';
      if (groups.size > 0) {
        html += '<div class="prompt-group-header"><span class="prompt-group-text">Ungrouped</span></div>';
      }
      html += renderImageGrid(ungrouped) + '</div>';
    }

    $panelImages.innerHTML = html;

    // Attach drag handlers to image cards
    $panelImages.querySelectorAll('.image-card[draggable]').forEach(card => {
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('application/image-id', card.dataset.imageId);
        e.dataTransfer.effectAllowed = 'copy';
      });
    });

    // Attach re-use handlers
    $panelImages.querySelectorAll('.prompt-group-reuse').forEach(btn => {
      btn.addEventListener('click', () => {
        reusePrompt(btn.dataset.promptText, btn.dataset.promptType);
      });
    });
  }

  // --- Generate panel ---
  let generateBriefLoaded = false;
  let generateType = 'image';
  let generateBriefVisible = true;

  function renderGenerate() {
    // Only render the static shell once; subsequent calls skip
    if ($panelGenerate.querySelector('.generate-section')) return;

    const briefFromStorage = localStorage.getItem('generate-brief') || '';

    let html = '';

    // Creative brief section
    html += '<div class="generate-section generate-brief">'
      + '<div class="generate-section-header">'
      + '<label>Creative Brief</label>'
      + '<button id="generate-brief-toggle">hide</button>'
      + '</div>'
      + '<textarea id="generate-brief-text" placeholder="Loading creative brief...">' + escapeHtml(briefFromStorage) + '</textarea>'
      + '</div>';

    // Type toggle
    html += '<div class="generate-type-toggle">'
      + '<button class="active" data-gen-type="image">Image</button>'
      + '<button data-gen-type="caption">Caption</button>'
      + '</div>';

    // Prompt
    const promptFromStorage = localStorage.getItem('generate-prompt-' + generateType) || '';
    html += '<div class="generate-prompt">'
      + '<textarea id="generate-prompt-text" placeholder="Describe what you want...">' + escapeHtml(promptFromStorage) + '</textarea>'
      + '</div>';

    // Actions
    html += '<div class="generate-actions">'
      + '<button class="btn-primary" id="generate-btn" disabled>Generate</button>'
      + '<span class="generate-status" id="generate-status"></span>'
      + '</div>';

    $panelGenerate.innerHTML = html;

    // Wire up events
    const $brief = document.getElementById('generate-brief-text');
    const $briefToggle = document.getElementById('generate-brief-toggle');
    const $prompt = document.getElementById('generate-prompt-text');
    const $genBtn = document.getElementById('generate-btn');
    const $genStatus = document.getElementById('generate-status');

    // Load brief from server if not in localStorage
    if (!briefFromStorage && !generateBriefLoaded) {
      generateBriefLoaded = true;
      authFetch('/api/creative-brief').then(r => r.json()).then(data => {
        if (data.text && !$brief.value) {
          $brief.value = data.text;
          localStorage.setItem('generate-brief', data.text);
        }
      }).catch(() => {});
    }

    // Save brief to localStorage on edit
    $brief.addEventListener('input', () => {
      localStorage.setItem('generate-brief', $brief.value);
    });

    // Toggle brief visibility
    $briefToggle.addEventListener('click', () => {
      generateBriefVisible = !generateBriefVisible;
      $brief.style.display = generateBriefVisible ? '' : 'none';
      $briefToggle.textContent = generateBriefVisible ? 'hide' : 'show';
    });

    // Type toggle
    $panelGenerate.querySelectorAll('.generate-type-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        // Save current prompt before switching
        localStorage.setItem('generate-prompt-' + generateType, $prompt.value);
        generateType = btn.dataset.genType;
        $panelGenerate.querySelectorAll('.generate-type-toggle button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Restore prompt for new type
        $prompt.value = localStorage.getItem('generate-prompt-' + generateType) || '';
        updateGenBtn();
      });
    });

    // Prompt input — enable/disable generate button + persist
    function updateGenBtn() {
      $genBtn.disabled = !$prompt.value.trim();
    }
    $prompt.addEventListener('input', () => {
      localStorage.setItem('generate-prompt-' + generateType, $prompt.value);
      updateGenBtn();
    });
    updateGenBtn();

    // Generate button
    $genBtn.addEventListener('click', async () => {
      const prompt = $prompt.value.trim();
      if (!prompt) return;

      $genBtn.disabled = true;
      $genStatus.textContent = generateType === 'image'
        ? 'Generating image... this may take a minute'
        : 'Generating captions...';

      try {
        // Include segment prompt hint if a segment is active
        let segmentHint = '';
        if (activeSegment && activeSegment !== 'all' && activeSegment !== 'generic') {
          const seg = STATE.segments.find(s => s.id === activeSegment);
          if (seg && seg.prompt_hint) segmentHint = seg.prompt_hint;
        }
        const body = {
          type: generateType,
          brief: $brief.value || '',
          prompt,
          segment_hint: segmentHint || undefined
        };
        const res = await authFetch('/api/generate', { method: 'POST', body });
        const data = await res.json();

        if (!res.ok) {
          $genStatus.textContent = 'Error: ' + (data.error || 'Generation failed');
          return;
        }

        $genStatus.textContent = '';

        // Auto-assign active segment to generated items
        if (activeSegment && activeSegment !== 'all' && activeSegment !== 'generic') {
          if (data.image) {
            await authFetch('/api/images/' + data.image.id + '/segments', { method: 'POST', body: { segment_id: activeSegment } }).catch(() => {});
          }
          if (data.captions) {
            for (const cap of data.captions) {
              await authFetch('/api/captions/' + cap.id + '/segments', { method: 'POST', body: { segment_id: activeSegment } }).catch(() => {});
            }
          }
        }

        // Reload data then switch to the appropriate tab
        await loadData();
        const targetTab = generateType === 'image' ? 'images' : 'captions';
        switchToTab(targetTab);

      } catch (err) {
        $genStatus.textContent = 'Error: ' + err.message;
      } finally {
        $genBtn.disabled = false;
        updateGenBtn();
      }
    });
  }

  // --- Segments management panel ---
  function renderSegmentsPanel() {
    let html = '<div class="segment-manage-list">';
    for (const seg of STATE.segments) {
      html += '<div class="segment-manage-card" data-seg-id="' + seg.id + '">'
        + '<div class="segment-manage-header">'
        + '<input type="text" class="seg-name-input" value="' + escapeHtml(seg.name) + '" data-original="' + escapeHtml(seg.name) + '">'
        + '<button class="segment-manage-delete" title="Delete segment">&times;</button>'
        + '</div>'
        + '<div class="segment-manage-hint-label">Prompt hint</div>'
        + '<textarea class="seg-hint-input" placeholder="e.g. &quot;they often have laptop bags/backpacks with them&quot;">' + escapeHtml(seg.prompt_hint || '') + '</textarea>'
        + '</div>';
    }
    html += '<div class="segment-manage-add">'
      + '<input type="text" class="seg-add-input" placeholder="+ Add new segment...">'
      + '</div>';
    html += '</div>';
    $panelSegments.innerHTML = html;

    // Name editing — save on blur/enter
    $panelSegments.querySelectorAll('.seg-name-input').forEach(input => {
      const card = input.closest('.segment-manage-card');
      const segId = card.dataset.segId;

      async function saveName() {
        const newName = input.value.trim();
        const original = input.dataset.original;
        if (!newName || newName === original) {
          input.value = original;
          return;
        }
        try {
          await authFetch('/api/segments/' + segId, { method: 'PUT', body: { name: newName } });
          input.dataset.original = newName;
          await loadData();
        } catch (err) {
          console.error('Rename segment failed:', err);
          input.value = original;
        }
      }
      input.addEventListener('blur', saveName);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = input.dataset.original; input.blur(); }
      });
    });

    // Hint editing — save on blur/enter
    $panelSegments.querySelectorAll('.seg-hint-input').forEach(textarea => {
      const card = textarea.closest('.segment-manage-card');
      const segId = card.dataset.segId;
      const seg = STATE.segments.find(s => s.id === segId);
      let lastSaved = seg ? seg.prompt_hint || '' : '';

      async function saveHint() {
        const newHint = textarea.value.trim();
        if (newHint === lastSaved) return;
        try {
          await authFetch('/api/segments/' + segId, { method: 'PUT', body: { prompt_hint: newHint } });
          lastSaved = newHint;
          await loadData();
        } catch (err) {
          console.error('Update prompt hint failed:', err);
          textarea.value = lastSaved;
        }
      }
      textarea.addEventListener('blur', saveHint);
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textarea.blur(); }
        if (e.key === 'Escape') { textarea.value = lastSaved; textarea.blur(); }
      });
    });

    // Delete buttons
    $panelSegments.querySelectorAll('.segment-manage-delete').forEach(btn => {
      const card = btn.closest('.segment-manage-card');
      const segId = card.dataset.segId;
      const seg = STATE.segments.find(s => s.id === segId);
      btn.addEventListener('click', async () => {
        if (!confirm('Delete segment "' + (seg ? seg.name : '') + '"? Items won\'t be deleted, just unassigned.')) return;
        try {
          if (activeSegment === segId) activeSegment = 'all';
          await authFetch('/api/segments/' + segId, { method: 'DELETE' });
          await loadData();
        } catch (err) {
          console.error('Delete segment failed:', err);
        }
      });
    });

    // Add new segment
    const addInput = $panelSegments.querySelector('.seg-add-input');
    async function addSegment() {
      const name = addInput.value.trim();
      if (!name) return;
      try {
        await authFetch('/api/segments', { method: 'POST', body: { name } });
        await loadData();
      } catch (err) {
        console.error('Create segment failed:', err);
      }
    }
    addInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addSegment();
      if (e.key === 'Escape') { addInput.value = ''; addInput.blur(); }
    });
  }

  // --- Generate tab hint display ---
  function renderGenerateHint() {
    // Remove existing hint element if present
    const existing = document.getElementById('generate-segment-hint');
    if (existing) existing.remove();

    // Only show if a real segment is active and has a hint
    if (!activeSegment || activeSegment === 'all' || activeSegment === 'generic') return;
    const seg = STATE.segments.find(s => s.id === activeSegment);
    if (!seg || !seg.prompt_hint) return;

    const hintEl = document.createElement('div');
    hintEl.id = 'generate-segment-hint';
    hintEl.className = 'generate-segment-hint';
    hintEl.innerHTML = '<strong>Segment hint:</strong> ' + escapeHtml(seg.prompt_hint);

    // Insert after the type toggle (before the prompt textarea)
    const typeToggle = $panelGenerate.querySelector('.generate-type-toggle');
    if (typeToggle) {
      typeToggle.insertAdjacentElement('afterend', hintEl);
    }
  }

  function switchToTab(tabName) {
    activeTab = tabName;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const panelId = tabName === 'ads' ? 'panel-ads-tab' : 'panel-' + tabName;
    const panel = document.getElementById(panelId);
    if (panel) panel.classList.add('active');
  }

  function reusePrompt(text, type) {
    switchToTab('generate');
    // Set prompt text
    const $prompt = document.getElementById('generate-prompt-text');
    if ($prompt) {
      $prompt.value = text;
      localStorage.setItem('generate-prompt-' + (type || generateType), text);
    }
    // Set type toggle
    if (type === 'image' || type === 'caption') {
      generateType = type;
      $panelGenerate.querySelectorAll('.generate-type-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.genType === type);
      });
    }
    // Enable generate button
    const $genBtn = document.getElementById('generate-btn');
    if ($genBtn) $genBtn.disabled = !text;
    // Focus the prompt field
    if ($prompt) $prompt.focus();
  }

  // --- Ads ---
  function renderAdCard(ad) {
    const baseImage = ad.base_image;
    const captions = ad.captions || [];
    const bodyCopy = ad.body_copy;
    const hasComposited = !!ad.composited_image_path;
    const imageSrc = hasComposited
      ? storageBaseUrl + '/' + ad.composited_image_path
      : (baseImage ? storageBaseUrl + '/' + baseImage.storage_path : '');

    let html = '<div class="ad-card" data-ad-id="' + ad.id + '">';

    // Image area
    if (imageSrc) {
      html += '<div class="ad-card-image">'
        + '<img src="' + escapeHtml(imageSrc) + '" loading="lazy" />';
      if (!hasComposited && captions.length > 0) {
        // Show headline caption as overlay, or first caption
        const overlayCaption = captions.find(c => c.role === 'headline') || captions[0];
        html += '<div class="ad-card-caption-overlay">' + escapeHtml(overlayCaption.text) + '</div>';
      }
      html += '</div>';
    }

    html += '<div class="ad-card-body">';

    if (captions.length > 0) {
      for (const cap of captions) {
        const badge = cap.role
          ? '<span class="role-badge ' + escapeHtml(cap.role) + '">' + escapeHtml(cap.role) + '</span> '
          : '';
        html += '<div class="ad-card-caption-text">' + badge + escapeHtml(cap.text) + '</div>';
      }
    }

    if (bodyCopy) {
      html += '<div class="ad-card-bodycopy">';
      if (bodyCopy.headline) {
        html += '<div class="ad-card-bodycopy-headline">' + escapeHtml(bodyCopy.headline) + '</div>';
      }
      html += '<div class="ad-card-bodycopy-text">' + escapeHtml(bodyCopy.text) + '</div>';
      html += '</div>';
    }

    const desiredStatus = ad.desired_status || 'draft';
    html += '<div class="ad-card-status">'
      + '<label>Status</label>'
      + '<select onchange="window.__updateAdStatus(\'' + ad.id + '\', this.value)">'
      + '<option value="draft"' + (desiredStatus === 'draft' ? ' selected' : '') + '>Draft</option>'
      + '<option value="approved"' + (desiredStatus === 'approved' ? ' selected' : '') + '>Approved</option>'
      + '<option value="live"' + (desiredStatus === 'live' ? ' selected' : '') + '>Live</option>'
      + '<option value="paused"' + (desiredStatus === 'paused' ? ' selected' : '') + '>Paused</option>'
      + '</select>';
    if (ad.meta_status) {
      html += ' <span class="status-badge ' + escapeHtml(ad.meta_status) + '">' + escapeHtml(ad.meta_status) + '</span>';
    }
    html += '</div>';

    const adSegHtml = (ad.segments || []).map(s =>
      '<span class="segment-chip">' + escapeHtml(s.name)
      + ' <span class="remove-seg" onclick="window.__removeAdSegment(\'' + ad.id + '\', \'' + s.id + '\')">&times;</span>'
      + '</span>'
    ).join('');
    if (adSegHtml) {
      html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">' + adSegHtml + '</div>';
    }

    html += '<div class="ad-card-feedback">'
      + '<textarea placeholder="Feedback notes..." data-ad-id="' + ad.id + '" data-original="' + escapeHtml(ad.feedback || '') + '"'
      + ' onblur="window.__saveAdFeedback(this)">'
      + escapeHtml(ad.feedback || '')
      + '</textarea>'
      + '</div>';

    html += '<div class="ad-card-actions">';
    if (!hasComposited) {
      html += '<button class="btn-generate" onclick="window.__generateAd(\'' + ad.id + '\', this)">Generate</button>';
    }
    html += '</div>';

    html += '<button class="btn-delete" onclick="window.__deleteAd(\'' + ad.id + '\')" title="Delete ad">&times;</button>';

    html += '</div>'; // ad-card-body
    html += '</div>'; // ad-card
    return html;
  }

  function renderAds() {
    const filtered = filterBySegment(STATE.ads);
    // Ads tab — full list
    if (filtered.length === 0) {
      $panelAdsTab.innerHTML = '<div class="empty-state"><p>No ads yet.</p><p>Drop an image and captions into the builder to create one.</p></div>';
    } else {
      const count = filtered.length + ' ad' + (filtered.length !== 1 ? 's' : '');
      let html = '<div style="margin-bottom:12px;font-family:var(--font-mono);font-size:12px;color:var(--warm-gray)">' + count + '</div>';
      for (const ad of filtered) {
        html += renderAdCard(ad);
      }
      $panelAdsTab.innerHTML = html;
    }

    // Right panel — always show most recent ad (unfiltered)
    if (STATE.ads.length === 0) {
      $adsList.innerHTML = '<div class="empty-state"><p>No ads yet.</p></div>';
    } else {
      $adsList.innerHTML = renderAdCard(STATE.ads[0]);
    }

    // Attach drag handlers to ad cards
    const adContainers = [$panelAdsTab, $adsList];
    adContainers.forEach(container => {
      container.querySelectorAll('.ad-card[data-ad-id]').forEach(card => {
        card.setAttribute('draggable', 'true');
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('application/ad-id', card.dataset.adId);
          e.dataTransfer.effectAllowed = 'copy';
        });
      });
    });
  }

  // --- Global event handlers (called from inline handlers) ---

  window.__openLightbox = function(src, e) {
    e.stopPropagation();
    e.preventDefault();
    const overlay = document.createElement('div');
    overlay.className = 'lightbox';
    overlay.innerHTML = '<img src="' + src + '" />';
    overlay.addEventListener('click', () => overlay.remove());
    const onKey = (ev) => {
      if (ev.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', onKey); }
    };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  };

  window.__deleteImage = async function(id) {
    if (!confirm('Delete this image?')) return;
    try {
      const res = await authFetch('/api/images/' + id, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || 'Failed to delete image');
        return;
      }
      await loadData();
    } catch (err) {
      console.error('Delete image failed:', err);
    }
  };

  window.__deleteCaption = async function(id) {
    if (!confirm('Delete this caption?')) return;
    try {
      await authFetch('/api/captions/' + id, { method: 'DELETE' });
      await loadData();
    } catch (err) {
      console.error('Delete caption failed:', err);
    }
  };

  window.__deleteBodyCopy = async function(id) {
    if (!confirm('Delete this body copy?')) return;
    try {
      await authFetch('/api/body-copy/' + id, { method: 'DELETE' });
      await loadData();
    } catch (err) {
      console.error('Delete body copy failed:', err);
    }
  };

  window.__deleteAd = async function(id) {
    if (!confirm('Delete this ad?')) return;
    try {
      await authFetch('/api/ads/' + id, { method: 'DELETE' });
      await loadData();
    } catch (err) {
      console.error('Delete ad failed:', err);
    }
  };

  window.__updateAdStatus = async function(id, status) {
    try {
      await authFetch('/api/ads/' + id, { method: 'PUT', body: { desired_status: status } });
      await loadData();
    } catch (err) {
      console.error('Update ad status failed:', err);
    }
  };

  window.__saveAdFeedback = async function(textarea) {
    const id = textarea.dataset.adId;
    const original = textarea.dataset.original;
    const current = textarea.value;
    if (current === original) return;
    try {
      await authFetch('/api/ads/' + id, { method: 'PUT', body: { feedback: current } });
      textarea.dataset.original = current;
    } catch (err) {
      console.error('Save feedback failed:', err);
    }
  };

  window.__generateAd = async function(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Generating...';
    try {
      const res = await authFetch('/api/ads/' + id + '/generate', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'Generation failed');
      }
    } catch (err) {
      alert('Generation failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  };

  window.__removeImageSegment = async function(imageId, segmentId) {
    try {
      await authFetch('/api/images/' + imageId + '/segments/' + segmentId, { method: 'DELETE' });
      await loadData();
    } catch (err) { console.error('Remove image segment failed:', err); }
  };

  window.__removeCaptionSegment = async function(captionId, segmentId) {
    try {
      await authFetch('/api/captions/' + captionId + '/segments/' + segmentId, { method: 'DELETE' });
      await loadData();
    } catch (err) { console.error('Remove caption segment failed:', err); }
  };

  window.__removeBodyCopySegment = async function(bodyId, segmentId) {
    try {
      await authFetch('/api/body-copy/' + bodyId + '/segments/' + segmentId, { method: 'DELETE' });
      await loadData();
    } catch (err) { console.error('Remove body copy segment failed:', err); }
  };

  window.__removeAdSegment = async function(adId, segmentId) {
    try {
      await authFetch('/api/ads/' + adId + '/segments/' + segmentId, { method: 'DELETE' });
      await loadData();
    } catch (err) { console.error('Remove ad segment failed:', err); }
  };

  // --- Ad Builder ---
  function renderBuilder() {
    // Image drop zone
    const image = builderState.imageId ? STATE.images.find(i => i.id === builderState.imageId) : null;
    if (image) {
      const src = storageBaseUrl + '/' + image.storage_path;
      $dropZoneImage.innerHTML = '<img src="' + escapeHtml(src) + '" />'
        + '<button class="btn-clear" onclick="window.__clearBuilderImage()">&times;</button>';
      $dropZoneImage.classList.add('filled');
    } else {
      $dropZoneImage.innerHTML = '<span>Drop image here</span>';
      $dropZoneImage.classList.remove('filled');
    }

    // Caption drop zones — headline/subline and cta/tagline
    function renderCaptionZone($zone, roles, emptyLabel) {
      const items = builderState.captionIds
        .map(cid => STATE.captions.find(c => c.id === cid))
        .filter(cap => cap && roles.includes(cap.role || ''));
      if (items.length > 0) {
        let html = '';
        for (const cap of items) {
          const badge = cap.role
            ? '<span class="role-badge ' + escapeHtml(cap.role) + '">' + escapeHtml(cap.role) + '</span> '
            : '';
          html += '<div class="builder-caption-item">'
            + badge + escapeHtml(cap.text)
            + '<button class="btn-clear" onclick="window.__removeBuilderCaption(\'' + cap.id + '\')">&times;</button>'
            + '</div>';
        }
        $zone.innerHTML = html;
        $zone.classList.add('filled', 'caption-zone-filled');
      } else {
        $zone.innerHTML = '<span>' + emptyLabel + '</span>';
        $zone.classList.remove('filled', 'caption-zone-filled');
      }
    }
    renderCaptionZone($dropZoneHeadline, ['headline', 'subline', ''], 'Headline / Subline');
    renderCaptionZone($dropZoneCta, ['cta', 'tagline'], 'CTA / Tagline');

    // Body copy dropdown
    let options = '<option value="">Body copy (optional)</option>';
    for (const bc of STATE.bodyCopy) {
      const label = bc.headline ? bc.headline + ': ' + bc.text.slice(0, 60) : bc.text.slice(0, 80);
      options += '<option value="' + bc.id + '">' + escapeHtml(label) + '</option>';
    }
    $builderBodycopy.innerHTML = options;

    // Enable create button only if image is set
    $builderCreateBtn.disabled = !builderState.imageId;
  }

  window.__clearBuilderImage = function() {
    builderState.imageId = null;
    renderBuilder();
  };

  window.__clearBuilderCaption = function() {
    builderState.captionIds = [];
    renderBuilder();
  };

  window.__removeBuilderCaption = function(captionId) {
    builderState.captionIds = builderState.captionIds.filter(id => id !== captionId);
    renderBuilder();
  };

  // Drop zone handlers
  function setupDropZone(el, dataType, onDrop) {
    el.addEventListener('dragover', (e) => {
      if (e.dataTransfer.types.includes(dataType)) {
        e.preventDefault();
        el.classList.add('dragover');
      }
    });
    el.addEventListener('dragleave', () => {
      el.classList.remove('dragover');
    });
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      el.classList.remove('dragover');
      const id = e.dataTransfer.getData(dataType);
      if (id) onDrop(id);
    });
  }

  setupDropZone($dropZoneImage, 'application/image-id', (id) => {
    builderState.imageId = id;
    renderBuilder();
  });

  function onCaptionDrop(id) {
    if (!builderState.captionIds.includes(id)) {
      builderState.captionIds.push(id);
    }
    renderBuilder();
  }
  setupDropZone($dropZoneHeadline, 'application/caption-id', onCaptionDrop);
  setupDropZone($dropZoneCta, 'application/caption-id', onCaptionDrop);

  // Create ad button
  $builderCreateBtn.addEventListener('click', async () => {
    if (!builderState.imageId) return;

    const body = { base_image_id: builderState.imageId };
    if (builderState.captionIds.length > 0) body.caption_ids = builderState.captionIds;
    const bcId = $builderBodycopy.value;
    if (bcId) body.body_copy_id = bcId;

    $builderCreateBtn.disabled = true;
    $builderCreateBtn.textContent = 'Creating...';

    try {
      await authFetch('/api/ads', { method: 'POST', body });
      await loadData();
    } catch (err) {
      console.error('Create ad failed:', err);
      alert('Failed to create ad: ' + err.message);
    } finally {
      $builderCreateBtn.textContent = 'Create Ad';
      renderBuilder();
    }
  });

  // --- Start ---
  boot();
})();
</script>
</body>
</html>
