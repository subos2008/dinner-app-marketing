<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come Join Us — Creative Review</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap');

  :root {
    --cream: #FAF6F1;
    --warm-white: #FFF9F3;
    --amber: #C8956C;
    --amber-light: #E8C9A8;
    --amber-dark: #8B5E3C;
    --charcoal: #2C2826;
    --warm-gray: #6B6461;
    --light-gray: #E8E2DC;
    --red: #C4553A;
    --green: #5B8A5E;
    --pink: #D4668E;
    --gold: #B8963E;
    --blue-gray: #7A8B8F;
    --shadow-sm: 0 1px 3px rgba(44, 40, 38, 0.08);
    --shadow-md: 0 4px 16px rgba(44, 40, 38, 0.1);
    --shadow-lg: 0 8px 32px rgba(44, 40, 38, 0.12);
    --radius: 6px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.6;
    font-weight: 300;
    min-height: 100vh;
  }

  /* --- Top bar --- */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--charcoal);
    color: var(--cream);
    padding: 0 32px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 0.03em;
  }

  .topbar-brand {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .topbar-brand span { opacity: 0.5; font-weight: 300; }

  .topbar-meta {
    opacity: 0.5;
    font-size: 12px;
    font-family: var(--font-mono);
  }

  /* --- Sidebar --- */
  .sidebar {
    position: fixed;
    top: 52px;
    left: 0;
    bottom: 0;
    width: 260px;
    background: var(--warm-white);
    border-right: 1px solid var(--light-gray);
    overflow-y: auto;
    z-index: 90;
    padding: 24px 0;
  }

  .sidebar-section {
    padding: 0 20px;
    margin-bottom: 24px;
  }

  .sidebar-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--warm-gray);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 400;
    color: var(--charcoal);
    transition: all 0.15s;
    margin-bottom: 2px;
  }

  .sidebar-item:hover { background: var(--light-gray); }

  .sidebar-item.active {
    background: var(--charcoal);
    color: var(--cream);
  }

  .sidebar-item .badge {
    margin-left: auto;
    font-size: 11px;
    font-family: var(--font-mono);
    opacity: 0.5;
  }

  .sidebar-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-life { background: var(--amber); }
  .dot-lifestyle { background: var(--blue-gray); }
  .dot-cross { background: var(--gold); }

  /* --- Main content --- */
  .main {
    margin-left: 260px;
    margin-top: 52px;
    padding: 40px 48px;
    max-width: 1100px;
  }

  /* --- Segment header --- */
  .segment-header {
    margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--light-gray);
  }

  .segment-type {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--amber);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .segment-title {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 400;
    line-height: 1.15;
    margin-bottom: 16px;
  }

  .segment-hook {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 20px;
    color: var(--warm-gray);
    line-height: 1.4;
    max-width: 600px;
  }

  .segment-meta {
    display: flex;
    gap: 32px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-size: 13px;
  }

  .meta-item .label {
    font-weight: 600;
    color: var(--warm-gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 10px;
    display: block;
    margin-bottom: 2px;
  }

  /* --- Persona card --- */
  .persona-card {
    background: var(--warm-white);
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 40px;
    position: relative;
  }

  .persona-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--amber);
    border-radius: var(--radius) 0 0 var(--radius);
  }

  .persona-card h3 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 12px;
    color: var(--amber-dark);
  }

  .persona-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--warm-gray);
  }

  /* --- Collapsible sections --- */
  .collapsible {
    margin-bottom: 12px;
  }

  .collapsible-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--warm-gray);
    border-bottom: 1px solid var(--light-gray);
    user-select: none;
  }

  .collapsible-header:hover { color: var(--charcoal); }

  .collapsible-arrow {
    transition: transform 0.2s;
    font-size: 10px;
  }

  .collapsible.open .collapsible-arrow { transform: rotate(90deg); }

  .collapsible-body {
    display: none;
    padding: 16px 0;
  }

  .collapsible.open .collapsible-body { display: block; }

  /* --- Concepts list --- */
  .concept-list {
    list-style: none;
    padding: 0;
  }

  .concept-list li {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    font-size: 15px;
  }

  .concept-rank {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--amber);
    min-width: 20px;
  }

  .concept-name { font-weight: 600; }

  .concept-insight {
    font-size: 13px;
    color: var(--warm-gray);
    margin-top: 4px;
  }

  /* --- Section titles --- */
  .section-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 400;
    margin: 48px 0 24px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--charcoal);
  }

  .section-subtitle {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--warm-gray);
    font-weight: 600;
    margin-bottom: 16px;
  }

  /* --- Ad cards --- */
  .ad-concept-group {
    margin-bottom: 48px;
  }

  .ad-concept-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ad-concept-title .priority-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--amber-light);
    color: var(--amber-dark);
    padding: 2px 8px;
    border-radius: 3px;
  }

  .ad-card {
    background: var(--warm-white);
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .ad-card:hover { box-shadow: var(--shadow-md); }

  .ad-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--light-gray);
    background: rgba(200, 149, 108, 0.04);
  }

  .ad-card-name {
    font-weight: 600;
    font-size: 14px;
  }

  .ad-card-badges {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .format-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--light-gray);
    color: var(--warm-gray);
  }

  .format-badge.feed { background: #E8EAF0; color: #4A5568; }
  .format-badge.story { background: #F0E8F0; color: #6B4A6B; }

  .verdict-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
  }

  .verdict-ship { background: #E8F0E8; color: var(--green); }
  .verdict-polish { background: #FFF3E0; color: #C8801C; }
  .verdict-rework { background: #FDE8E8; color: var(--red); }

  .ad-card-body {
    display: flex;
    gap: 0;
  }

  .ad-card-image {
    width: 240px;
    min-height: 200px;
    flex-shrink: 0;
    background: var(--light-gray);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--warm-gray);
    font-size: 12px;
    overflow: hidden;
    position: relative;
  }

  .ad-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .ad-card-image .no-image {
    text-align: center;
    padding: 20px;
    opacity: 0.5;
  }

  .no-image-icon {
    font-size: 32px;
    margin-bottom: 8px;
    display: block;
    opacity: 0.3;
  }

  .ad-card-copy {
    flex: 1;
    padding: 20px 24px;
  }

  .ad-hook {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 12px;
    color: var(--charcoal);
  }

  .ad-body-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--warm-gray);
    margin-bottom: 12px;
    white-space: pre-line;
  }

  .ad-cta {
    font-weight: 600;
    font-size: 14px;
    color: var(--amber-dark);
    margin-bottom: 8px;
  }

  .ad-cta-button {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    padding: 4px 12px;
    border: 1px solid var(--amber);
    border-radius: 3px;
    color: var(--amber-dark);
  }

  /* Stories/Reels card */
  .story-frames {
    padding: 20px 24px;
  }

  .story-frame {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 6px 0;
    font-size: 14px;
  }

  .frame-number {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--amber);
    min-width: 16px;
  }

  .visual-direction {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--light-gray);
    font-size: 13px;
    color: var(--warm-gray);
    font-style: italic;
  }

  /* --- Scores --- */
  .score-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-top: 1px solid var(--light-gray);
    font-size: 12px;
    background: rgba(0,0,0,0.01);
    flex-wrap: wrap;
  }

  .score-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
  }

  .score-label {
    color: var(--warm-gray);
    font-weight: 400;
  }

  .score-value {
    font-family: var(--font-mono);
    font-weight: 400;
  }

  .score-1, .score-2 { color: var(--red); }
  .score-3 { color: var(--gold); }
  .score-4 { color: var(--blue-gray); }
  .score-5 { color: var(--green); }

  .score-divider {
    width: 1px;
    height: 14px;
    background: var(--light-gray);
  }

  .overall-score {
    margin-left: auto;
    font-weight: 600;
    font-size: 13px;
  }

  /* --- Top ads summary --- */
  .top-ads {
    margin-bottom: 40px;
  }

  .top-ad-item {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--light-gray);
  }

  .top-ad-rank {
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--amber-light);
    min-width: 40px;
  }

  .top-ad-content h4 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .top-ad-content p {
    font-size: 13px;
    color: var(--warm-gray);
    line-height: 1.5;
  }

  .top-ad-score {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 3px;
    background: #E8F0E8;
    color: var(--green);
  }

  /* --- Pain points table --- */
  .pain-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }

  .pain-table th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--warm-gray);
    font-weight: 600;
    padding: 8px 12px;
    border-bottom: 2px solid var(--light-gray);
  }

  .pain-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--light-gray);
    vertical-align: top;
    line-height: 1.5;
    color: var(--warm-gray);
  }

  /* --- Key phrases --- */
  .phrase-category {
    margin-bottom: 16px;
  }

  .phrase-category h4 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--charcoal);
  }

  .phrase-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .phrase-tag {
    font-size: 12px;
    padding: 4px 10px;
    background: var(--cream);
    border: 1px solid var(--light-gray);
    border-radius: 20px;
    color: var(--warm-gray);
    line-height: 1.3;
  }

  /* --- Standout lines --- */
  .standout-line {
    padding: 16px 0;
    border-bottom: 1px solid var(--light-gray);
  }

  .standout-line blockquote {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
    line-height: 1.4;
    color: var(--charcoal);
    margin-bottom: 6px;
  }

  .standout-line .note {
    font-size: 13px;
    color: var(--warm-gray);
  }

  /* --- Empty state --- */
  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--warm-gray);
  }

  .empty-state h2 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 12px;
    color: var(--charcoal);
  }

  .empty-state p {
    font-size: 15px;
    max-width: 400px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* --- Loading --- */
  .loading {
    text-align: center;
    padding: 120px 40px;
    color: var(--warm-gray);
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
  }

  /* --- Quick mode text --- */
  .quick-mode {
    font-size: 14px;
    line-height: 1.8;
    color: var(--warm-gray);
    column-count: 2;
    column-gap: 32px;
    margin-top: 12px;
  }

  @media (max-width: 900px) {
    .quick-mode { column-count: 1; }
  }

  /* --- Stats row --- */
  .stats-row {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--warm-white);
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    padding: 16px 20px;
    min-width: 140px;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 28px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--warm-gray);
    font-weight: 600;
  }

  /* --- Image strip & thumbnails --- */
  .image-strip {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .main-image-area {
    width: 100%;
    min-height: 200px;
    background: var(--light-gray);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .main-image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumb-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px;
  }

  .thumb-item {
    position: relative;
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid var(--light-gray);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .thumb-item:hover {
    box-shadow: var(--shadow-sm);
  }

  .thumb-item.active {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px var(--amber-light);
  }

  .thumb-item.review-approved { border-color: var(--green); }
  .thumb-item.review-rejected { border-color: var(--red); }
  .thumb-item.review-flagged { border-color: var(--gold); }
  .thumb-item.review-liked { border-color: var(--pink); }

  .thumb-item.active.review-approved { box-shadow: 0 0 0 2px rgba(91, 138, 94, 0.3); }
  .thumb-item.active.review-rejected { box-shadow: 0 0 0 2px rgba(196, 85, 58, 0.3); }
  .thumb-item.active.review-flagged { box-shadow: 0 0 0 2px rgba(184, 150, 62, 0.3); }

  .thumb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumb-type-label {
    position: absolute;
    bottom: 1px;
    left: 1px;
    right: 1px;
    font-size: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
    background: rgba(44, 40, 38, 0.7);
    color: var(--cream);
    padding: 1px 2px;
    line-height: 1.2;
  }

  /* --- Review controls --- */
  .review-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 6px 0 2px;
  }

  .review-btn {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--light-gray);
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-body);
    line-height: 1.4;
  }

  .review-btn:hover {
    border-color: var(--warm-gray);
  }

  .review-btn.review-btn-approve.active {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .review-btn.review-btn-reject.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .review-btn.review-btn-flag.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
  }

  .review-btn.review-btn-like.active {
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }

  .review-note-input {
    flex: 1;
    min-width: 140px;
    font-size: 12px;
    font-family: var(--font-body);
    padding: 5px 10px;
    border: 1px solid var(--light-gray);
    border-radius: 4px;
    background: var(--warm-white);
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s;
  }

  .review-note-input:focus {
    border-color: var(--amber);
  }

  .review-note-input::placeholder {
    color: var(--warm-gray);
    opacity: 0.5;
  }

  .review-saving {
    font-size: 11px;
    color: var(--warm-gray);
    font-style: italic;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .review-saving.visible {
    opacity: 1;
  }

  /* --- Ad status badges --- */
  .ad-status-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
  }

  .ad-status-badge.unreviewed {
    background: var(--light-gray);
    color: var(--warm-gray);
  }

  .ad-status-badge.feedback {
    background: #FFF3E0;
    color: #C8801C;
  }

  .ad-status-badge.approved {
    background: #E8F0E8;
    color: var(--green);
  }

  .ad-status-badge.live {
    background: #E0EEF4;
    color: #3A7CA5;
  }

  /* --- Ad status controls --- */
  .ad-status-section {
    padding: 12px 20px;
    border-top: 1px solid var(--light-gray);
    background: rgba(0,0,0,0.015);
  }

  .ad-status-buttons {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .ad-status-btn {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--light-gray);
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
  }

  .ad-status-btn:hover {
    border-color: var(--warm-gray);
  }

  .ad-status-btn.active-unreviewed {
    background: var(--light-gray);
    border-color: var(--warm-gray);
    color: var(--charcoal);
  }

  .ad-status-btn.active-feedback {
    background: #C8801C;
    border-color: #C8801C;
    color: #fff;
  }

  .ad-status-btn.active-approved {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .ad-status-btn.active-live {
    background: #3A7CA5;
    border-color: #3A7CA5;
    color: #fff;
  }

  .ad-feedback-input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--light-gray);
    border-radius: 4px;
    background: var(--warm-white);
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.15s;
    resize: vertical;
    min-height: 36px;
    line-height: 1.5;
  }

  .ad-feedback-input:focus {
    border-color: var(--amber);
  }

  .ad-feedback-input::placeholder {
    color: var(--warm-gray);
    opacity: 0.5;
  }

  .ad-status-saving {
    font-size: 11px;
    color: var(--warm-gray);
    font-style: italic;
    opacity: 0;
    transition: opacity 0.2s;
    margin-left: 8px;
  }

  .ad-status-saving.visible {
    opacity: 1;
  }

  /* --- Gallery status filter bar --- */
  .gallery-filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .gallery-filter-pill {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--light-gray);
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
  }

  .gallery-filter-pill:hover {
    border-color: var(--warm-gray);
    color: var(--charcoal);
  }

  .gallery-filter-pill.active {
    background: var(--charcoal);
    border-color: var(--charcoal);
    color: var(--cream);
  }

  .ad-card.ad-hidden {
    display: none;
  }

  /* --- Responsive --- */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 24px 16px; }
    .segment-title { font-size: 28px; }
    .ad-card-body { flex-direction: column; }
    .ad-card-image { width: 100%; min-height: 160px; }
    .segment-meta { gap: 16px; }
  }

  /* --- View tabs --- */
  .topbar-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 100%;
  }

  .topbar-tab {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--cream);
    opacity: 0.5;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 16px 12px 14px;
    cursor: pointer;
    transition: opacity 0.15s, border-color 0.15s;
    height: 100%;
    display: flex;
    align-items: center;
  }

  .topbar-tab:hover {
    opacity: 0.8;
  }

  .topbar-tab.active {
    opacity: 1;
    border-bottom-color: var(--amber);
    font-weight: 600;
  }

  /* --- Creative page --- */
  .creative-page {
    animation: fadeIn 0.3s ease-out both;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .filter-pill {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--light-gray);
    background: transparent;
    color: var(--warm-gray);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-pill:hover {
    border-color: var(--warm-gray);
    color: var(--charcoal);
  }

  .filter-pill.active {
    background: var(--charcoal);
    border-color: var(--charcoal);
    color: var(--cream);
  }

  .creative-concept-group {
    margin-bottom: 40px;
  }

  .creative-concept-heading {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--light-gray);
  }

  .image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  @media (max-width: 1200px) {
    .image-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 768px) {
    .image-grid { grid-template-columns: 1fr; }
  }

  .creative-card {
    background: var(--warm-white);
    border: 1px solid var(--light-gray);
    border-radius: var(--radius);
    overflow: hidden;
    transition: box-shadow 0.2s;
    animation: fadeIn 0.3s ease-out both;
  }

  .creative-card:hover {
    box-shadow: var(--shadow-md);
  }

  .creative-card.hidden {
    display: none;
  }

  .creative-card-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--light-gray);
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }

  .creative-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.2s;
  }

  .creative-card-image:hover img {
    transform: scale(1.03);
  }

  .creative-card-info {
    padding: 12px 14px;
  }

  .creative-card-filename {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--warm-gray);
    margin-bottom: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .creative-card-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .type-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 3px;
  }

  .type-badge.base {
    background: #E8EAF0;
    color: #4A5568;
  }

  .type-badge.composited {
    background: #F0E8F0;
    color: #6B4A6B;
  }

  .status-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 3px;
  }

  .status-badge.approved {
    background: #E8F0E8;
    color: var(--green);
  }

  .status-badge.rejected {
    background: #FDE8E8;
    color: var(--red);
  }

  .status-badge.flagged {
    background: #FFF3E0;
    color: var(--gold);
  }

  .status-badge.liked {
    background: #F8E8F0;
    color: var(--pink);
  }

  .creative-card .review-controls {
    padding: 4px 0 0;
  }

  .creative-card .review-note-input {
    min-width: 0;
    width: 100%;
    margin-top: 6px;
  }

  /* --- Lightbox --- */
  .lightbox-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(44, 40, 38, 0.85);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    animation: fadeIn 0.2s ease-out both;
  }

  .lightbox-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    cursor: default;
  }

  /* --- Creative page empty state --- */
  .creative-empty {
    text-align: center;
    padding: 60px 40px;
    color: var(--warm-gray);
  }

  .creative-empty h3 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 8px;
    color: var(--charcoal);
  }

  .creative-empty p {
    font-size: 14px;
    max-width: 360px;
    margin: 0 auto;
  }

  /* --- Animations --- */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    animation: fadeIn 0.3s ease-out both;
  }

  .ad-card { animation: fadeIn 0.3s ease-out both; }
  .ad-concept-group:nth-child(2) .ad-card { animation-delay: 0.05s; }
  .ad-concept-group:nth-child(3) .ad-card { animation-delay: 0.1s; }
  .ad-concept-group:nth-child(4) .ad-card { animation-delay: 0.15s; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Come Join Us <span>Creative Review</span></div>
  <div class="topbar-tabs" id="topbar-tabs">
    <button class="topbar-tab active" data-view="gallery">Ad Gallery</button>
    <button class="topbar-tab" data-view="creative">Creative</button>
  </div>
  <div class="topbar-meta" id="topbar-meta"></div>
</div>

<nav class="sidebar" id="sidebar"></nav>

<main class="main" id="main">
  <div class="loading">Loading creative review...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function() {
  let DATA = null;
  let activeSegment = null;
  let activeView = 'gallery';
  let activeCreativeFilter = 'all';
  let activeStatusFilter = 'all';
  let supabaseClient = null;
  let authToken = null;

  // --- Auth: fetch wrapper that includes JWT ---
  async function authFetch(url, opts = {}) {
    if (authToken) {
      opts.headers = opts.headers || {};
      opts.headers['Authorization'] = `Bearer ${authToken}`;
    }
    return fetch(url, opts);
  }

  // --- Image URL helper (Supabase Storage or local filesystem) ---
  function imageUrl(seg, filename) {
    if (DATA && DATA.storageBaseUrl) {
      return `${DATA.storageBaseUrl}/${seg.slug}/${filename}`;
    }
    return `/${seg.creativePath}/${filename}`;
  }

  // --- Auth: login screen ---
  function showLogin(supabaseUrl, supabaseAnonKey) {
    supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
    let booted = false;

    // onAuthStateChange fires after the client processes URL hash tokens.
    // This is the primary mechanism for detecting magic link returns.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        authToken = session.access_token;
        if (!booted) {
          booted = true;
          window.history.replaceState(null, '', window.location.pathname);
          loadData();
        }
      } else if (!booted) {
        booted = true;
        authToken = null;
        renderLoginForm();
      }
    });
  }

  function renderLoginForm() {
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('main').innerHTML = `
      <div style="max-width: 380px; margin: 120px auto; text-align: center;">
        <h1 style="font-family: var(--font-display); font-size: 32px; font-weight: 400; margin-bottom: 8px;">Come Join Us</h1>
        <p style="color: var(--warm-gray); margin-bottom: 40px; font-size: 15px;">Creative Review</p>
        <div id="login-form">
          <input type="email" id="login-email" placeholder="Email address"
            style="width: 100%; padding: 12px 16px; border: 1px solid var(--light-gray); border-radius: var(--radius); font-family: var(--font-body); font-size: 15px; margin-bottom: 16px; background: var(--warm-white);">
          <button id="login-btn" onclick="window._sendMagicLink()"
            style="width: 100%; padding: 12px; background: var(--charcoal); color: var(--cream); border: none; border-radius: var(--radius); font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.02em;">
            Send magic link
          </button>
          <p id="login-msg" style="margin-top: 16px; font-size: 13px; color: var(--warm-gray);"></p>
        </div>
      </div>`;

    document.getElementById('login-email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window._sendMagicLink();
    });
  }

  window._sendMagicLink = async function() {
    const email = document.getElementById('login-email').value.trim();
    const msg = document.getElementById('login-msg');
    const btn = document.getElementById('login-btn');

    if (!email) { msg.textContent = 'Enter your email.'; return; }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    const { error } = await supabaseClient.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin }
    });

    if (error) {
      msg.style.color = 'var(--red)';
      msg.textContent = error.message;
      btn.disabled = false;
      btn.textContent = 'Send magic link';
    } else {
      msg.style.color = 'var(--green)';
      msg.textContent = 'Check your email for the login link.';
    }
  };

  // --- Load data ---
  async function loadData() {
    document.getElementById('sidebar').style.display = '';
    try {
      const res = await authFetch('/api/data');
      if (res.status === 401) {
        renderLoginForm();
        return;
      }
      DATA = await res.json();
      init();
    } catch (e) {
      document.getElementById('main').innerHTML = `
        <div class="empty-state">
          <h2>No data found</h2>
          <p>Run <code>node app/server.js</code> to start the server, or <code>node app/build.js</code> to generate data.json.</p>
        </div>
      `;
    }
  }

  function init() {
    document.getElementById('topbar-meta').textContent =
      DATA.segmentCount + ' segments \u00B7 ' + new Date(DATA.generatedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    renderSidebar();

    // Parse URL for segment + view
    const route = parseRoute(window.location.pathname);
    if (route && DATA.segments.find(s => s.slug === route.slug)) {
      activeView = route.view;
      document.querySelectorAll('.topbar-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.view === activeView);
      });
      selectSegment(route.slug, true);
    } else if (DATA.segments.length) {
      selectSegment(DATA.segments[0].slug);
    }
  }

  function parseRoute(pathname) {
    const match = pathname.match(/^\/segment\/([^/]+)\/(gallery|creative)$/);
    if (match) return { slug: match[1], view: match[2] };
    return null;
  }

  function updateURL() {
    if (activeSegment) {
      const url = '/segment/' + activeSegment + '/' + activeView;
      if (window.location.pathname !== url) {
        history.pushState({ slug: activeSegment, view: activeView }, '', url);
      }
    }
  }

  window.addEventListener('popstate', function(e) {
    if (e.state && e.state.slug && e.state.view) {
      activeView = e.state.view;
      activeCreativeFilter = 'all';
      activeStatusFilter = 'all';
      document.querySelectorAll('.topbar-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.view === activeView);
      });
      activeSegment = e.state.slug;
      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.toggle('active', el.dataset.slug === e.state.slug);
      });
      renderActiveView(e.state.slug);
    } else {
      const route = parseRoute(window.location.pathname);
      if (route) {
        activeView = route.view;
        document.querySelectorAll('.topbar-tab').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.view === activeView);
        });
        selectSegment(route.slug, true);
      }
    }
  });

  // --- Sidebar ---
  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    const lifeSit = DATA.segments.filter(s => s.profile?.type?.includes('Life-situation'));
    const lifestyle = DATA.segments.filter(s => s.profile?.type?.includes('Lifestyle'));
    const cross = DATA.segments.filter(s => !s.profile?.type);

    let html = '';

    if (lifeSit.length) {
      html += `<div class="sidebar-section">
        <div class="sidebar-section-title">Life-Situation</div>
        ${lifeSit.map(s => sidebarItem(s, 'life')).join('')}
      </div>`;
    }

    if (lifestyle.length) {
      html += `<div class="sidebar-section">
        <div class="sidebar-section-title">Lifestyle</div>
        ${lifestyle.map(s => sidebarItem(s, 'lifestyle')).join('')}
      </div>`;
    }

    if (cross.length) {
      html += `<div class="sidebar-section">
        <div class="sidebar-section-title">Cross-Segment</div>
        ${cross.map(s => sidebarItem(s, 'cross')).join('')}
      </div>`;
    }

    sidebar.innerHTML = html;

    sidebar.querySelectorAll('.sidebar-item').forEach(el => {
      el.addEventListener('click', () => selectSegment(el.dataset.slug));
    });
  }

  function sidebarItem(seg, type) {
    const counts = countAdsByStatus(seg);
    const actionable = counts.unreviewed + counts.feedback;
    return `<div class="sidebar-item" data-slug="${seg.slug}">
      <span class="dot dot-${type}"></span>
      ${seg.name}
      <span class="badge">${actionable > 0 ? actionable : ''}</span>
    </div>`;
  }

  function selectSegment(slug, skipPush) {
    activeSegment = slug;
    document.querySelectorAll('.sidebar-item').forEach(el => {
      el.classList.toggle('active', el.dataset.slug === slug);
    });
    renderActiveView(slug);
    window.scrollTo({ top: 0 });
    if (!skipPush) updateURL();
  }

  function renderActiveView(slug) {
    if (activeView === 'creative') {
      renderCreativePage(slug);
    } else {
      renderSegment(slug);
    }
  }

  function switchView(view) {
    if (view === activeView) return;
    activeView = view;
    activeCreativeFilter = 'all';
    activeStatusFilter = 'all';
    document.querySelectorAll('.topbar-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.view === view);
    });
    if (activeSegment) {
      renderActiveView(activeSegment);
      window.scrollTo({ top: 0 });
    }
    updateURL();
  }

  // --- Segment renderer ---
  function renderSegment(slug) {
    const seg = DATA.segments.find(s => s.slug === slug);
    if (!seg) return;

    const main = document.getElementById('main');
    let html = '';

    // Header
    html += renderHeader(seg);

    // Stats
    html += renderStats(seg);

    // Persona card
    if (seg.empathy?.personaSnapshot) {
      html += renderPersona(seg);
    }

    // Top ads (if review exists)
    if (seg.review?.topAds?.length) {
      html += renderTopAds(seg);
    }

    // Ad gallery
    html += renderAdGallery(seg);

    // Empathy detail (collapsible)
    if (seg.empathy) {
      html += renderEmpathyDetail(seg);
    }

    // Concepts (collapsible)
    if (seg.concepts?.priority?.length) {
      html += renderConceptsList(seg);
    }

    main.innerHTML = html;

    // Wire up collapsibles
    main.querySelectorAll('.collapsible-header').forEach(el => {
      el.addEventListener('click', () => {
        el.parentElement.classList.toggle('open');
      });
    });
  }

  function renderHeader(seg) {
    const p = seg.profile;
    return `<div class="segment-header fade-in">
      ${p?.type ? `<div class="segment-type">${esc(p.type)}</div>` : ''}
      <h1 class="segment-title">${esc(seg.name)}</h1>
      ${p?.messagingHook ? `<div class="segment-hook">${esc(p.messagingHook)}</div>` : ''}
      ${p ? `<div class="segment-meta">
        ${p.ageSkew ? `<div class="meta-item"><span class="label">Age</span>${esc(p.ageSkew)}</div>` : ''}
        ${p.priority ? `<div class="meta-item"><span class="label">Priority</span>${esc(p.priority)}</div>` : ''}
        ${p.who ? `<div class="meta-item"><span class="label">Who</span>${esc(p.who.substring(0, 80))}${p.who.length > 80 ? '...' : ''}</div>` : ''}
      </div>` : ''}
    </div>`;
  }

  function renderStats(seg) {
    const adCount = seg.adCopy?.concepts?.reduce((sum, c) => sum + c.feedAds.length + c.storiesReels.length, 0) || 0;
    const feedCount = seg.adCopy?.concepts?.reduce((sum, c) => sum + c.feedAds.length, 0) || 0;
    const storyCount = seg.adCopy?.concepts?.reduce((sum, c) => sum + c.storiesReels.length, 0) || 0;
    const imageCount = seg.images?.length || 0;
    const avgScore = seg.review?.ads?.length
      ? (seg.review.ads.reduce((sum, a) => sum + (a.overall || 0), 0) / seg.review.ads.length).toFixed(1)
      : null;

    return `<div class="stats-row fade-in">
      <div class="stat-card">
        <div class="stat-value">${adCount}</div>
        <div class="stat-label">Total Ads</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${feedCount}</div>
        <div class="stat-label">Feed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${storyCount}</div>
        <div class="stat-label">Stories/Reels</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${imageCount}</div>
        <div class="stat-label">Images</div>
      </div>
      ${avgScore ? `<div class="stat-card">
        <div class="stat-value">${avgScore}</div>
        <div class="stat-label">Avg Score</div>
      </div>` : ''}
    </div>`;
  }

  function renderPersona(seg) {
    return `<div class="persona-card fade-in">
      <h3>Persona</h3>
      <div class="persona-text">${esc(seg.empathy.personaSnapshot)}</div>
    </div>`;
  }

  function renderTopAds(seg) {
    return `<div class="top-ads fade-in">
      <div class="section-subtitle">Top Rated</div>
      ${seg.review.topAds.map((ad, i) => `
        <div class="top-ad-item">
          <div class="top-ad-rank">${i + 1}</div>
          <div class="top-ad-content">
            <h4>${esc(ad.name)} <span class="top-ad-score">${ad.score}/5</span></h4>
            <p>${esc(ad.summary)}</p>
          </div>
        </div>
      `).join('')}

  // --- Creative review page ---
  function renderCreativePage(slug) {
    const seg = DATA.segments.find(s => s.slug === slug);
    if (!seg) return;

    const main = document.getElementById('main');
    const images = seg.images || [];

    if (!images.length) {
      main.innerHTML = renderHeader(seg) + `
        <div class="creative-empty">
          <h3>No creative yet</h3>
          <p>Run /generate-creative to create images for this segment.</p>
        </div>`;
      return;
    }

    // Group images by concept
    const conceptGroups = {};
    for (const img of images) {
      const key = img.concept || 'Uncategorised';
      if (!conceptGroups[key]) conceptGroups[key] = [];
      conceptGroups[key].push(img);
    }

    // Count for filter bar
    const baseCount = images.filter(i => i.type === 'base').length;
    const compCount = images.filter(i => i.type === 'composited').length;
    const likedCount = images.filter(i => i.review?.status === 'liked').length;
    const unapprovedCount = images.filter(i => !i.review?.status || i.review.status !== 'approved').length;

    let html = renderHeader(seg);

    // Filter bar
    html += `<div class="filter-bar">
      <button class="filter-pill${activeCreativeFilter === 'all' ? ' active' : ''}" data-filter="all">All (${images.length})</button>
      <button class="filter-pill${activeCreativeFilter === 'base' ? ' active' : ''}" data-filter="base">Bases (${baseCount})</button>
      <button class="filter-pill${activeCreativeFilter === 'composited' ? ' active' : ''}" data-filter="composited">Composited (${compCount})</button>
      <button class="filter-pill${activeCreativeFilter === 'liked' ? ' active' : ''}" data-filter="liked">Liked (${likedCount})</button>
      <button class="filter-pill${activeCreativeFilter === 'unapproved' ? ' active' : ''}" data-filter="unapproved">Unapproved (${unapprovedCount})</button>
    </div>`;

    html += `<div class="creative-page">`;

    for (const [conceptName, conceptImages] of Object.entries(conceptGroups)) {
      // Sort: bases first, then composited, then by filename
      conceptImages.sort((a, b) => {
        if (a.type === 'base' && b.type !== 'base') return -1;
        if (a.type !== 'base' && b.type === 'base') return 1;
        return a.filename.localeCompare(b.filename);
      });

      html += `<div class="creative-concept-group">
        <div class="creative-concept-heading">${esc(conceptName)}</div>
        <div class="image-grid">`;

      for (const img of conceptImages) {
        const imgSrc = imageUrl(seg, img.filename);
        const reviewStatus = img.review?.status || '';
        const reviewNote = img.review?.note || '';

        // Determine hidden state based on active filter
        let hidden = false;
        if (activeCreativeFilter === 'base' && img.type !== 'base') hidden = true;
        if (activeCreativeFilter === 'composited' && img.type !== 'composited') hidden = true;
        if (activeCreativeFilter === 'unapproved' && reviewStatus === 'approved') hidden = true;

        html += `<div class="creative-card${hidden ? ' hidden' : ''}" data-type="${esc(img.type || '')}" data-status="${esc(reviewStatus)}">
          <div class="creative-card-image" data-src="${esc(imgSrc)}">
            <img src="${imgSrc}" alt="${esc(img.filename)}" loading="lazy">
          </div>
          <div class="creative-card-info">
            <div class="creative-card-filename" title="${esc(img.filename)}">${esc(img.filename)}</div>
            <div class="creative-card-badges">
              <span class="type-badge ${esc(img.type || 'base')}">${img.type === 'composited' ? 'composited' : 'base'}</span>
              ${img.format ? `<span class="format-badge ${img.format === 'feed' ? 'feed' : 'story'}">${esc(img.format)}</span>` : ''}
              ${reviewStatus ? `<span class="status-badge ${esc(reviewStatus)}">${esc(reviewStatus)}</span>` : ''}
            </div>
            <div class="review-controls" data-slug="${esc(seg.slug)}" data-filename="${esc(img.filename)}">
              <button class="review-btn review-btn-like${reviewStatus === 'liked' ? ' active' : ''}" data-status="liked">Like</button>
              <button class="review-btn review-btn-approve${reviewStatus === 'approved' ? ' active' : ''}" data-status="approved">Approve</button>
              <button class="review-btn review-btn-reject${reviewStatus === 'rejected' ? ' active' : ''}" data-status="rejected">Reject</button>
              <button class="review-btn review-btn-flag${reviewStatus === 'flagged' ? ' active' : ''}" data-status="flagged">Flag</button>
              <input class="review-note-input" type="text" placeholder="Add a note..." value="${esc(reviewNote)}">
              <span class="review-saving">Saved</span>
            </div>
          </div>
        </div>`;
      }

      html += `</div></div>`;
    }

    html += `</div>`;
    main.innerHTML = html;
  }

  function applyCreativeFilter(filter) {
    activeCreativeFilter = filter;

    // Update pill states
    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.classList.toggle('active', pill.dataset.filter === filter);
    });

    // Show/hide cards
    document.querySelectorAll('.creative-card').forEach(card => {
      const type = card.dataset.type;
      const status = card.dataset.status;
      let hidden = false;

      if (filter === 'base' && type !== 'base') hidden = true;
      if (filter === 'composited' && type !== 'composited') hidden = true;
      if (filter === 'liked' && status !== 'liked') hidden = true;
      if (filter === 'unapproved' && status === 'approved') hidden = true;

      card.classList.toggle('hidden', hidden);
    });
  }

  function applyGalleryStatusFilter(filter) {
    activeStatusFilter = filter;

    // Update pill states
    document.querySelectorAll('.gallery-filter-pill').forEach(pill => {
      pill.classList.toggle('active', pill.dataset.statusFilter === filter);
    });

    // Show/hide ad cards
    document.querySelectorAll('.ad-card[data-ad-id]').forEach(card => {
      if (filter === 'all') {
        card.classList.remove('ad-hidden');
      } else {
        card.classList.toggle('ad-hidden', card.dataset.adStatus !== filter);
      }
    });
  }

  function updateGalleryFilterCounts() {
    const seg = DATA.segments.find(s => s.slug === activeSegment);
    if (!seg) return;
    const counts = countAdsByStatus(seg);
    const bar = document.getElementById('gallery-filter-bar');
    if (!bar) return;
    bar.querySelectorAll('.gallery-filter-pill').forEach(pill => {
      const f = pill.dataset.statusFilter;
      const count = counts[f] || 0;
      const label = f === 'all' ? 'All' : f.charAt(0).toUpperCase() + f.slice(1);
      pill.textContent = `${label} (${count})`;
    });
  }

  function updateSidebarBadge(slug) {
    const seg = DATA.segments.find(s => s.slug === slug);
    if (!seg) return;
    const counts = countAdsByStatus(seg);
    const actionable = counts.unreviewed + counts.feedback;
    const sidebarItem = document.querySelector(`.sidebar-item[data-slug="${slug}"] .badge`);
    if (sidebarItem) {
      sidebarItem.textContent = actionable > 0 ? actionable : '';
    }
  }

  // --- Standout lines (in review top section) ---
  // Included inside renderTopAds if standoutLines exist
  // (Already handled via review.topAds)

  // --- Helpers ---
  function findReview(seg, adHeader) {
    if (!seg.review?.ads) return null;
    // Match by header name (fuzzy — remove leading ** and trim)
    const clean = adHeader.replace(/^\*\*/,'').trim();
    return seg.review.ads.find(a => {
      return a.name === clean || a.name.startsWith(clean) || clean.startsWith(a.name);
    });
  }

  function findImages(seg, conceptName, format) {
    if (!seg.images || !seg.images.length) return [];
    return seg.images
      .filter(img => img.concept === conceptName && img.format === format)
      .sort((a, b) => {
        // bases first, then composited, then by filename
        if (a.type === 'base' && b.type !== 'base') return -1;
        if (a.type !== 'base' && b.type === 'base') return 1;
        return a.filename.localeCompare(b.filename);
      });
  }

  function getVerdictClass(verdict) {
    if (!verdict) return '';
    const v = verdict.toLowerCase();
    if (v.startsWith('ship')) return 'verdict-ship';
    if (v.startsWith('polish')) return 'verdict-polish';
    if (v.startsWith('rework') || v.startsWith('rewrite')) return 'verdict-rework';
    return 'verdict-ship';
  }

  function esc(str) {
    if (!str) return '';
    const el = document.createElement('span');
    el.textContent = str;
    return el.innerHTML;
  }

  // --- Review API ---
  async function saveReview(slug, filename, status, note) {
    try {
      const res = await authFetch(`/api/segments/${encodeURIComponent(slug)}/reviews/${encodeURIComponent(filename)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: status || null, note: note || '' }),
      });
      if (!res.ok) throw new Error('Save failed');
      return await res.json();
    } catch (e) {
      console.error('Failed to save review:', e);
      return null;
    }
  }

  // Update the in-memory image review data
  function updateLocalImageReview(slug, filename, status, note) {
    const seg = DATA.segments.find(s => s.slug === slug);
    if (!seg || !seg.images) return;
    const img = seg.images.find(i => i.filename === filename);
    if (img) {
      img.review = { status: status || null, note: note || '' };
    }
  }

  // Get image review data from local state
  function getLocalImageReview(slug, filename) {
    const seg = DATA.segments.find(s => s.slug === slug);
    if (!seg || !seg.images) return null;
    const img = seg.images.find(i => i.filename === filename);
    return img?.review || null;
  }

  // Flash the "Saved" indicator
  function flashSaved(controls) {
    const indicator = controls.querySelector('.review-saving');
    if (indicator) {
      indicator.textContent = 'Saved';
      indicator.classList.add('visible');
      setTimeout(() => indicator.classList.remove('visible'), 1200);
    }
  }

  // Refresh review status classes on a thumbnail
  function refreshThumbStatus(strip, filename, status) {
    const thumb = strip.querySelector(`.thumb-item[data-filename="${filename}"]`);
    if (!thumb) return;
    thumb.classList.remove('review-approved', 'review-rejected', 'review-flagged', 'review-liked');
    if (status) {
      thumb.classList.add(`review-${status}`);
    }
  }

  // Update review controls to reflect current state
  function syncReviewControls(controls, status, note) {
    controls.querySelectorAll('.review-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.status === status);
    });
    const input = controls.querySelector('.review-note-input');
    if (input && input !== document.activeElement) {
      input.value = note || '';
    }
  }

  // --- Ad status helpers ---
  function slugifyHeader(header) {
    return header
      .toLowerCase()
      .replace(/\u2014/g, '-')  // em dash
      .replace(/\u2013/g, '-')  // en dash
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function getAdStatus(seg, adId) {
    return seg.adStatus?.[adId] || null;
  }

  function getAdStatusLabel(seg, adId) {
    const entry = getAdStatus(seg, adId);
    return entry?.status || 'unreviewed';
  }

  async function saveAdStatus(slug, adId, status, feedback) {
    try {
      const res = await authFetch(`/api/segments/${encodeURIComponent(slug)}/ad-status/${encodeURIComponent(adId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: status || 'unreviewed', feedback: feedback || '' }),
      });
      if (!res.ok) throw new Error('Save failed');
      return await res.json();
    } catch (e) {
      console.error('Failed to save ad status:', e);
      return null;
    }
  }

  function updateLocalAdStatus(slug, adId, status, feedback) {
    const seg = DATA.segments.find(s => s.slug === slug);
    if (!seg) return;
    if (!seg.adStatus) seg.adStatus = {};
    seg.adStatus[adId] = {
      status: status || 'unreviewed',
      feedback: feedback || '',
      updatedAt: new Date().toISOString()
    };
  }

  // Count ads by status for a segment
  function countAdsByStatus(seg) {
    const counts = { all: 0, unreviewed: 0, feedback: 0, approved: 0, live: 0 };
    if (!seg.adCopy?.concepts) return counts;
    for (const concept of seg.adCopy.concepts) {
      for (const ad of concept.feedAds) {
        const adId = slugifyHeader(ad.header);
        const status = getAdStatusLabel(seg, adId);
        counts.all++;
        counts[status] = (counts[status] || 0) + 1;
      }
      for (const ad of concept.storiesReels) {
        const adId = slugifyHeader(ad.header);
        const status = getAdStatusLabel(seg, adId);
        counts.all++;
        counts[status] = (counts[status] || 0) + 1;
      }
    }
    return counts;
  }

  // --- Event delegation for image strip + review controls ---
  document.getElementById('main').addEventListener('click', function(e) {
    // Thumbnail click — swap main image
    const thumb = e.target.closest('.thumb-item');
    if (thumb) {
      const strip = thumb.closest('.image-strip');
      if (!strip) return;

      const slug = strip.dataset.slug;
      const filename = thumb.dataset.filename;

      // Update active thumbnail
      strip.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');

      // Swap main image
      const mainArea = strip.querySelector('.main-image-area');
      const seg = DATA.segments.find(s => s.slug === slug);
      if (mainArea && seg) {
        mainArea.innerHTML = `<img src="${imageUrl(seg, filename)}" alt="${esc(filename)}">`;
      }

      // Update strip active filename
      strip.dataset.activeFilename = filename;

      // Update review controls to reflect this image's review
      const controls = strip.querySelector('.review-controls');
      if (controls) {
        controls.dataset.filename = filename;
        const review = getLocalImageReview(slug, filename);
        syncReviewControls(controls, review?.status || '', review?.note || '');
      }

      return;
    }

    // Review button click
    const reviewBtn = e.target.closest('.review-btn');
    if (reviewBtn) {
      const controls = reviewBtn.closest('.review-controls');
      if (!controls) return;

      const slug = controls.dataset.slug;
      const filename = controls.dataset.filename;
      if (!slug || !filename) return;

      const currentReview = getLocalImageReview(slug, filename);
      const currentStatus = currentReview?.status || '';
      const clickedStatus = reviewBtn.dataset.status;

      // Toggle: if clicking the already-active status, clear it
      const newStatus = (clickedStatus === currentStatus) ? null : clickedStatus;
      const note = controls.querySelector('.review-note-input')?.value || '';

      // Update buttons immediately
      controls.querySelectorAll('.review-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === newStatus);
      });

      // Update local data
      updateLocalImageReview(slug, filename, newStatus, note);

      // Update thumbnail border (gallery view)
      const strip = controls.closest('.image-strip');
      if (strip) {
        refreshThumbStatus(strip, filename, newStatus);
      }

      // Update creative card badge and data attr (creative view)
      const card = controls.closest('.creative-card');
      if (card) {
        card.dataset.status = newStatus || '';
        const badgesEl = card.querySelector('.creative-card-badges');
        if (badgesEl) {
          const existingBadge = badgesEl.querySelector('.status-badge');
          if (existingBadge) existingBadge.remove();
          if (newStatus) {
            const badge = document.createElement('span');
            badge.className = `status-badge ${newStatus}`;
            badge.textContent = newStatus;
            badgesEl.appendChild(badge);
          }
        }
        // Re-apply filter visibility
        if (activeView === 'creative') {
          let hidden = false;
          if (activeCreativeFilter === 'base' && card.dataset.type !== 'base') hidden = true;
          if (activeCreativeFilter === 'composited' && card.dataset.type !== 'composited') hidden = true;
          if (activeCreativeFilter === 'liked' && newStatus !== 'liked') hidden = true;
          if (activeCreativeFilter === 'unapproved' && newStatus === 'approved') hidden = true;
          card.classList.toggle('hidden', hidden);
        }
      }

      // Save to server
      saveReview(slug, filename, newStatus, note).then(result => {
        if (result) flashSaved(controls);
      });

      return;
    }
  });

  // Note input — save on blur
  document.getElementById('main').addEventListener('focusout', function(e) {
    if (!e.target.classList.contains('review-note-input')) return;

    const controls = e.target.closest('.review-controls');
    if (!controls) return;

    const slug = controls.dataset.slug;
    const filename = controls.dataset.filename;
    if (!slug || !filename) return;

    const note = e.target.value;
    const review = getLocalImageReview(slug, filename);
    const status = review?.status || null;

    // Only save if note actually changed
    const oldNote = review?.note || '';
    if (note === oldNote) return;

    updateLocalImageReview(slug, filename, status, note);

    saveReview(slug, filename, status, note).then(result => {
      if (result) flashSaved(controls);
    });
  });

  // Also save on Enter key in note input
  document.getElementById('main').addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (!e.target.classList.contains('review-note-input')) return;

    e.target.blur(); // triggers focusout handler above
  });

  // --- Ad status button click ---
  document.getElementById('main').addEventListener('click', function(e) {
    const statusBtn = e.target.closest('.ad-status-btn');
    if (!statusBtn) return;

    const section = statusBtn.closest('.ad-status-section');
    if (!section) return;

    const slug = section.dataset.slug;
    const adId = section.dataset.adId;
    if (!slug || !adId) return;

    const newStatus = statusBtn.dataset.adStatus;
    const feedback = section.querySelector('.ad-feedback-input')?.value || '';

    // Update button active states
    section.querySelectorAll('.ad-status-btn').forEach(btn => {
      btn.classList.remove('active-unreviewed', 'active-feedback', 'active-approved', 'active-live');
      if (btn.dataset.adStatus === newStatus) {
        btn.classList.add(`active-${newStatus}`);
      }
    });

    // Update the badge in the card header
    const card = section.closest('.ad-card');
    if (card) {
      card.dataset.adStatus = newStatus;
      const badge = card.querySelector('.ad-status-badge');
      if (badge) {
        badge.className = `ad-status-badge ${newStatus}`;
        badge.textContent = newStatus;
      }
      // Re-apply gallery filter
      if (activeView === 'gallery' && activeStatusFilter !== 'all') {
        card.classList.toggle('ad-hidden', newStatus !== activeStatusFilter);
      }
    }

    // Update local data
    updateLocalAdStatus(slug, adId, newStatus, feedback);

    // Update filter bar counts
    updateGalleryFilterCounts();

    // Update sidebar badge
    updateSidebarBadge(slug);

    // Save to server
    saveAdStatus(slug, adId, newStatus, feedback).then(result => {
      if (result) {
        const indicator = section.querySelector('.ad-status-saving');
        if (indicator) {
          indicator.textContent = 'Saved';
          indicator.classList.add('visible');
          setTimeout(() => indicator.classList.remove('visible'), 1200);
        }
      }
    });
  });

  // --- Ad feedback textarea — save on blur ---
  document.getElementById('main').addEventListener('focusout', function(e) {
    if (!e.target.classList.contains('ad-feedback-input')) return;

    const section = e.target.closest('.ad-status-section');
    if (!section) return;

    const slug = section.dataset.slug;
    const adId = section.dataset.adId;
    if (!slug || !adId) return;

    const feedback = e.target.value;
    const seg = DATA.segments.find(s => s.slug === slug);
    const oldEntry = getAdStatus(seg, adId);
    const oldFeedback = oldEntry?.feedback || '';
    if (feedback === oldFeedback) return;

    const status = oldEntry?.status || 'unreviewed';
    updateLocalAdStatus(slug, adId, status, feedback);

    saveAdStatus(slug, adId, status, feedback).then(result => {
      if (result) {
        const indicator = section.querySelector('.ad-status-saving');
        if (indicator) {
          indicator.textContent = 'Saved';
          indicator.classList.add('visible');
          setTimeout(() => indicator.classList.remove('visible'), 1200);
        }
      }
    });
  });

  // --- View tab switching ---
  document.getElementById('topbar-tabs').addEventListener('click', function(e) {
    const tab = e.target.closest('.topbar-tab');
    if (tab) switchView(tab.dataset.view);
  });

  // --- Filter bar clicks ---
  document.getElementById('main').addEventListener('click', function(e) {
    const pill = e.target.closest('.filter-pill');
    if (pill) {
      applyCreativeFilter(pill.dataset.filter);
      return;
    }

    // Gallery filter pill click
    const galleryPill = e.target.closest('.gallery-filter-pill');
    if (galleryPill) {
      applyGalleryStatusFilter(galleryPill.dataset.statusFilter);
      return;
    }

    // Creative card image click — open lightbox
    const cardImage = e.target.closest('.creative-card-image');
    if (cardImage) {
      const src = cardImage.dataset.src;
      if (src) openLightbox(src);
      return;
    }

    // Lightbox close
    if (e.target.closest('.lightbox-overlay')) {
      closeLightbox();
      return;
    }
  });

  function openLightbox(src) {
    const overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    overlay.innerHTML = `<img src="${src}" alt="Full size">`;
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeLightbox();
    });
    document.body.appendChild(overlay);

    // Close on Escape
    overlay._escHandler = function(e) {
      if (e.key === 'Escape') closeLightbox();
    };
    document.addEventListener('keydown', overlay._escHandler);
  }

  function closeLightbox() {
    const overlay = document.querySelector('.lightbox-overlay');
    if (overlay) {
      if (overlay._escHandler) document.removeEventListener('keydown', overlay._escHandler);
      overlay.remove();
    }
  }

  // --- Live reload via SSE ---
  function connectSSE() {
    const es = new EventSource('/api/events');
    es.onmessage = async function(e) {
      if (e.data === 'reload' && DATA) {
        const scrollY = window.scrollY;
        try {
          const res = await authFetch('/api/data');
          if (res.status === 401) { renderLoginForm(); return; }
          DATA = await res.json();
          renderSidebar();
          if (activeSegment) {
            selectSegment(activeSegment, true);
            requestAnimationFrame(() => window.scrollTo(0, scrollY));
          }
        } catch (err) {
          console.error('Live reload fetch failed:', err);
        }
      }
    };
    es.onerror = function() {
      es.close();
      setTimeout(connectSSE, 3000);
    };
  }

  // --- Init: check auth config, then boot ---
  async function boot() {
    try {
      const cfgRes = await fetch('/api/config');
      const cfg = await cfgRes.json();
      if (cfg.supabaseUrl) {
        showLogin(cfg.supabaseUrl, cfg.supabaseAnonKey);
      } else {
        loadData();
      }
    } catch {
      loadData();
    }
    connectSSE();
  }
  boot();
})();
</script>
</body>
</html>
